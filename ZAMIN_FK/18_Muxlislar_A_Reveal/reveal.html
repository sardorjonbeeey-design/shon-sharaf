<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MZ;font-weight:900;src:url(../web/city/assets/fonts/Montserrat_900Black.ttf)}
@font-face{font-family:MZ;font-weight:700;src:url(../web/city/assets/fonts/Montserrat_700Bold.ttf)}
html,body{margin:0;background:#020810;overflow:hidden;width:1080px;height:1920px;font-family:MZ,sans-serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px}
#scrim{position:absolute;left:0;top:0;width:1080px;height:1920px;
  background:radial-gradient(ellipse 70% 55% at 50% 50%,rgba(2,8,16,0) 0%,rgba(2,8,16,.55) 65%,rgba(2,8,16,.92) 100%)}
#tint{position:absolute;left:0;top:0;width:1080px;height:1920px;
  background:linear-gradient(160deg,rgba(10,30,60,.55) 0%,rgba(0,40,10,.25) 100%);mix-blend-mode:multiply}
#dark5{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#020810;opacity:0}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.it{position:absolute;white-space:nowrap;text-align:center;color:#fff;font-weight:900}
.hd{text-align:center}
.hd small{display:block;font-size:52px;letter-spacing:5px;text-shadow:0 4px 20px #000;color:#9fb6ff}
.hd b{display:block;font-size:100px;line-height:1.0;color:#FFD23F;
  text-shadow:0 8px 0 #0D2557,0 14px 36px rgba(0,0,0,.8);
  -webkit-text-stroke:7px #0D2557;paint-order:stroke fill}
.hd b.w{color:#fff}.hd b.r{color:#E63946;-webkit-text-stroke:7px #7a1138}
.slot{width:68px;height:68px;border-radius:50%;border:5px dashed #FFD23F;
  background:rgba(5,14,40,.78);color:#FFD23F;font-size:46px;line-height:58px;
  box-shadow:0 0 24px rgba(255,210,63,.6)}
.slot.f{border-style:solid;font-size:28px;color:#0D2557;background:#FFD23F}
.slot.dq{border-style:solid;border-color:#E63946;background:rgba(60,0,0,.88);
  color:#E63946;font-size:34px;line-height:58px;box-shadow:0 0 28px rgba(230,57,70,.7)}
.slot.rep{border-style:solid;border-color:#00C85A;background:rgba(0,30,10,.88);
  color:#00C85A;font-size:34px;line-height:58px;box-shadow:0 0 24px rgba(0,200,90,.6)}
.nm{margin-top:5px;font-size:21px;background:rgba(5,14,40,.85);border:2px solid rgba(31,79,184,.8);
  border-radius:10px;padding:2px 10px;display:inline-block;color:#9fb6ff}
.nm.dq{border-color:#E63946;color:#E63946;text-decoration:line-through;background:rgba(60,0,0,.7)}
.nm.rep{border-color:#00C85A;color:#00C85A;background:rgba(0,30,10,.7)}
.nm.f{border-color:#FFD23F;color:#FFD23F;background:rgba(5,14,40,.92)}
.fn{font-size:17px;padding:2px 8px}
.band{font-size:40px;background:rgba(5,14,40,.92);border:5px solid #FFD23F;
  border-radius:26px;padding:14px 36px;box-shadow:0 0 34px rgba(255,210,63,.4)}
.band small{display:block;font-size:26px;letter-spacing:3px;color:#9fb6ff}
.follow{font-size:66px;color:#fff;background:#E1306C;border-radius:60px;
  padding:22px 66px;box-shadow:0 10px 0 #7a1138,0 16px 36px rgba(0,0,0,.6)}
.cch{border-radius:16px;padding:10px 24px;background:#0D2557;border:5px solid #FFD23F;text-align:center;min-width:200px;box-shadow:0 0 32px rgba(255,210,63,.5)}
.cch .cl{font-size:22px;color:#9fb6ff;letter-spacing:4px;display:block;margin-bottom:2px}
.cch .cn{font-size:28px;color:#FFD23F;display:block}
.cta-box{font-size:50px;background:rgba(5,14,40,.92);border:5px solid #FFD23F;
  border-radius:28px;padding:22px 38px;line-height:1.5;text-align:center;
  white-space:normal;width:860px;box-shadow:0 0 40px rgba(255,210,63,.3)}
.cta-box small{display:block;font-size:30px;color:#9fb6ff;letter-spacing:2px;margin-bottom:8px}
.cm{background:#fff;color:#0D2557;border-radius:28px;padding:14px 28px;
  font-size:40px;text-align:left;box-shadow:0 14px 36px rgba(0,0,0,.6);
  border:5px solid #0D2557;white-space:normal;width:860px}
.whisper{font-size:50px;line-height:1.5;text-align:center;color:#c8d8ff;white-space:normal;width:860px;
  background:rgba(0,10,30,.7);border:3px solid rgba(255,210,63,.35);border-radius:34px;
  padding:32px 50px;box-shadow:0 0 50px rgba(255,210,63,.15)}
.whisper .wbig{font-size:72px;color:#FFD23F}
#fl{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0;z-index:50}
</style></head><body>
<div id="stage"><img id="bg"><div id="scrim"></div><div id="tint"></div><div id="dark5"></div><div id="ovp"></div></div>
<div id="ov"></div><div id="fl"></div>
<script>
const W=window.W||[],BS={};W.forEach(b=>BS[b.beat]=b);
const S=(b,i)=>BS[b].sents[i],bs=n=>BS[n].start,be=n=>n<6?BS[n+1].start+.02:END;
const END=W[W.length-1].end+1.0;window.END=END;
const FPS=30,DIVE=40;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const sm=(a,b,x)=>{const t=cl((x-a)/(b-a));return t*t*(3-2*t);};
const eob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};

const LAY={
  "GK":[539,1533],"RB":[867,1393],"CB1":[411,1428],"CB2":[669,1428],"LB":[212,1393],
  "CDM":[739,1252],"CM":[341,1252],"CAM":[540,1182],"RW":[844,1054],"LW":[236,1054],"ST":[540,1030]
};

// XI — groups for voice-staggered reveal (B4 sentences: B4s1=GK, B4s2=DEF, B4s3=MID, B4s4=FW)
const GRP={
  GK:  [{pos:"GK",  h:"@avazov_gk_07",    gk:true}],
  DEF: [{pos:"RB",  h:"@akhmedov__701"},
        {pos:"CB1", h:"@jurayev_sz"},
        {pos:"CB2", h:"@_baxtibek_2015"},
        {pos:"LB",  h:"@ergashboyevvv_"}],
  MID: [{pos:"CDM", h:"@zhanbo1ov"},
        {pos:"CM",  h:"@rasuluvich_09"},
        {pos:"CAM", h:"@murodbek___odilov"}],
  FW:  [{pos:"RW",  h:"@mirzasharibov_"},
        {pos:"LW",  h:"@hamraqulov_1"},
        {pos:"ST",  h:"@hasa.n11015"}]
};
const DQ=[{pos:"RB",dq:"@bilalov_abduvohid"},{pos:"CAM",dq:"@_mxmdv19"}];
const DQ_POS=new Set(DQ.map(d=>d.pos));

const items=[],OVP=document.getElementById("ovp"),OV=document.getElementById("ov"),FL=document.getElementById("fl");
function add(par,html,x,y,at,to,o={}){
  const d=document.createElement("div");d.className="it "+(o.cls||"");d.innerHTML=html;
  d.style.left=x+"px";d.style.top=y+"px";d.style.display="none";
  if(o.z)d.style.zIndex=o.z;par.appendChild(d);items.push({d,at,to:to==null?1e9:to,o});return d;
}
const hd=(label,big,at,to,y=640,o={})=>
  add(OV,`<small>${label}</small><b class="${o.cls2||""}">${big}</b>`,540,y,at,to,{cls:"hd",z:20,enter:"stamp",...o});

function frameOv(t){
  for(const it of items){
    const{d,at,to,o}=it;if(!(t>=at&&t<to)){d.style.display="none";continue;}
    d.style.display="block";
    const u=t-at,e=o.enter==="none"?1:eob(cl(u/(o.enter==="stamp"?.3:.34))),out=o.keep?1:cl((to-t)/.12);
    let s=1;if(o.pulse)s=1+.06*Math.sin(u*7+(o.ph||0));
    if(o.glow)d.style.filter=`drop-shadow(0 0 ${14+10*Math.sin(u*6)}px #FFD23F)`;
    if(o.rglow)d.style.filter=`drop-shadow(0 0 ${12+8*Math.sin(u*5)}px #E63946)`;
    d.style.opacity=String(cl(u/.08)*out*(o.dim?o.dim(t):1));
    d.style.transform=`translate(-50%,-50%) scale(${(.3+.7*e)*s})`+(o.rot?` rotate(${o.rot}deg)`:"");
  }
  document.getElementById("dark5").style.opacity=String(cl(sm(bs(5),bs(5)+.5,t)-sm(be(5)-.3,be(5),t))*0.72);
  const f=Math.max(0,...[2,3,4,5,6].map(i=>1-(t-bs(i))/.12));FL.style.opacity=String(cl(f)*.25);
}

// ── BEAT 1 — Hook ──
hd("ZAMIN FK","MUXLISLAR<br>JAMOASI<br>ANIQLANDI!",bs(1),be(1),480);
add(OV,`<div class="band"><small>SINOV O'YINIDAN SO'NG</small>FAQAT 11 TA O'RIN</div>`,
  540,1760,bs(1)+.3,be(1),{z:21,enter:"pop"});

// ── BEAT 2 — DQ: Formation + 2 DQ slots ──
hd("AFSUSKI...","2 TASI<br>TUSHIB QOLDI",bs(2),be(2),200,{cls2:"r"});
// 9 confirmed base slots (B2 → B4, then replaced by named slots)
let si=0;
Object.values(GRP).flat().filter(p=>!DQ_POS.has(p.pos)).forEach(p=>{
  const[x,y]=LAY[p.pos],pos=p.pos.replace(/\d/,"");
  const html=p.gk
    ?`<div class="nm fn" style="margin:0 0 5px;color:#9fb6ff">...</div><div class="slot f">${pos}</div>`
    :`<div class="slot f">${pos}</div><div class="nm fn" style="color:#9fb6ff">...</div>`;
  add(OVP,html,x,p.gk?y-10:y+20,bs(2)+.1+si*.08,bs(4),{z:10,enter:"pop"});
  si++;
});
// 2 DQ slots (B2 → B3)
DQ.forEach((p,i)=>{
  const[x,y]=LAY[p.pos];
  add(OVP,`<div class="slot dq">✕</div><div class="nm fn dq">${p.dq}</div>`,
    x,y+20,bs(2)+.4+i*.2,be(3),{z:12,enter:"pop",rglow:true});
});
add(OV,`<div class="cm"><b>SABAB:</b> Akkauntimizni kuzatishmagan ❌</div>`,
  540,1600,S(2,2).a,be(2),{z:22,enter:"pop"});

// ── BEAT 3 — Replacements ──
hd("ALMASHTIRILDI","YANGI<br>TANLANGAN",bs(3),be(3),540);
DQ.forEach((p,i)=>{
  const[x,y]=LAY[p.pos];
  const rep=Object.values(GRP).flat().find(r=>r.pos===p.pos);
  add(OVP,`<div class="slot rep">✓</div><div class="nm fn rep">${rep.h}</div>`,
    x,y+20,bs(3)+.2+i*.22,bs(4),{z:13,enter:"pop"});
});
add(OV,`<div class="band" style="border-color:#00C85A"><small style="color:#00C85A">QOIDA HAMMAGA TENG</small>O'RINLAR TO'LDIRILDI ✅</div>`,
  540,1760,S(3,1).a,be(3),{z:21,enter:"pop"});

// ── BEAT 4 — XI reveal: staggered by voice sentence ──
// S(4,0): "Muxlislar A — tarkib tayyor!" → heading
// S(4,1): "G K." → GK
// S(4,2): "Mudofaachilar." → DEF
// S(4,3): "Yarim mudofaachilar." → MID
// S(4,4): "Hujumchilar." → FW
hd("MUXLISLAR A","TARKIB<br>TAYYOR!",S(4,0).a,be(4),540);
GRP.GK.forEach((p,i)=>{
  const[x,y]=LAY[p.pos],pos=p.pos.replace(/\d/,"");
  add(OVP,`<div class="slot f">${pos}</div><div class="nm fn f">${p.h}</div>`,
    x,y+20,S(4,1).a+i*.1,END,{z:14,enter:"pop",keep:true,dim:t=>t>=bs(5)?0.18:1});
});
GRP.DEF.forEach((p,i)=>{
  const[x,y]=LAY[p.pos],pos=p.pos.replace(/\d/,"");
  add(OVP,`<div class="slot f">${pos}</div><div class="nm fn f">${p.h}</div>`,
    x,y+20,S(4,2).a+i*.12,END,{z:14,enter:"pop",keep:true,dim:t=>t>=bs(5)?0.18:1});
});
GRP.MID.forEach((p,i)=>{
  const[x,y]=LAY[p.pos],pos=p.pos.replace(/\d/,"");
  add(OVP,`<div class="slot f">${pos}</div><div class="nm fn f">${p.h}</div>`,
    x,y+20,S(4,3).a+i*.12,END,{z:14,enter:"pop",keep:true,dim:t=>t>=bs(5)?0.18:1});
});
GRP.FW.forEach((p,i)=>{
  const[x,y]=LAY[p.pos],pos=p.pos.replace(/\d/,"");
  add(OVP,`<div class="slot f">${pos}</div><div class="nm fn f">${p.h}</div>`,
    x,y+20,S(4,4).a+i*.12,END,{z:14,enter:"pop",keep:true,glow:p.pos==="ST",dim:t=>t>=bs(5)?0.18:1});
});

// Coach — appears at B4 heading, stays through to end, dims in B5
add(OVP,`<div class="cch"><span class="cl">📋 MURABBIY</span><span class="cn">@hayitboyev.76</span></div>`,
  540,1710,S(4,0).a,END,{z:15,enter:"pop",keep:true,dim:t=>t>=bs(5)?0.18:1});

// ── BEAT 5 — Whisper + Goat ──
// goat peeks bottom-left
add(OVP,`<img src="../17_Reel_Murabbiy_Elon/assets/goat.png" style="width:340px;image-rendering:auto">`,
  195,1720,bs(5)+.05,be(5),{z:28,enter:"pop",rot:-8,pulse:true,ph:1.2});
add(OV,`<div class="whisper"><span class="wbig">🤭</span><br>Aytgancha...<br>Muxlislar B ham<br><span style="color:#FFD23F">shakllanmoqda</span> ⚽</div>`,
  580,840,bs(5)+.2,be(5),{z:30,enter:"pop"});

// ── BEAT 6 — CTA ──
hd("MUXLISLAR B","SHAKLLANMOQDA!",bs(6),END,540,{keep:true});
add(OV,`<div class="cta-box"><small>O'RIN OLISH UCHUN 👇</small>KUZAT + IZOH QO'LDIRING</div>`,
  540,1480,bs(6)+.5,END,{z:22,enter:"pop",pulse:true,keep:true});
add(OV,`<div class="follow">OBUNA BO'LING</div>`,
  540,1770,bs(6)+.9,END,{z:22,enter:"pop",pulse:true,keep:true});
add(OV,`<img src="../12_Reel_Trial_Stadium/assets/crest.png" style="height:150px">`,
  130,1780,bs(6)+.4,END,{z:22,enter:"pop",keep:true});

// ── BACKGROUND: dive + push-in ──
const IM={};
const nm=f=>f<DIVE
  ?`../17_Reel_Murabbiy_Elon/build/top/d_${String(f).padStart(3,"0")}.jpg`
  :`../17_Reel_Murabbiy_Elon/build/top/top.jpg`;
async function bgLoad(t){
  const f=Math.min(DIVE,Math.floor(t*FPS));
  const im=IM[f];if(im)document.getElementById("bg").src=im.src;
  if(im&&im.decode)await im.decode().catch(()=>0);
}
window.renderAt=async t=>{
  await bgLoad(t);
  const z=1+.05*sm(DIVE/FPS,END,t);
  document.getElementById("stage").style.transform=`scale(${z})`;
  frameOv(t);
};
window.ready=async()=>{
  await document.fonts.ready;
  await document.fonts.load("900 40px MZ");
  for(const f of[...Array(DIVE).keys(),DIVE]){const im=new Image();im.src=nm(f);await im.decode();IM[f]=im;}
  await Promise.all([...document.images].map(i=>i.decode?i.decode().catch(()=>0):0));
  return true;
};
</script></body></html>
