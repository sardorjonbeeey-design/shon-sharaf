<!doctype html><html><head><meta charset="utf-8"><style>

<canvas id="c" width="1080" height="1920"></canvas><canvas id="fx" width="1080" height="1920"></canvas><div id="ov"></div>
<script src="../09_Episode_09/build/node_modules/three/build/three.min.js"></script>
<script>
const T = THREE, W = window.W || [], FPS = 30;
const BS = {}; W.forEach(b => BS[b.beat] = b);
const S = (b, i) => BS[b] && BS[b].sents[i] ? BS[b].sents[i] : {a:0,b:0};
const END = W.length ? W[W.length - 1].end + 1.0 : 52; window.END = END;
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sm = (a, b, x) => { const t = cl((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const eob = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const b = n => BS[n] ? BS[n].start : 0;

const REAL = 1200, TOTAL_SEATS = 17674;
// ---------- renderer / scene ----------
const R = new T.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true }); R.setSize(1080, 1920, false); R.setPixelRatio(1);
R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.1;
const sc = new T.Scene(); sc.background = new T.Color(0x0a1628);
sc.fog = new T.FogExp2(0x0a1628, 0.0012);
const cam = new T.PerspectiveCamera(50, 1080 / 1920, .1, 1800);
sc.add(new T.HemisphereLight(0x7faeff, 0x0a1030, 1.4));
const sun = new T.DirectionalLight(0xffffff, 1.0); sun.position.set(-60, 120, 80); sc.add(sun);
const lam = c => new T.MeshLambertMaterial({ color: c }), bas = c => new T.MeshBasicMaterial({ color: c });
const BOX = new T.BoxGeometry(1, 1, 1);
const M4 = new T.Matrix4(), Q4 = new T.Quaternion(), V3 = new T.Vector3(), S3 = new T.Vector3(), E4 = new T.Euler();
function setM(mesh, i, x, y, z, sx, sy, sz, ry = 0) { Q4.setFromEuler(E4.set(0, ry, 0)); M4.compose(V3.set(x, y, z), Q4, S3.set(sx, sy, sz)); mesh.setMatrixAt(i, M4); }

// ---------- pitch ----------
const PX = 26, PZ = 40;
const ground = new T.Mesh(new T.PlaneGeometry(3000, 3000), lam(0x050a1c)); ground.rotation.x = -Math.PI / 2; ground.position.y = -.3; sc.add(ground);
for (let i = 0; i < 12; i++) { const m = new T.Mesh(new T.PlaneGeometry(PX * 2, PZ * 2 / 12), lam(i % 2 ? 0x0e7a35 : 0x0a6a2d)); m.rotation.x = -Math.PI / 2; m.position.set(0, 0, -PZ + (i + .5) * PZ * 2 / 12); sc.add(m); }
function line(x, z, w, d, c = 0x7ffcff) { const m = new T.Mesh(BOX, bas(c)); m.scale.set(w, .05, d); m.position.set(x, .06, z); sc.add(m); }
line(0, -PZ, PX * 2, .5); line(0, PZ, PX * 2, .5); line(-PX, 0, .5, PZ * 2); line(PX, 0, .5, PZ * 2); line(0, 0, PX * 2, .5);
for (const s of [-1, 1]) { line(0, s * (PZ - 8), 20, .4); line(-10, s * (PZ - 4), .4, 8); line(10, s * (PZ - 4), .4, 8); }
const circ = new T.Mesh(new T.RingGeometry(5.7, 6.2, 48), bas(0x7ffcff)); circ.rotation.x = -Math.PI / 2; circ.position.y = .07; sc.add(circ);

// ---------- seats (rounded-rect bowl — Crown Arena scale) ----------
function rr(hx, hz, r, s) {
  const a = hx - r, b_ = hz - r, L1 = 2 * a, L2 = 2 * b_, Lc = Math.PI * r / 2, P = 2 * L1 + 2 * L2 + 4 * Lc; s = ((s % P) + P) % P;
  const seg = [[L1, "b"], [Lc, "c1"], [L2, "r"], [Lc, "c2"], [L1, "t"], [Lc, "c3"], [L2, "l"], [Lc, "c4"]]; let o = 0;
  for (const [L, k] of seg) { if (s <= o + L) { const u = s - o; switch (k) {
    case "b": return [-a + u, hz, 0, 1]; case "r": return [hx, b_ - u, 1, 0]; case "t": return [a - u, -hz, 0, -1]; case "l": return [-hx, -b_ + u, -1, 0];
    case "c1": { const t = u / r; return [a + r * Math.sin(t), b_ + r * Math.cos(t), Math.sin(t), Math.cos(t)]; }
    case "c2": { const t = u / r; return [a + r * Math.cos(t), -b_ - r * Math.sin(t), Math.cos(t), -Math.sin(t)]; }
    case "c3": { const t = u / r; return [-a - r * Math.sin(t), -b_ - r * Math.cos(t), -Math.sin(t), -Math.cos(t)]; }
    default: { const t = u / r; return [-a - r * Math.cos(t), b_ + r * Math.sin(t), -Math.cos(t), Math.sin(t)]; } } } o += L; }
  return [-a, hz, 0, 1];
}
// Two-tier bowl: lower 20 rows tight, upper 30 rows with concourse gap
const TIERS_LOWER = 20, TIERS_UPPER = 30, TIERS = TIERS_LOWER + TIERS_UPPER;
const seats = [];
for (let i = 0; i < TIERS; i++) {
  const tierGap = i >= TIERS_LOWER ? 3.5 : 0;
  const hx = PX + 5 + i * 1.0 + (i >= TIERS_LOWER ? 2 : 0);
  const hz = PZ + 5 + i * 1.0 + (i >= TIERS_LOWER ? 2 : 0);
  const r = 10 + i * 1.0 + (i >= TIERS_LOWER ? 2 : 0);
  const P = 2 * (2 * (hx - r) + 2 * (hz - r)) + 2 * Math.PI * r;
  const spacing = i >= TIERS_LOWER ? 1.0 : 0.95;
  const n = Math.floor(P / spacing);
  for (let k = 0; k < n; k++) {
    const [x, z, nx, nz] = rr(hx, hz, r, k * P / n);
    seats.push({ x, z, y: .55 + i * 0.72 + tierGap, ry: Math.atan2(-nx, -nz), tier: i, k, n });
  }
}
// Trim to TOTAL_SEATS
while (seats.length > TOTAL_SEATS) seats.pop();
const NS = seats.length;

let ord = seats.map((_, i) => i).sort((a, b_) => hash(a * 3.1) - hash(b_ * 3.1));
const pickNear = (x, y, z) => { let b_ = 0, bd = 1e9; seats.forEach((s, i) => { const d = (s.x - x) ** 2 + (s.y - y) ** 2 + (s.z - z) ** 2; if (d < bd) { bd = d; b_ = i; } }); return b_; };
const HERO = pickNear(-30, 4.5, 8);
ord = [HERO, ...ord.filter(i => i !== HERO)];
const rank = new Array(NS); ord.forEach((s, i) => rank[s] = i);

const seatM = new T.InstancedMesh(BOX, lam(0xffffff), NS);
const bodyM = new T.InstancedMesh(BOX, lam(0xffffff), NS);
const headM = new T.InstancedMesh(BOX, lam(0xffffff), NS);
const SEATC = [0x1a3fb0, 0x1f4fb8, 0x16348f];
const KIT = [0x2f6bff, 0xffffff, 0x2f6bff, 0xffd23f, 0xffffff, 0xe63946, 0x2f6bff, 0x34d399, 0xff8a3d, 0xc084fc];
seats.forEach((s, i) => {
  seatM.setColorAt(i, new T.Color(SEATC[(s.k + s.tier) % 3]));
  bodyM.setColorAt(i, new T.Color(KIT[Math.floor(hash(i * 7.7) * KIT.length)]));
  headM.setColorAt(i, new T.Color([0xf2c8a0, 0xd9a577, 0xb98760][Math.floor(hash(i * 2.9) * 3)]));
});
[seatM, bodyM, headM].forEach(m => { m.frustumCulled = false; sc.add(m); });

function updateSeats(K, t) {
  seats.forEach((s, i) => {
    setM(seatM, i, s.x, s.y, s.z, .88, .45, .82, s.ry);
    const u = cl(K - rank[i] + 1, 0, 1), e = u <= 0 ? 0 : eob(u);
    setM(bodyM, i, s.x, s.y + .55 * e, s.z, .5 * e, .78 * e, .38 * e, s.ry);
    setM(headM, i, s.x, s.y + 1.1 * e, s.z, .34 * e, .34 * e, .34 * e, s.ry);
  });
  [seatM, bodyM, headM].forEach(m => { m.instanceMatrix.needsUpdate = true; m.instanceColor.needsUpdate = true; });
}

// Crown Arena exterior — dark navy walls + steel/glass facade
const wallH = TIERS * 0.72 + 4;
const outerA = PX + 5 + TIERS * 1.0 + 6, outerB = PZ + 5 + TIERS * 1.0 + 6;
// outer wall ring
for (let i = 0; i < 120; i++) {
  const angle = (i / 120) * Math.PI * 2;
  const rx = outerA * Math.cos(angle), rz = outerB * Math.sin(angle);
  const w = new T.Mesh(BOX, lam(0x0a1a3d));
  w.scale.set(3.5, wallH, 1.8); w.position.set(rx, wallH / 2, rz);
  w.rotation.y = -angle; sc.add(w);
  if (i % 4 === 0) {
    const g = new T.Mesh(BOX, new T.MeshBasicMaterial({ color: 0x1a4a8a, transparent: true, opacity: 0.5 }));
    g.scale.set(2.8, wallH * 0.7, 0.3); g.position.set(rx * 1.01, wallH * 0.4, rz * 1.01);
    g.rotation.y = -angle; sc.add(g);
  }
}

// Roof ring
const roofG = new T.RingGeometry(Math.min(outerA, outerB) * 0.55, Math.max(outerA, outerB) + 2, 80);
const roofM_ = new T.Mesh(roofG, new T.MeshLambertMaterial({ color: 0x2a3f5f, side: T.DoubleSide }));
roofM_.rotation.x = -Math.PI / 2; roofM_.position.y = wallH + 1; sc.add(roofM_);

// LED rim lights
const ledRim = (h, c) => {
  const n = 200;
  const m = new T.InstancedMesh(BOX, bas(c), n);
  for (let k = 0; k < n; k++) {
    const angle = (k / n) * Math.PI * 2;
    const rx = (outerA - 2) * Math.cos(angle), rz = (outerB - 2) * Math.sin(angle);
    setM(m, k, rx, h, rz, 2.5, 0.3, 2.5, -angle);
  }
  sc.add(m);
};
ledRim(wallH + 0.5, 0x4da8ff);
ledRim(0.3, 0x4da8ff);

// ZAMIN FK sign
const signCanvas = document.createElement("canvas"); signCanvas.width = 512; signCanvas.height = 128;
const sctx = signCanvas.getContext("2d");
sctx.fillStyle = "#0D2557"; sctx.fillRect(0, 0, 512, 128);
sctx.strokeStyle = "#FFD23F"; sctx.lineWidth = 4; sctx.strokeRect(4, 4, 504, 120);
sctx.fillStyle = "#FFD23F"; sctx.font = "bold 56px sans-serif"; sctx.textAlign = "center";
sctx.fillText("ZAMIN FK", 256, 60);
sctx.fillStyle = "#9fb6ff"; sctx.font = "bold 24px sans-serif";
sctx.fillText("THE CROWN ARENA", 256, 100);
const signTex = new T.CanvasTexture(signCanvas);
const sign = new T.Mesh(new T.PlaneGeometry(28, 7), new T.MeshBasicMaterial({ map: signTex }));
sign.position.set(0, wallH + 6, -(outerB + 3)); sc.add(sign);

// Mountains background
for (let i = 0; i < 15; i++) {
  const angle = hash(i * 5.3) * Math.PI * 2;
  const dist = 500 + hash(i * 3.1) * 400;
  const h = 80 + hash(i * 7.7) * 180;
  const mt = new T.Mesh(new T.ConeGeometry(60 + hash(i * 2.1) * 80, h, 4), lam(0x8ba4c8));
  mt.position.set(Math.cos(angle) * dist, h / 2 - 10, Math.sin(angle) * dist);
  mt.rotation.y = hash(i * 9.1) * Math.PI; sc.add(mt);
}

// Floodlight towers
for (let i = 0; i < 4; i++) {
  const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
  const rx = (outerA + 8) * Math.cos(angle), rz = (outerB + 8) * Math.sin(angle);
  const pole = new T.Mesh(new T.CylinderGeometry(0.5, 0.8, wallH + 20, 8), lam(0x8898aa));
  pole.position.set(rx, (wallH + 20) / 2, rz); sc.add(pole);
  const light = new T.Mesh(BOX, bas(0xffffee));
  light.scale.set(4, 2, 2); light.position.set(rx, wallH + 20, rz); sc.add(light);
  const spot = new T.PointLight(0xfff5dd, 0.6, 300);
  spot.position.set(rx, wallH + 18, rz); sc.add(spot);
}

// ---------- beam (hero highlight) ----------
function heroBeam(x, y, z, col) {
  const m = new T.Mesh(new T.CylinderGeometry(.9, .9, 90, 20, 1, true),
    new T.MeshBasicMaterial({ color: col, transparent: true, opacity: .25, side: T.DoubleSide, depthWrite: false, blending: T.AdditiveBlending }));
  m.position.set(x, y + 45, z); sc.add(m); return m;
}
const HP = seats[HERO];
const beam1 = heroBeam(HP.x, HP.y, HP.z, 0xffd23f);

// ---------- camera choreography for 12 beats ----------
function placeCam(t) {
  let p, l, fov = 50;
  const b1 = b(1), b2 = b(2), b3 = b(3), b4 = b(4), b5 = b(5), b6 = b(6);
  const b7 = b(7), b8 = b(8), b9 = b(9), b10 = b(10), b11 = b(11), b12 = b(12);

  if (t < b2) {
    // Beat 1: top-down → slow pull back
    const u = sm(0, b2, t);
    p = [0, lerp(280, 240, u), lerp(5, 20, u)];
    l = [0, 0, 0]; fov = lerp(42, 46, u);
    cam.up.set(0, 1, -0.001).normalize();
  } else if (t < b3) {
    // Beat 2: 3/4 overhead orbit
    const u = sm(b2, b3, t);
    const angle = lerp(0.78, 1.2, u);
    p = [Math.cos(angle) * 180, lerp(160, 140, u), Math.sin(angle) * 180];
    l = [0, 0, 0]; fov = 48;
  } else if (t < b4) {
    // Beat 3: approach Crown Arena
    const u = sm(b3, b4, t);
    p = [0, lerp(90, 65, u), lerp(240, 180, u)];
    l = [0, lerp(10, 5, u), 0]; fov = lerp(52, 56, u);
  } else if (t < b5) {
    // Beat 4: inside stands, panorama sweep (pulled back to show scale)
    const u = sm(b4, b5, t);
    const angle = lerp(-0.3, 0.4, u);
    p = [85 * Math.cos(angle), lerp(28, 34, u), 65 * Math.sin(angle)];
    l = [lerp(-15, 10, u), 10, lerp(-25, -5, u)]; fov = 64;
  } else if (t < b6) {
    // Beat 5: close on fans
    const u = sm(b5, b6, t);
    p = [lerp(42, 48, u), lerp(16, 20, u), lerp(32, 38, u)];
    l = [lerp(52, 56, u), lerp(13, 15, u), lerp(42, 48, u)]; fov = lerp(44, 48, u);
  } else if (t < b7) {
    // Beat 6: pitch level sweep
    const u = sm(b6, b7, t);
    p = [lerp(-5, 5, u), lerp(3, 5, u), lerp(-2, 5, u)];
    l = [lerp(40, 50, u), lerp(18, 22, u), lerp(25, 35, u)]; fov = lerp(68, 72, u);
  } else if (t < b8) {
    // Beat 7: corner dramatic orbit
    const u = sm(b7, b8, t);
    const angle = lerp(0.78, 1.1, u);
    p = [Math.cos(angle) * 120, lerp(50, 60, u), Math.sin(angle) * 120];
    l = [0, lerp(8, 12, u), 0]; fov = 54;
  } else if (t < b9) {
    // Beat 8: behind goal looking up
    const u = sm(b8, b9, t);
    p = [lerp(-3, 3, u), lerp(6, 10, u), lerp(-55, -50, u)];
    l = [0, lerp(18, 22, u), lerp(15, 25, u)]; fov = lerp(66, 70, u);
  } else if (t < b10) {
    // Beat 9: tunnel view, low dramatic
    const u = sm(b9, b10, t);
    p = [lerp(-52, -48, u), lerp(5, 7, u), lerp(-2, 2, u)];
    l = [lerp(25, 35, u), lerp(14, 16, u), lerp(-2, 2, u)]; fov = lerp(60, 64, u);
  } else if (t < b11) {
    // Beat 10: high side panorama
    const u = sm(b10, b11, t);
    p = [lerp(-130, -120, u), lerp(90, 100, u), lerp(-10, 10, u)];
    l = [0, lerp(4, 6, u), 0]; fov = lerp(52, 56, u);
  } else if (t < b12) {
    // Beat 11: scoreboard angle
    const u = sm(b11, b12, t);
    p = [lerp(-5, 5, u), lerp(45, 50, u), lerp(-85, -80, u)];
    l = [0, lerp(22, 26, u), lerp(25, 30, u)]; fov = lerp(54, 58, u);
  } else {
    // Beat 12: aerial pullback for CTA
    const u = sm(b12, END, t);
    p = [0, lerp(300, 380, u), lerp(400, 480, u)];
    l = [0, 0, 0]; fov = lerp(42, 38, u);
  }

  cam.fov = fov; cam.updateProjectionMatrix();
  if (t >= b2) cam.up.set(0, 1, 0);
  cam.position.set(p[0], p[1], p[2]); cam.lookAt(l[0], l[1], l[2]);
}

// ---------- fill level K(t): how many fans are visible ----------
function K(t) { return REAL; }

// ---------- overlay ----------
const OV = document.getElementById("ov"), items = [];
function add(html, x, y, at, to, o = {}) {
  const d = document.createElement("div"); d.className = "it " + (o.cls || "");
  d.innerHTML = html; d.style.left = x + "px"; d.style.top = y + "px"; d.style.display = "none";
  if (o.z) d.style.zIndex = o.z; OV.appendChild(d);
  items.push({ d, at, to: to == null ? 1e9 : to, o }); return d;
}
const hd = (label, big, at, to, y = 330, w = false) => add(`<small>${label}</small><b class="${w ? "w" : ""}">${big}</b>`, 540, y, at, to, { cls: "hd", z: 20, enter: "stamp" });
const pill = (small, num, tail, at, to) => add(`<small>${small}</small><b>${num}</b> <i>${tail}</i>`, 540, 1640, at, to, { cls: "pill", z: 21, enter: "pop" });

function frameOv(t) {
  for (const it of items) {
    const { d, at, to, o } = it; const on = t >= at && t < to;
    if (!on) { d.style.display = "none"; continue; }
    d.style.display = "block"; const u = (t - at);
    const e = o.enter === "none" ? 1 : eob(cl(u / (o.enter === "stamp" ? .32 : .36)));
    const out = cl((to - t) / .12);
    let sx = 1; if (o.pulse) { sx = 1 + .05 * Math.sin(u * 7); }
    const sca = (.3 + .7 * e) * sx;
    d.style.opacity = String(cl(u / .08) * out);
    let tr = `translate(-50%,-50%) scale(${sca})`;
    d.style.transform = tr;
    if (o.live) o.live(d, t);
  }
}

// Beat 1: INTRO
hd("BU —", "ZAMIN FK<br>STADIONI", b(1), b(2) - .1, 330, true);

// Beat 2: SCALE — counter 0 → 17,674
add(`<small>O'RINDIQLAR</small><b>0</b>`, 540, 330, b(2), b(3) - .1, { cls: "hd", z: 20, enter: "none",
  live: (d, t) => { d.querySelector("b").textContent = Math.round(17674 * sm(b(2), b(3) - .3, t)).toLocaleString(); }
});

// Beat 3: FANS FILL
hd("UNI MUXLISLAR", "TO'LDIRADI", b(3), b(4) - .1, 330, true);

// Beat 4: RULE
hd("HAR BIR OBUNACHI", "= 1 VIRTUAL<br>MUXLIS", b(4), S(4,1).a - .05 || b(5) - .1);
hd("STADIONDA", "= 1 O'RIN", S(4,1).a || b(4) + 2.5, b(5) - .1);

// Beat 5: YOUR NAME
hd("OBUNA BO'LING", "ISMINGIZ O'Z<br>O'RNINGIZDA!", b(5), b(6) - .1, 330);
add(`<div class="tag">@sardorjonbeeey</div>`, 540, 1400, b(5) + .5, b(6) - .1, { z: 22, enter: "pop" });

// Beat 6: PROGRESS
hd("HAR YANGI QISMDA", "STADION<br>TO'LAYOTGANINI<br>KO'RASIZ", b(6), b(7) - .1, 330);

// Beat 7: STATUS — counter + progress ring
pill("MUXLISLAR", "1,200", "/ 17,674", b(7), b(8) - .1);
hd("O'N YETTI MING", "OLTI YUZ<br>YETMISH TO'RT", b(7), S(7,1).a || b(8) - .1);

// ---------- FX canvas (speed lines for founders beat) ----------
const fx = document.getElementById("fx").getContext("2d");
function fxFrame(t) {
  fx.clearRect(0, 0, 1080, 1920);
  const a_ = b(9), z = cl((t - a_) / 2.4);
  if (t < a_ - .05 || t > a_ + 2.9) return;
  const k = Math.sin(Math.PI * cl((t - a_) / 2.9)) * .85;
  fx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 70; i++) {
    const ang = hash(i * 1.3) * 6.283, r0 = 160 + hash(i * 2.1) * 500;
    const len = 120 + hash(i * 3.7) * 520 * (1 + z);
    const ph = (t * 1.7 + hash(i)) % 1, r = r0 + ph * 900;
    const x0 = 540 + Math.cos(ang) * r, y0 = 960 + Math.sin(ang) * r * 1.5;
    const x1 = 540 + Math.cos(ang) * (r + len), y1 = 960 + Math.sin(ang) * (r + len) * 1.5;
    const c = [[255, 210, 63], [127, 252, 255], [255, 255, 255], [255, 90, 160]][i % 4];
    fx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${.35 * k})`;
    fx.lineWidth = 3 + hash(i * 9) * 5; fx.beginPath(); fx.moveTo(x0, y0); fx.lineTo(x1, y1); fx.stroke();
  }
  fx.globalCompositeOperation = "source-over";
}

// ---------- world update ----------
function world(t) {
  updateSeats(K(t), t);
  beam1.visible = (t < b(2) - .05) || (t >= b(5) && t < b(6));
  beam1.material.opacity = .22 + .1 * Math.sin(t * 5);
}

window.renderAt = t => { world(t); placeCam(t); R.render(sc, cam); frameOv(t); fxFrame(t); };
