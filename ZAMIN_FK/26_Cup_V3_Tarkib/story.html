<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(../web/city/assets/fonts/Montserrat_900Black.ttf);font-weight:900}
@font-face{font-family:M;src:url(../web/city/assets/fonts/Montserrat_700Bold.ttf);font-weight:700}
@font-face{font-family:M;src:url(../web/city/assets/fonts/Montserrat_600SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;font-family:M}
body{background:linear-gradient(180deg,#17409a 0%,#1F4FB8 40%,#143a8c 100%);color:#fff;overflow:hidden;position:relative}
.head{position:absolute;top:70px;left:70px;right:70px;text-align:center}
.kicker{font-weight:700;font-size:28px;letter-spacing:.34em;opacity:.78}
.club{font-weight:900;font-size:82px;line-height:1;margin-top:16px;letter-spacing:-.01em}
.club.sm{font-size:68px}
.sub{margin-top:14px;font-weight:600;font-size:30px;opacity:.85}
.sub b{font-weight:900}
.form{display:inline-block;margin-top:16px;font-weight:900;font-size:26px;letter-spacing:.2em;
  border:3px solid rgba(255,255,255,.55);border-radius:999px;padding:8px 22px}
/* pitch */
.pitch{position:absolute;left:52px;right:52px;top:430px;height:1150px;border:4px solid rgba(255,255,255,.35);
  border-radius:10px;background:
   repeating-linear-gradient(180deg,rgba(255,255,255,.055) 0 96px,rgba(255,255,255,0) 96px 192px),
   linear-gradient(180deg,#1a53c6 0%,#1546a8 100%)}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:rgba(255,255,255,.3)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;
  border:4px solid rgba(255,255,255,.3);border-radius:50%}
.box{position:absolute;left:50%;transform:translateX(-50%);width:460px;height:150px;border:4px solid rgba(255,255,255,.3)}
.box.t{top:-4px;border-top:none}.box.b{bottom:-4px;border-bottom:none}
.p{position:absolute;transform:translate(-50%,-50%);text-align:center;width:250px}
.shirt{width:92px;height:92px;margin:0 auto;border-radius:50%;background:#fff;color:#1F4FB8;
  font-weight:900;font-size:44px;line-height:92px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.p.cap .shirt{background:#ffd34d;color:#123a86}
.pos{margin-top:8px;font-weight:900;font-size:25px;letter-spacing:.12em;opacity:.95}
.un{margin-top:2px;font-weight:700;font-size:24px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* subs */
.subs{position:absolute;left:52px;right:52px;top:1620px}
.subs .t{font-weight:900;font-size:27px;letter-spacing:.22em;opacity:.8;margin-bottom:14px}
.subs .l{font-weight:700;font-size:27px;line-height:1.5;opacity:.95}
.foot{position:absolute;left:52px;right:52px;bottom:58px;display:flex;align-items:center;gap:20px}
.foot img{width:84px;height:84px}
.foot .t{font-weight:900;font-size:28px;line-height:1.25}
.foot .t span{display:block;font-weight:600;font-size:22px;opacity:.72}
</style></head><body>
<div class="head">
  <div class="kicker">MUXLISLAR KUBOGI — TARKIB</div>
  <div class="club" id="club">CLUB</div>
  <div class="sub">Asoschi / kapitan: <b id="capt">@x</b></div>
  <div class="form">4 — 3 — 3</div>
</div>
<div class="pitch" id="pitch"><div class="box t"></div><div class="box b"></div></div>
<div class="subs"><div class="t" id="subt">ZAXIRA</div><div class="l" id="subl"></div></div>
<div class="foot">
  <img src="../03_Approved_Assets/ZFK_CREST_MASTER_V01_P_2048.png">
  <div class="t">ZAMIN FK<span>Tarkibni muxlislar izohlari tanladi</span></div>
</div>
<script>
const D=JSON.parse(decodeURIComponent(new URLSearchParams(location.search).get("d")));
document.getElementById("club").textContent=D.club;
if(D.club.length>13) document.getElementById("club").classList.add("sm");
document.getElementById("capt").textContent="@"+D.capt;
// 4-3-3 koordinatalar (% pitch ichida)
const SPOT={GK:[50,91],LB:[14,72],CB1:[37,74],CB2:[63,74],RB:[86,72],
            CML:[20,49],CMC:[50,52],CMR:[80,49],LW:[16,26],ST:[50,13],RW:[84,26]};
const pitch=document.getElementById("pitch");
for(const pl of D.xi){
  const [x,y]=SPOT[pl.spot];
  const d=document.createElement("div"); d.className="p"+(pl.u===D.capt?" cap":"");
  d.style.left=x+"%"; d.style.top=y+"%";
  d.innerHTML=`<div class="shirt">${pl.n}</div><div class="pos">${pl.pos}</div><div class="un">@${pl.u}</div>`;
  pitch.appendChild(d);
}
document.getElementById("subl").textContent=D.subs.map(s=>"@"+s).join("  ·  ");
</script></body></html>
