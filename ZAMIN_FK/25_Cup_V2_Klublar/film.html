<!doctype html><meta charset=utf-8><style>
@font-face{font-family:M;src:url(../web/city/assets/fonts/Montserrat_900Black.ttf)}
@font-face{font-family:Mb;src:url(../web/city/assets/fonts/Montserrat_800ExtraBold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050e3c;font-family:M,sans-serif;color:#fff}
.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;will-change:transform}
#plate{position:absolute;inset:0;background-size:cover;background-position:center}
#dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(3,8,26,.26) 0%,rgba(3,8,26,.74) 100%);opacity:0}
svg.pitch{position:absolute;left:0;top:0;width:1080px;height:1920px}
.cut{fill:none;stroke:#eaf1ff;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 14px rgba(150,190,255,.9))}
.arrow{fill:none;stroke:#FFD23F;stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 14px rgba(255,210,63,.8))}
.q{position:absolute;transform:translate(-50%,-50%);opacity:0;width:430px;text-align:center}
.q .b{width:430px;min-height:132px;border-radius:32px;background:rgba(5,14,60,.9);border:5px solid #1F4FB8;
  box-shadow:0 0 36px rgba(31,79,184,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;padding:16px 14px}
.q.on .b{border-color:#FFD23F;box-shadow:0 0 56px rgba(255,210,63,.6)}
.q .n{font:900 42px/1.05 M;letter-spacing:1px}
.q .f{font:800 26px Mb;color:#9fb6ff}
.q.on .f{color:#FFD23F}
#final{position:absolute;left:540px;top:960px;transform:translate(-50%,-50%) scale(.5);width:330px;height:330px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#1F4FB8,#0b1f4d 70%);border:8px solid #FFD23F;
  box-shadow:0 0 70px rgba(255,210,63,.45),inset 0 0 50px rgba(0,0,0,.5);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;opacity:0}
#final .c{font:900 86px/1 M} #final .l{font:900 40px M;color:#FFD23F;letter-spacing:6px}
.sfl{position:absolute;left:0;width:1080px;text-align:center;font:900 32px M;color:#cfe0ff;letter-spacing:7px;opacity:0;
  -webkit-text-stroke:7px rgba(3,8,26,.85);paint-order:stroke fill}
.a{position:absolute;opacity:0;will-change:transform,opacity}
.ttl{-webkit-text-stroke:9px rgba(3,8,26,.92);paint-order:stroke fill}
.chip{height:92px;line-height:84px;border-radius:46px;padding:0 40px;display:block;font:900 42px M;
  background:rgba(5,14,60,.9);border:4px solid #1F4FB8;box-shadow:0 0 32px rgba(31,79,184,.5);white-space:nowrap}
.chip.g{background:#FFD23F;color:#0D2557;border-color:#fff}
.pill{height:108px;line-height:98px;text-align:center;border-radius:54px;background:#FFD23F;color:#0D2557;font:900 46px M;
  border:5px solid #0D2557;box-shadow:0 10px 34px rgba(0,0,0,.45)}
.cap{left:60px;width:960px;bottom:120px;text-align:center;font:900 58px/1.14 M;paint-order:stroke fill;
  -webkit-text-stroke:10px rgba(5,14,60,.95);opacity:0}
.cap span{display:inline-block;margin:0 9px}
.pos{width:620px;height:124px;border-radius:30px;background:rgba(5,14,60,.92);border:5px solid #1F4FB8;
  box-shadow:0 0 30px rgba(31,79,184,.5);display:flex;align-items:center;gap:26px;padding:0 30px;box-sizing:border-box}
.pos b{width:150px;font:900 62px M;color:#FFD23F;text-align:center}
.pos span{font:800 40px Mb;color:#dbe6ff}
.capcard{width:470px;border-radius:30px;background:linear-gradient(150deg,#1F4FB8,#0b1f4d);border:5px solid #FFD23F;
  box-shadow:0 16px 44px rgba(0,0,0,.55);padding:20px 22px;box-sizing:border-box}
.capcard .t{font:900 24px M;color:#cfe0ff;letter-spacing:5px}
.capcard .u{margin-top:8px;font:900 36px M;color:#FFD23F;word-break:break-all}
.capcard .c{margin-top:6px;font:800 26px Mb;color:#dbe6ff}
#vig{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 54%,rgba(2,6,24,.6) 100%)}
</style>
<div id=st>
  <div id=world>
    <div id=plate class=full></div>
    <div id=dim></div>
    <svg class="pitch" viewBox="0 0 1080 1920">
      <path class="cut" id="cutv" d="M 540 346 V 1574"/>
      <path class="cut" id="cuth" d="M 142 960 H 938"/>
      <path class="arrow" id="a1" d="M 341 760 L 450 880"/>
      <path class="arrow" id="a2" d="M 739 760 L 630 880"/>
      <path class="arrow" id="a3" d="M 341 1160 L 450 1040"/>
      <path class="arrow" id="a4" d="M 739 1160 L 630 1040"/>
    </svg>
    <div class="sfl" id="sf1" style="top:470px">YARIM FINAL 1</div>
    <div class="sfl" id="sf2" style="top:1420px">YARIM FINAL 2</div>
    <div class="q" id="q1" style="left:300px;top:650px"><div class=b><span class=n>WAKANDA<br>TEAM</span><span class=f>@3wx.hamrokulov</span></div></div>
    <div class="q" id="q2" style="left:780px;top:650px"><div class=b><span class=n>PRIME FC</span><span class=f>@umaraliev.lll</span></div></div>
    <div class="q" id="q3" style="left:300px;top:1270px"><div class=b><span class=n>QAYRAT FC</span><span class=f>@avazov_gk_07</span></div></div>
    <div class="q" id="q4" style="left:780px;top:1270px"><div class=b><span class=n>PRIME<br>AVANGARD</span><span class=f>@rasuluvich_09</span></div></div>
    <div id="final"><div class=c>🏆</div><div class=l>FINAL</div></div>
  </div>
  <div id=vig class=full></div>
  <div id=ov class=full></div>
</div>
<script>
const A = "assets/", FPS = 30;
// hook · clubs (each club lights in turn) · draw (pairings) · caps (captains) · cta (positions + goat) · end
const S = { hook: 0, clubs: 3.8, draw: 9.4, caps: 18.2, cta: 23.0, end: 30.8 }; window.END = 36.0;
const NDIVE = 30;
const $ = id => document.getElementById(id), ov = $("ov"), world = $("world");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3), sp = x => { x = clamp(x); return x < 1 ? 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2) : 1; };
const seg = t => { let k = "hook"; for (const n in S) if (t >= S[n]) k = n; return k; };
function el(html, cls = "a", style = "") { const d = document.createElement("div"); d.className = cls; d.style.cssText = style; d.innerHTML = html; ov.appendChild(d); return d; }
function set(e, { x = 0, y = 0, s = 1, r = 0, o = 1 }) { e.style.opacity = o; e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; }
const QS = [1, 2, 3, 4].map(i => $("q" + i));
// club order on screen: q1 Wakanda, q2 Prime Fc, q3 Qayrat, q4 Prime Avangard
// narration names them: Prime Avangard, Prime Fc, Wakanda team, Qayrat Fc  -> light order 4,2,1,3
const LIGHT = [3, 1, 0, 2];
// ---- overlays ----
const t1 = el(`4 TA KLUB<br><span style="color:#FFD23F">TANLANDI</span>`, "a ttl", "left:0;width:1080px;top:120px;text-align:center;font:900 92px/1.04 M");
const t2 = el(`SIZNING <span style="color:#FFD23F">KLUBLARINGIZ</span>`, "a ttl", "left:0;width:1080px;top:140px;text-align:center;font:900 64px/1.04 M");
const t3 = el(`QUR‘A`, "a ttl", "left:0;width:1080px;top:130px;text-align:center;font:900 86px/1.04 M");
const pair1 = el("WAKANDA TEAM — PRIME FC", "a chip", "left:90px;top:250px;width:900px;text-align:center;font-size:38px");
const pair2 = el("QAYRAT FC — PRIME AVANGARD", "a chip", "left:90px;top:360px;width:900px;text-align:center;font-size:38px");
const t4 = el(`ASOSCHI = <span style="color:#FFD23F">KAPITAN</span>`, "a ttl", "left:0;width:1080px;top:150px;text-align:center;font:900 68px M");
const t4s = el("11 o‘yinchini KAPITAN tanlaydi", "a chip g", "left:210px;top:270px;width:660px;text-align:center;font-size:38px");
const caps = [["WAKANDA TEAM", "@3wx.hamrokulov"], ["PRIME FC", "@umaraliev.lll"], ["QAYRAT FC", "@avazov_gk_07"], ["PRIME AVANGARD", "@rasuluvich_09"]]
  .map(([c, u], i) => el(`<div class=capcard><div class=t>KAPITAN</div><div class=u>${u}</div><div class=c>${c}</div></div>`,
    "a", `left:${i % 2 ? 560 : 50}px;top:${640 + Math.floor(i / 2) * 320}px`));
// CTA: position codes stacked, Uzbek word beside each
const poss = [["GK", "darvozabon"], ["CB", "himoya"], ["CM", "markaz"], ["ST", "hujum"]]
  .map(([c, w], i) => el(`<b>${c}</b><span>${w}</span>`, "a pos", `left:410px;top:${430 + i * 150}px`));
const goat = el(`<img src="${A}goat_talk.png" style="height:820px;display:block">`, "a", "left:-40px;top:1060px");
const bub = el("Pozitsiyangizni<br>yozing!", "a", "left:420px;top:1120px;width:560px;padding:26px 30px;box-sizing:border-box;border-radius:40px;background:#fff;color:#0D2557;font:900 52px/1.12 M;box-shadow:0 12px 40px rgba(0,0,0,.5);text-align:center");
const pill = el("Izohga pozitsiyangizni yozing 👇", "a pill", "left:90px;top:1480px;width:900px;font-size:46px");
const note = el("obuna shart · 24 soat", "a", "left:0;width:1080px;top:1620px;text-align:center;font:900 38px M;color:#cfe0ff;-webkit-text-stroke:8px rgba(5,14,60,.9);paint-order:stroke fill");
// end
const eTtl = el("KEYINGI VIDEO", "a", "left:0;width:1080px;top:150px;text-align:center;font:900 44px M;color:#cfe0ff;letter-spacing:7px;-webkit-text-stroke:7px rgba(3,8,26,.85);paint-order:stroke fill");
const eSub = el("KAPITANLAR <span style='color:#FFD23F'>SIZNI</span> TANLAYDI", "a ttl", "left:0;width:1080px;top:210px;text-align:center;font:900 62px M");
const eNote = el("24 soat · obuna shart", "a chip g", "left:300px;top:1600px;width:480px;text-align:center;font-size:38px");
const crest = el(`<img src="${A}crest.png" style="height:150px;display:block">`, "a", "left:465px;top:1700px");
const cap = el("", "a cap");
const cues = []; for (const b of window.W) for (const s of b.sents) cues.push({ a: s.a, b: s.b, w: s.words });
window.ready = async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => 0)));
  for (const u of ["build/top/top.jpg", A + "bg_cta.png"]) { const i = new Image(); i.src = u; await i.decode().catch(() => 0); }
};
function drawLen(id, p) { const e = $(id), L = e.getTotalLength(); e.style.strokeDasharray = L; e.style.strokeDashoffset = L * (1 - eo(p)); }
window.renderAt = async t => {
  const k = seg(t), lt = t - S[k];
  for (const e of ov.children) e.style.opacity = 0;
  // plate
  if (k === "hook" && t < 2.0) { const i = clamp(Math.floor(t * 15), 0, NDIVE - 1); $("plate").style.backgroundImage = `url(build/top/d_${String(i).padStart(3, "0")}.jpg)`; }
  else if (k === "caps" || k === "cta") $("plate").style.backgroundImage = `url(${A}bg_cta.png)`;
  else $("plate").style.backgroundImage = "url(build/top/top.jpg)";
  // world transform
  let sc = 1;
  if (k === "hook") sc = 1 + .02 * clamp((t - 2) / 2);
  if (k === "clubs") sc = 1.02 + .03 * clamp(lt / 5.6);
  if (k === "draw") sc = 1.05 - .04 * eo(clamp(lt / 1.4));
  if (k === "caps" || k === "cta") sc = 1.06 + .05 * clamp(lt / 8);
  if (k === "end") sc = 1.01 + .03 * clamp(lt / 5.5);
  world.style.transform = `scale(${sc})`;
  $("dim").style.opacity = (k === "caps" || k === "cta") ? .5 : (t < 1.4 ? .22 : .42);
  // pitch graphics
  const onPitch = k === "clubs" || k === "draw" || k === "end" || (k === "hook" && t > 1.6);
  const pl = k === "hook" ? clamp((t - 1.6) / .8) : onPitch ? 1 : 0;
  drawLen("cutv", pl); drawLen("cuth", clamp(pl - .15));
  QS.forEach((q, i) => {
    let a = 0, hot = false;
    if (k === "hook") a = (t - 2.0 - i * .3) / .3;
    else if (onPitch) { a = 1; if (k === "clubs") { const idx = LIGHT.indexOf(i), w = lt - .2 - idx * 1.35; hot = w > 0 && w < 1.35; } }
    q.style.opacity = clamp(a * 2.5) * (k === "clubs" && !hot && lt > .2 ? .45 : 1);
    q.classList.toggle("on", hot || (k === "end"));
    q.style.transform = `translate(-50%,-50%) scale(${a > 0 ? (hot ? 1.06 : sp(a)) : .6})`;
  });
  const sfo = k === "draw" ? clamp((lt - 1.2) / .5) : (k === "end" ? 1 : 0);
  $("sf1").style.opacity = sfo; $("sf2").style.opacity = sfo;
  ["a1", "a2", "a3", "a4"].forEach((id, i) => drawLen(id, (k === "draw") ? clamp((lt - 2.2 - i * .18) / .5) : (k === "end" ? 1 : 0)));
  const fin = $("final"), fa = k === "draw" ? clamp((lt - 4.0) / .6) : (k === "end" ? 1 : 0);
  fin.style.opacity = fa; fin.style.transform = `translate(-50%,-50%) scale(${fa > 0 ? sp(k === "end" ? 1 : (lt - 4.0) / .6) : .5})`;
  // overlays
  if (k === "hook") set(t1, { s: .88 + .12 * sp(t / .6), y: -16 * (1 - eo(t / .7)), o: clamp(t / .2) * clamp((3.5 - t) / .35) });
  if (k === "clubs") set(t2, { o: clamp(lt / .3) * clamp((5.4 - lt) / .4) });
  if (k === "draw") {
    set(t3, { s: .9 + .1 * sp(lt / .4), o: clamp(lt / .2) * clamp((8.4 - lt) / .5) });
    set(pair1, { x: -900 * (1 - eo((lt - .9) / .5)), o: lt > .9 ? clamp((8.4 - lt) / .5) : 0 });
    set(pair2, { x: 900 * (1 - eo((lt - 1.5) / .5)), o: lt > 1.5 ? clamp((8.4 - lt) / .5) : 0 });
  }
  if (k === "caps") {
    set(t4, { s: .9 + .1 * sp(lt / .4), o: clamp(lt / .2) });
    set(t4s, { s: sp((lt - .6) / .4), o: lt > .6 ? 1 : 0 });
    caps.forEach((c, i) => { const a = lt - 1.0 - i * .4; set(c, { y: 50 * (1 - eo(a / .5)), s: .9 + .1 * sp(a / .5), r: (i % 2 ? 1.5 : -1.5), o: a > 0 ? clamp(a * 3) : 0 }); });
  }
  if (k === "cta") {
    poss.forEach((p, i) => { const a = lt - .4 - i * .55; set(p, { x: -700 * (1 - eo(a / .45)), o: a > 0 ? clamp(a * 3) : 0 }); });
    set(goat, { x: -400 * (1 - eo((lt - 2.6) / .5)), s: 1 + .015 * Math.sin(t * 1.6), o: lt > 2.6 ? 1 : 0 });
    set(bub, { s: sp((lt - 3.1) / .4) * (1 + .02 * Math.sin((lt - 3.1) * 5)), r: -2 + Math.sin(t * 2.2) * .7, o: lt > 3.1 ? 1 : 0 });
    set(pill, { s: sp((lt - 4.6) / .45) * (1 + .025 * Math.sin(lt * 6)), o: lt > 4.6 ? 1 : 0 });
    set(note, { o: clamp((lt - 5.4) / .3) });
  }
  if (k === "end") {
    set(eTtl, { o: clamp(lt / .3) });
    set(eSub, { s: .92 + .08 * sp(lt / .5), o: clamp(lt / .25) });
    set(eNote, { s: sp((lt - 1.4) / .4), o: lt > 1.4 ? 1 : 0 });
    set(crest, { s: sp((lt - 2.2) / .5), o: lt > 2.2 ? 1 : 0 });
  }
  // captions (CTA and end carry their own graphics)
  const cue = cues.find(c => t >= c.a - .05 && t <= c.b + .4);
  if (cue && k !== "cta") { cap.innerHTML = cue.w.filter(w => t >= w.a - .02).map(w => `<span>${w.w.replace("Zamin", "ZAMIN")}</span>`).join(""); cap.style.opacity = 1; cap.style.transform = "none"; }
  else cap.style.opacity = 0;
  await new Promise(r => requestAnimationFrame(() => r()));
};
</script>
