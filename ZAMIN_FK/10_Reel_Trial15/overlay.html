<!doctype html><meta charset="utf-8">
<!-- ZAMIN FK 15 s trial Reel: every overlay (titles, word-by-word captions, goat shot, end card) as a pure function of time t.
     render_overlay.js calls window.at(t) and screenshots with a transparent page; shots 1-3 sit on top of the 3D renders, shots 4-5 bring their own background. -->
<style>
@font-face{font-family:MZ;font-weight:900;src:url(../web/city/assets/fonts/Montserrat_900Black.ttf)}
@font-face{font-family:MZ;font-weight:700;src:url(../web/city/assets/fonts/Montserrat_700Bold.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:MZ,sans-serif}
#root{position:absolute;inset:0;overflow:hidden}
.abs{white-space:nowrap;position:absolute;left:0;width:1080px;text-align:center;transform-origin:50% 50%;will-change:transform,opacity}
.big{font-weight:900;color:#fff;line-height:1.0;letter-spacing:-1px;text-shadow:0 6px 0 #0D2557,0 0 26px rgba(13,37,87,.9),0 10px 40px rgba(0,0,0,.6)}
.y{color:#FFD23F}
.tag{display:inline-block;font-weight:900;font-size:40px;color:#0D2557;background:#FFD23F;border-radius:18px;padding:8px 26px;box-shadow:0 6px 0 #0D2557}
.chip{display:inline-block;font-weight:900;font-size:34px;color:#fff;background:rgba(13,37,87,.92);border:4px solid #fff;border-radius:16px;padding:6px 22px}
#cap{white-space:normal;box-sizing:border-box;padding:0 50px;width:1080px;top:1330px;height:300px}
#cap .w{display:inline-block;font-weight:900;font-size:86px;color:#fff;margin:0 10px;text-shadow:0 5px 0 #0D2557,0 0 18px #0D2557,0 0 30px rgba(0,0,0,.7);-webkit-text-stroke:2px #0D2557;paint-order:stroke fill}
#cap .w.on{color:#FFD23F}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(2,8,24,.55) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#bg4,#bg5{position:absolute;left:-90px;top:-160px;width:1260px;height:2240px;background-size:cover;background-position:50% 50%}
#goat{position:absolute;width:760px;transform-origin:35% 12%}
#end3 .abs{font-size:84px}
</style>
<div id="root">
  <div id="bg4" style="opacity:0"></div><div id="bg5" style="opacity:0"></div>
  <div id="shade" style="position:absolute;inset:0;background:#050c20;opacity:0"></div>
  <img id="goat" src="../01_Art_Direction/Sprites/goat_chew.png" style="opacity:0">
  <div id="vig"></div>
  <div id="t1" class="abs big" style="top:150px;font-size:150px"><div>KLUBNI</div><div><span class="y">SIZ</span></div><div style="font-size:112px">BOSHQARASIZ!</div></div>
  <div id="t2" class="abs" style="top:190px"><div class="tag">FUTBOLCHI</div><div class="big" style="font-size:136px;margin-top:20px">SIZ<br><span class="y">HAL QILASIZ!</span></div></div>
  <div id="t3" class="abs" style="top:170px"><div class="tag">KLUB RIVOJI</div><div class="big" style="font-size:140px;margin-top:20px">SIZ<br><span class="y">TANLAYSIZ!</span></div></div>
  <div id="old" class="abs" style="top:880px;left:-210px;width:700px"><span class="chip">OLDIN</span></div>
  <div id="new" class="abs" style="top:880px;left:-210px;width:700px"><span class="chip" style="background:#FFD23F;color:#0D2557;border-color:#0D2557">HOZIR</span></div>
  <div id="t4" class="abs big" style="top:150px;font-size:128px"><div class="y">SHUNCHAKI</div><div>MUXLIS</div><div>EMASSIZ!</div></div>
  <div id="end" style="position:absolute;inset:0">
    <img id="crest" src="../03_Approved_Assets/ZFK_CREST_MASTER_V01_P_2048.png" style="position:absolute;left:380px;top:170px;width:320px;opacity:0">
    <div id="e1" class="abs big" style="font-size:88px;top:560px">SIZ <span class="y">BOSHQARASIZ.</span></div>
    <div id="e2" class="abs big" style="font-size:88px;top:700px">SIZ <span class="y">TANLAYSIZ.</span></div>
    <div id="e3" class="abs big" style="font-size:88px;top:840px">BIZ <span class="y">BAJARAMIZ.</span></div>
    <div id="e4" class="abs big" style="top:1010px;font-size:96px;letter-spacing:6px">ZAMIN FK</div>
    <div id="e5" class="abs" style="top:1230px"><span class="tag" style="font-size:44px">OBUNA BO‘LING 💙</span></div>
  </div>
  <div id="cap" class="abs"></div>
  <div id="flash"></div>
</div>
<script>
const $ = id => document.getElementById(id), cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), sm = u => u * u * (3 - 2 * u);
const back = u => { const c = 1.9; u = cl(u) - 1; return 1 + (c + 1) * u * u * u + c * u * u; };    // overshoot
let WORDS = null;
const show = (el, t, a, b, o = {}) => {                // stamp in at a, out at b (undefined = stay)
  const u = cl((t - a) / (o.d || .22)), out = b == null ? 0 : cl((t - b) / .16), vis = t >= a && out < 1;
  const s = (o.from == null ? 1.35 : o.from) + (1 - (o.from == null ? 1.35 : o.from)) * back(u);
  el.style.opacity = vis ? (u > 0 || o.on0 ? Math.min(1, u * 3 + (o.on0 ? 1 : 0)) : 0) * (1 - out) : 0;
  el.style.transform = `translate(0px,${(1 - sm(u)) * (o.dy || 0)}px) scale(${vis ? s * (1 + (o.pulse ? .02 * Math.sin(t * 9) : 0)) : 1})`;
};
const BG = "assets/";
window.setup = (words, bgs) => { WORDS = words; $("bg4").style.backgroundImage = `url(${BG}${bgs[0]})`; $("bg5").style.backgroundImage = `url(${BG}${bgs[1]})`; };
window.at = t => {
  const R = $("root");
  // ---- backgrounds for shots 4 and 5 ----
  const in4 = t >= 9 && t < 12, in5 = t >= 12;
  $("bg4").style.opacity = in4 ? 1 : 0; $("bg5").style.opacity = in5 ? 1 : 0;
  const z4 = 1 + .06 * cl((t - 9) / 3), z5 = 1.1 - .05 * cl((t - 12) / 3);
  $("bg4").style.transform = `scale(${z4}) translateY(${-14 * (t - 9)}px)`; $("bg4").style.filter = "blur(7px) brightness(.55) saturate(1.1)";
  $("bg5").style.transform = `scale(${z5})`; $("bg5").style.filter = "blur(3px) brightness(.38) saturate(1.15)";
  // ---- goat: looks into the lens, slow push-in towards the face ----
  const g = $("goat"), tg = t - 9, ug = cl(tg / 3);
  const sc = 1 + .55 * sm(ug) ** 1.4, gh = 760 * 1343 / 818;
  g.style.left = (540 - 380 + 36 * (1 - sm(ug))) + "px"; g.style.top = (1320 - gh + 30 + 24 * Math.sin(tg * 1.6) - 40 * sm(ug)) + "px";
  g.style.opacity = in4 ? cl(tg / .25) * (1 - cl((t - 11.88) / .12)) : 0;
  g.style.transform = `scale(${sc}) rotate(${(1 - sm(cl(tg / 1.2))) * 4 + Math.sin(tg * 1.3) * .6}deg)`;
  $("shade").style.opacity = in5 ? .25 : 0;
  // ---- titles ----
  show($("t1"), t, 0, 2.96, { from: 1.0, on0: true });      // already complete on frame 0: works without sound
  const sh = t < 3 ? Math.max(0, 1 - (t - 0) * 5) : 0; R.style.transform = ""; // no screen shake on the hook; impact comes from the camera
  show($("t2"), t, 3.0, 5.96, { from: 1.4, d: .26 }); show($("t3"), t, 6.0, 8.96, { from: 1.4, d: .26 });
  show($("t4"), t, 9.1, 11.9, { from: 1.4, d: .26 });
  show($("old"), t, 6.0, 7.55, { d: .3 }); show($("new"), t, 7.7, 9.0, { d: .3 });
  // ---- end card ----
  show($("crest"), t, 12.05, null, { from: 1.6, d: .35, dy: -60 });
  show($("e1"), t, 12.55, null, { from: 1.5 }); show($("e2"), t, 13.2, null, { from: 1.5 }); show($("e3"), t, 13.85, null, { from: 1.5, pulse: true });
  show($("e4"), t, 14.3, null, { from: 1.3, d: .3 }); show($("e5"), t, 12.1, 12.5, { from: 1.2 });
  $("e5").style.opacity = 0;      // the narration says "Obuna bo'ling" instead of a second chip
  // ---- word-by-word captions (current voice line; active word highlighted) ----
  const cap = $("cap"); let html = "";
  if (WORDS) for (const L of WORDS) {
    if (t >= L.start - .02 && t < L.end + .35) {
      html = L.words.map(w => t >= w.a - .03 ? `<span class="w${t < w.b + .12 && t >= w.a - .03 && w === L.words.filter(x => t >= x.a - .03).slice(-1)[0] ? " on" : ""}" style="transform:scale(${1 + .0 * 0})">${w.w}</span>` : "").join("");
    }
  }
  cap.innerHTML = html; cap.style.opacity = html ? 1 : 0;
  // ---- cut flashes ----
  let f = 0; for (const c of [3, 6, 9, 12]) { const d = t - c; if (d >= 0 && d < .22) f = Math.max(f, .38 * (1 - d / .22)); }
  $("flash").style.opacity = f;
};
</script>
