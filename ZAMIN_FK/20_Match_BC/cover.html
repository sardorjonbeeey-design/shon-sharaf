<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MZ;font-weight:900;src:url(../web/city/assets/fonts/Montserrat_900Black.ttf)}
@font-face{font-family:MZ;font-weight:700;src:url(../web/city/assets/fonts/Montserrat_700Bold.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:MZ,sans-serif;background:#02040c}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#scrim{position:absolute;left:0;top:0;width:1080px;height:1920px;
  background:linear-gradient(180deg,rgba(2,4,12,.75) 0%,rgba(2,4,12,.15) 40%,rgba(2,4,12,.1) 60%,rgba(2,4,12,.5) 100%)}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px}
/* top-left label */
.zfk{position:absolute;top:50px;left:60px;font-size:28px;font-weight:900;color:rgba(255,255,255,.7);letter-spacing:10px}
/* crest top-right */
.crest{position:absolute;top:40px;right:50px;height:100px}
/* label + number */
.label{position:absolute;top:120px;left:60px;font-size:42px;font-weight:900;color:#fff}
.num{position:absolute;top:160px;left:50px;font-size:220px;font-weight:900;color:#FFD23F;line-height:0.95;
  text-shadow:0 8px 0 #0D2557;-webkit-text-stroke:8px #0D2557;paint-order:stroke fill}
/* big title */
.title{position:absolute;top:400px;left:60px;font-size:120px;font-weight:900;color:#fff;line-height:1.0;
  text-shadow:0 6px 30px rgba(0,0,0,.8)}
/* score accent */
.score-accent{position:absolute;top:780px;left:60px;font-size:52px;font-weight:900;color:#FFD23F;letter-spacing:3px}
/* bottom-left handle */
.handle{position:absolute;bottom:50px;left:60px;font-size:34px;font-weight:900;color:#FFD23F}
</style></head><body>
<img id="bg" src="assets/b1_aerial.png">
<div id="scrim"></div>
<div id="ov">
  <div class="zfk">ZAMIN FK</div>
  <img class="crest" src="../12_Reel_Trial_Stadium/assets/crest.png">
  <div class="label">MATCH</div>
  <div class="num">1</div>
  <div class="title">TEAM B<br>vs<br>TEAM C</div>
  <div class="score-accent">3 : 3 · OLTI GOL!</div>
  <div class="handle">@fk_zamin</div>
</div>
</body></html>
