<!doctype html><meta charset=utf-8><title>ZAMIN KUBOGI — bracket</title><style>
@font-face{font-family:M;src:url(../web/city/assets/fonts/Montserrat_900Black.ttf)}
@font-face{font-family:Mb;src:url(../web/city/assets/fonts/Montserrat_800ExtraBold.ttf)}
html,body{margin:0;background:transparent;overflow:hidden}
#st{position:relative;width:1080px;height:1920px;font-family:M,sans-serif;color:#fff}
.slot{position:absolute;height:132px;border-radius:30px;background:rgba(5,14,60,.92);border:5px solid #1F4FB8;
      box-shadow:0 0 34px rgba(31,79,184,.45);display:flex;align-items:center;gap:22px;padding:0 28px;box-sizing:border-box;
      font:900 46px M;letter-spacing:1px}
.slot .q{width:76px;height:76px;flex:none;border-radius:50%;background:rgba(31,79,184,.35);border:4px solid #6f9bff;
      display:flex;align-items:center;justify-content:center;font:900 44px M;color:#9fb6ff}
.slot.on{border-color:#FFD23F;box-shadow:0 0 50px rgba(255,210,63,.55)}
.slot.on .q{background:#FFD23F;color:#0D2557;border-color:#fff}
.tag{position:absolute;font:900 34px M;color:#9fb6ff;letter-spacing:5px}
svg{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.ln{fill:none;stroke:#2d5fd0;stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 12px rgba(80,140,255,.65))}
.ln.on{stroke:#FFD23F;filter:drop-shadow(0 0 16px rgba(255,210,63,.8))}
#final{position:absolute;left:150px;top:1180px;width:780px;height:150px;border-radius:36px;background:linear-gradient(120deg,#1F4FB8,#0D2557);
      border:6px solid #FFD23F;box-shadow:0 0 60px rgba(31,79,184,.6);display:flex;align-items:center;justify-content:center;
      font:900 58px M;letter-spacing:4px}
#cup{position:absolute;left:0;width:1080px;top:1400px;text-align:center}
#cup .t{font:900 150px M;line-height:1;filter:drop-shadow(0 0 40px rgba(255,210,63,.75))}
#cup .w{margin-top:10px;font:900 44px M;color:#FFD23F;letter-spacing:4px}
#title{position:absolute;left:0;width:1080px;top:70px;text-align:center;font:900 92px/1.04 M;
      -webkit-text-stroke:9px rgba(5,14,60,.92);paint-order:stroke fill}
#title small{display:block;margin-top:22px;font:900 36px M;color:#9fb6ff;letter-spacing:8px;-webkit-text-stroke:0}
</style>
<div id=st>
  <div id=title>MUXLISLAR<br><span style="color:#FFD23F">KUBOGI</span><small>4 KLUB · 3 O‘YIN · 1 G‘OLIB</small></div>
  <svg viewBox="0 0 1080 1920">
    <path class="ln" id="l1" d="M 560 472 H 680 V 636 H 560"/>
    <path class="ln" id="l2" d="M 560 912 H 680 V 1076 H 560"/>
    <path class="ln" id="l3" d="M 680 554 H 800 V 774"/>
    <path class="ln" id="l4" d="M 680 994 H 800 V 774"/>
    <path class="ln" id="l5" d="M 800 774 V 1180"/>
  </svg>
  <div class="tag" id="sf1" style="left:60px;top:360px">YARIM FINAL 1</div>
  <div class="slot" id="s1" style="left:60px;top:406px;width:500px"><span class="q">?</span><span class="nm">KLUB 1</span></div>
  <div class="slot" id="s2" style="left:60px;top:570px;width:500px"><span class="q">?</span><span class="nm">KLUB 2</span></div>
  <div class="tag" id="sf2" style="left:60px;top:800px">YARIM FINAL 2</div>
  <div class="slot" id="s3" style="left:60px;top:846px;width:500px"><span class="q">?</span><span class="nm">KLUB 3</span></div>
  <div class="slot" id="s4" style="left:60px;top:1010px;width:500px"><span class="q">?</span><span class="nm">KLUB 4</span></div>
  <div id="final">FINAL</div>
  <div id="cup"><div class="t">🏆</div><div class="w">G‘OLIB — BUTUN JAMOA</div></div>
</div>
<script>
// state: window.B = {names:[4], on:[bool x4], final:"", scores:{sf1:"3–1", sf2:""}}
const B = window.B || {};
(B.names || []).forEach((n, i) => { if (!n) return; const s = document.getElementById("s" + (i + 1)); s.querySelector(".nm").textContent = n; s.querySelector(".q").textContent = "⚽"; });
(B.on || []).forEach((v, i) => { if (v) document.getElementById("s" + (i + 1)).classList.add("on"); });
if (B.final) document.getElementById("final").textContent = B.final;
if (B.lines) B.lines.forEach(id => document.getElementById(id).classList.add("on"));
window.ready = async () => { await document.fonts.ready; };
// draw-on animation: 0..1
window.at = p => {
  const el = document.getElementById("st");
  const lines = [...document.querySelectorAll(".ln")];
  lines.forEach((l, i) => { const L = l.getTotalLength(); l.style.strokeDasharray = L; l.style.strokeDashoffset = L * (1 - Math.max(0, Math.min(1, (p - .25 - i * .08) / .35))); });
  const slots = [...document.querySelectorAll(".slot")];
  slots.forEach((s, i) => { const a = Math.max(0, Math.min(1, (p - i * .07) / .25)); s.style.opacity = a; s.style.transform = `translateX(${-60 * (1 - a)}px)`; });
  document.getElementById("final").style.opacity = Math.max(0, Math.min(1, (p - .62) / .2));
  document.getElementById("cup").style.opacity = Math.max(0, Math.min(1, (p - .74) / .2));
  document.getElementById("title").style.opacity = Math.max(0, Math.min(1, p / .15));
};
window.at(1);
</script>
