<!doctype html><meta charset=utf-8><title>ZAMIN KUBOGI — pitch bracket</title><style>
@font-face{font-family:M;src:url(../web/city/assets/fonts/Montserrat_900Black.ttf)}
@font-face{font-family:Mb;src:url(../web/city/assets/fonts/Montserrat_800ExtraBold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
#st{position:relative;width:1080px;height:1920px;font-family:M,sans-serif;color:#fff;overflow:hidden}
#plate{position:absolute;inset:0;background:url(build/top/top.jpg) center/cover}
#dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(3,8,26,.26) 0%,rgba(3,8,26,.72) 100%)}
svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
.cut{fill:none;stroke:#eaf1ff;stroke-width:6;stroke-linecap:round;opacity:.9;filter:drop-shadow(0 0 14px rgba(150,190,255,.9))}
.arrow{fill:none;stroke:#FFD23F;stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 14px rgba(255,210,63,.8))}
.q{position:absolute;transform:translate(-50%,-50%);width:300px;text-align:center}
.q .b{width:300px;height:150px;border-radius:34px;background:rgba(5,14,60,.86);border:5px solid #1F4FB8;
      box-shadow:0 0 36px rgba(31,79,184,.55);display:flex;align-items:center;justify-content:center;gap:18px;box-sizing:border-box}
.q .m{width:84px;height:84px;border-radius:50%;background:rgba(31,79,184,.4);border:5px solid #6f9bff;
      display:flex;align-items:center;justify-content:center;font:900 48px M;color:#cfe0ff}
.q .n{font:900 40px M;letter-spacing:1px}
.q .t{margin-top:12px;font:900 28px M;color:#9fb6ff;letter-spacing:4px}
#final{position:absolute;left:540px;top:960px;transform:translate(-50%,-50%);width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#1F4FB8,#0b1f4d 70%);border:8px solid #FFD23F;
  box-shadow:0 0 70px rgba(255,210,63,.45),inset 0 0 50px rgba(0,0,0,.5);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px}
#final .c{font:900 96px/1 M}
#final .l{font:900 44px M;color:#FFD23F;letter-spacing:6px}
#title{position:absolute;left:0;width:1080px;top:86px;text-align:center;font:900 76px/1.05 M;
  -webkit-text-stroke:9px rgba(3,8,26,.92);paint-order:stroke fill}
#title small{display:block;margin-top:16px;font:900 34px M;color:#9fb6ff;letter-spacing:8px;-webkit-text-stroke:0}
#foot{position:absolute;left:0;width:1080px;bottom:120px;text-align:center;font:900 42px M;color:#FFD23F;letter-spacing:4px;
  -webkit-text-stroke:8px rgba(3,8,26,.9);paint-order:stroke fill}
</style>
<div id=st>
  <div id=plate></div><div id=dim></div>
  <svg viewBox="0 0 1080 1920">
    <path class="cut" id="cutv" d="M 540 346 V 1574"/>
    <path class="cut" id="cuth" d="M 142 960 H 938"/>
    <path class="arrow" id="a1" d="M 341 740 L 460 900"/>
    <path class="arrow" id="a2" d="M 739 740 L 620 900"/>
    <path class="arrow" id="a3" d="M 341 1180 L 460 1020"/>
    <path class="arrow" id="a4" d="M 739 1180 L 620 1020"/>
  </svg>
  <div class="q" id="q1" style="left:341px;top:656px"><div class=b><span class=m>?</span><span class=n>KLUB 1</span></div></div>
  <div class="q" id="q2" style="left:739px;top:656px"><div class=b><span class=m>?</span><span class=n>KLUB 2</span></div></div>
  <div class="q" id="q3" style="left:341px;top:1264px"><div class=b><span class=m>?</span><span class=n>KLUB 3</span></div></div>
  <div class="q" id="q4" style="left:739px;top:1264px"><div class=b><span class=m>?</span><span class=n>KLUB 4</span></div></div>
  <div class="sfl" id="sf1" style="position:absolute;left:0;width:1080px;top:512px;text-align:center;font:900 32px M;color:#9fb6ff;letter-spacing:7px">YARIM FINAL 1</div>
  <div class="sfl" id="sf2" style="position:absolute;left:0;width:1080px;top:1392px;text-align:center;font:900 32px M;color:#9fb6ff;letter-spacing:7px">YARIM FINAL 2</div>
  <div id="final"><div class=c>🏆</div><div class=l>FINAL</div></div>
  <div id="title">MUXLISLAR <span style="color:#FFD23F">KUBOGI</span><small>4 KLUB · 3 O‘YIN · 1 G‘OLIB</small></div>
  <div id="foot">G‘OLIB — BUTUN JAMOA</div>
</div>
<script>
const B = window.B || {};
(B.names || []).forEach((n, i) => { if (!n) return; const q = document.getElementById("q" + (i + 1)); q.querySelector(".n").textContent = n; q.querySelector(".m").textContent = "⚽"; });
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const sp = x => { x = clamp(x); return x < 1 ? 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2) : 1; };
window.ready = async () => { await document.fonts.ready; await Promise.all([...document.images].map(i => i.decode().catch(() => 0))); };
// p: 0..1 over the beat; also used as a still at p=1
window.at = p => {
  document.getElementById("title").style.opacity = clamp(p / .12);
  [["cutv", 0], ["cuth", .12]].forEach(([id, d]) => { const el = document.getElementById(id), L = el.getTotalLength();
    el.style.strokeDasharray = L; el.style.strokeDashoffset = L * (1 - eo((p - .08 - d) / .3)); });
  [1, 2, 3, 4].forEach(i => { const q = document.getElementById("q" + i), a = (p - .3 - (i - 1) * .07) / .22, s = sp(a);
    q.style.opacity = clamp(a * 3); q.style.transform = `translate(-50%,-50%) scale(${a > 0 ? s : .6})`; });
  ["a1", "a2", "a3", "a4"].forEach((id, i) => { const el = document.getElementById(id), L = el.getTotalLength();
    el.style.strokeDasharray = L; el.style.strokeDashoffset = L * (1 - eo((p - .62 - i * .04) / .2)); });
  ["sf1","sf2"].forEach((id,i)=>{ document.getElementById(id).style.opacity = clamp((p - .5 - i*.05) / .2); });
  const f = document.getElementById("final"), a = (p - .74) / .22;
  f.style.opacity = clamp(a * 3); f.style.transform = `translate(-50%,-50%) scale(${a > 0 ? sp(a) : .5})`;
  document.getElementById("foot").style.opacity = clamp((p - .88) / .12);
};
window.at(1);
</script>
