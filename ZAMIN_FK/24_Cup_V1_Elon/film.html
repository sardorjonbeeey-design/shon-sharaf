<!doctype html><meta charset=utf-8><style>
@font-face{font-family:M;src:url(../web/city/assets/fonts/Montserrat_900Black.ttf)}
@font-face{font-family:Mb;src:url(../web/city/assets/fonts/Montserrat_800ExtraBold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050e3c;font-family:M,sans-serif;color:#fff}
.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
#world{position:absolute;left:0;top:0;width:1080px;height:1920px;will-change:transform}
#plate{position:absolute;inset:0;background-size:cover;background-position:center}
#dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(3,8,26,.24) 0%,rgba(3,8,26,.72) 100%);opacity:0}
svg.pitch{position:absolute;left:0;top:0;width:1080px;height:1920px}
.cut{fill:none;stroke:#eaf1ff;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 14px rgba(150,190,255,.9))}
.arrow{fill:none;stroke:#FFD23F;stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 14px rgba(255,210,63,.8))}
.q{position:absolute;transform:translate(-50%,-50%);opacity:0}
.q .b{width:300px;height:150px;border-radius:34px;background:rgba(5,14,60,.88);border:5px solid #1F4FB8;
  box-shadow:0 0 36px rgba(31,79,184,.55);display:flex;align-items:center;justify-content:center;gap:18px;box-sizing:border-box}
.q .m{width:84px;height:84px;border-radius:50%;background:rgba(31,79,184,.4);border:5px solid #6f9bff;
  display:flex;align-items:center;justify-content:center;font:900 48px M;color:#cfe0ff}
.q .n{font:900 40px M;letter-spacing:1px}
#final{position:absolute;left:540px;top:960px;transform:translate(-50%,-50%) scale(.5);width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#1F4FB8,#0b1f4d 70%);border:8px solid #FFD23F;
  box-shadow:0 0 70px rgba(255,210,63,.45),inset 0 0 50px rgba(0,0,0,.5);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;opacity:0}
#final .c{font:900 96px/1 M} #final .l{font:900 44px M;color:#FFD23F;letter-spacing:6px}
.sfl{position:absolute;left:0;width:1080px;text-align:center;font:900 32px M;color:#cfe0ff;letter-spacing:7px;opacity:0;
  -webkit-text-stroke:7px rgba(3,8,26,.85);paint-order:stroke fill}
.a{position:absolute;opacity:0;will-change:transform,opacity}
.ttl{-webkit-text-stroke:9px rgba(3,8,26,.92);paint-order:stroke fill}
.chip{height:92px;line-height:84px;border-radius:46px;padding:0 40px;display:block;font:900 42px M;
  background:rgba(5,14,60,.9);border:4px solid #1F4FB8;box-shadow:0 0 32px rgba(31,79,184,.5);white-space:nowrap}
.pill{height:108px;line-height:98px;text-align:center;border-radius:54px;background:#FFD23F;color:#0D2557;font:900 46px M;
  border:5px solid #0D2557;box-shadow:0 10px 34px rgba(0,0,0,.45)}
.cap{left:60px;width:960px;bottom:120px;text-align:center;font:900 60px/1.14 M;paint-order:stroke fill;
  -webkit-text-stroke:10px rgba(5,14,60,.95);opacity:0}
.cap span{display:inline-block;margin:0 9px}
#vig{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 54%,rgba(2,6,24,.6) 100%)}
</style>
<div id=st>
  <div id=world>
    <div id=plate class=full></div>
    <div id=dim></div>
    <svg class="pitch" viewBox="0 0 1080 1920">
      <path class="cut" id="cutv" d="M 540 346 V 1574"/>
      <path class="cut" id="cuth" d="M 142 960 H 938"/>
      <path class="arrow" id="a1" d="M 341 740 L 460 900"/>
      <path class="arrow" id="a2" d="M 739 740 L 620 900"/>
      <path class="arrow" id="a3" d="M 341 1180 L 460 1020"/>
      <path class="arrow" id="a4" d="M 739 1180 L 620 1020"/>
    </svg>
    <div class="sfl" id="sf1" style="top:512px">YARIM FINAL 1</div>
    <div class="sfl" id="sf2" style="top:1392px">YARIM FINAL 2</div>
    <div class="q" id="q1" style="left:341px;top:656px"><div class=b><span class=m>?</span><span class=n>KLUB 1</span></div></div>
    <div class="q" id="q2" style="left:739px;top:656px"><div class=b><span class=m>?</span><span class=n>KLUB 2</span></div></div>
    <div class="q" id="q3" style="left:341px;top:1264px"><div class=b><span class=m>?</span><span class=n>KLUB 3</span></div></div>
    <div class="q" id="q4" style="left:739px;top:1264px"><div class=b><span class=m>?</span><span class=n>KLUB 4</span></div></div>
    <div id="final"><div class=c>🏆</div><div class=l>FINAL</div></div>
  </div>
  <div id=vig class=full></div>
  <div id=ov class=full></div>
</div>
<script>
const A = "assets/", FPS = 30;
// dive (aerial → straight down) · split (pitch cut into four) · founder (zoom into a quadrant) · cup (zoom out, final) · cta (goat)
const S = { dive: 0, split: 4.0, founder: 8.6, cup: 15.2, cta: 20.6 }; window.END = 28.6;
const NDIVE = 30;                                            // 15 fps dive plates
const $ = id => document.getElementById(id), ov = $("ov"), world = $("world");
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3), sp = x => { x = clamp(x); return x < 1 ? 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2) : 1; };
const seg = t => { let k = "dive"; for (const n in S) if (t >= S[n]) k = n; return k; };
function el(html, cls = "a", style = "") { const d = document.createElement("div"); d.className = cls; d.style.cssText = style; d.innerHTML = html; ov.appendChild(d); return d; }
function set(e, { x = 0, y = 0, s = 1, r = 0, o = 1 }) { e.style.opacity = o; e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; }
// ---- screen-space overlays (these never move with the zoom) ----
const t1 = el(`4 TA KLUB<br><span style="color:#FFD23F">TUG‘ILADI</span>`, "a ttl", "left:0;width:1080px;top:120px;text-align:center;font:900 92px/1.04 M");
const t2 = el(`MUXLISLAR <span style="color:#FFD23F">KUBOGI</span>`, "a ttl", "left:0;width:1080px;top:130px;text-align:center;font:900 76px/1.04 M");
const t2s = el("4 KLUB · 3 O‘YIN · 1 G‘OLIB", "a", "left:0;width:1080px;top:232px;text-align:center;font:900 36px M;color:#cfe0ff;letter-spacing:7px;-webkit-text-stroke:7px rgba(3,8,26,.85);paint-order:stroke fill");
const fttl = el("NOMNI <span style='color:#FFD23F'>SIZ</span> YOZASIZ", "a ttl", "left:0;width:1080px;top:250px;text-align:center;font:900 68px M");
const fcard = el(`<div style="width:760px;border-radius:44px;background:linear-gradient(150deg,#1F4FB8,#0b1f4d);border:7px solid #FFD23F;box-shadow:0 24px 70px rgba(0,0,0,.6);padding:34px 30px;box-sizing:border-box;text-align:center">
   <div style="font:900 36px M;color:#cfe0ff;letter-spacing:6px">YANGI KLUB ASOSCHISI</div>
   <div style="margin-top:18px;font:900 86px M;color:#FFD23F">@username</div>
   <div style="margin-top:14px;font:900 38px M">KLUB NOMINI U YOZDI</div>
   <div style="margin-top:16px;font:900 26px M;color:rgba(255,255,255,.5);letter-spacing:5px">NAMUNA</div></div>`,
  "a", "left:160px;top:810px");
const fsub = el("eng ko‘p layk olgan nom — klub", "a chip", "left:190px;top:1420px;width:700px;text-align:center;font-size:38px");
const foot = el("G‘OLIB — BUTUN JAMOA", "a", "left:0;width:1080px;top:1690px;text-align:center;font:900 42px M;color:#FFD23F;letter-spacing:4px;-webkit-text-stroke:8px rgba(3,8,26,.9);paint-order:stroke fill");
// ---- CTA ----
const goat = el(`<img src="${A}goat_talk.png" style="height:900px;display:block">`, "a", "left:10px;top:990px");
const bub = el("Klub nomini<br>yozing!", "a", "left:440px;top:520px;width:520px;padding:30px 36px;box-sizing:border-box;border-radius:44px;background:#fff;color:#0D2557;font:900 60px/1.12 M;box-shadow:0 12px 40px rgba(0,0,0,.5);text-align:center");
const cm = [1, 2].map(i => el(`<img src="${A}comment_${i}.png" style="width:620px;display:block;border-radius:20px">`, "a", "left:430px;top:0"));
const pill = el("Izohga klub nomini yozing 👇", "a pill", "left:100px;top:1500px;width:880px;font-size:48px");
const note = el("24 soat · eng ko‘p layk olgan 4 ta nom", "a", "left:0;width:1080px;top:1640px;text-align:center;font:900 38px M;color:#cfe0ff;-webkit-text-stroke:8px rgba(5,14,60,.9);paint-order:stroke fill");
const rules = el("nom bir-ikki so‘z · haqoratsiz · real klub yoki odam nomi emas", "a", "left:0;width:1080px;top:1716px;text-align:center;font:800 28px Mb;color:rgba(205,222,255,.95);-webkit-text-stroke:7px rgba(5,14,60,.9);paint-order:stroke fill");
const cap = el("", "a cap");
const cues = []; for (const b of window.W) for (const s of b.sents) cues.push({ a: s.a, b: s.b, w: s.words });
const QS = [1, 2, 3, 4].map(i => $("q" + i));
window.ready = async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => 0)));
  for (const u of ["build/top/top.jpg", A + "bg_cta.png"]) { const i = new Image(); i.src = u; await i.decode().catch(() => 0); }
};
function drawLen(id, p) { const e = $(id), L = e.getTotalLength(); e.style.strokeDasharray = L; e.style.strokeDashoffset = L * (1 - eo(p)); }
window.renderAt = async t => {
  const k = seg(t), lt = t - S[k];
  for (const e of ov.children) e.style.opacity = 0;
  // ---- plate ----
  if (k === "dive" && t < 2.0) { const i = clamp(Math.floor(t * 15), 0, NDIVE - 1); $("plate").style.backgroundImage = `url(build/top/d_${String(i).padStart(3, "0")}.jpg)`; }
  else if (k === "cta") $("plate").style.backgroundImage = `url(${A}bg_cta.png)`;
  else $("plate").style.backgroundImage = "url(build/top/top.jpg)";
  // ---- world transform: slow push, then a zoom into quadrant 1 for the founder beat ----
  let sc = 1, ox = 0, oy = 0;
  if (k === "dive") sc = 1 + .02 * clamp((t - 2) / 2);
  if (k === "split") sc = 1.02 + .03 * clamp(lt / 4.4);
  if (k === "founder") { const z = eo(clamp(lt / 1.2)) * (1 - eo(clamp((lt - 5.2) / 1.2))); sc = 1.05 + .75 * z; ox = (540 - 341) * (sc - 1); oy = (960 - 656) * (sc - 1); }
  if (k === "cup") sc = 1.05 - .05 * eo(clamp(lt / 1.4));
  if (k === "cta") sc = 1.06 + .05 * clamp(lt / 8);
  world.style.transform = `translate(${ox}px,${oy}px) scale(${sc})`;
  $("dim").style.opacity = k === "cta" ? .45 : (t < 1.4 ? .2 : .4);
  // ---- pitch graphics ----
  const showPitch = k === "split" || k === "founder" || k === "cup";
  const pl = k === "split" ? clamp(lt / 1.2) : showPitch ? 1 : 0;
  drawLen("cutv", pl); drawLen("cuth", clamp(pl - .15));
  QS.forEach((q, i) => {
    const a = k === "split" ? (lt - 1.0 - i * .22) / .3 : showPitch ? 1 : 0;
    const fade = k === "founder" && i > 0 ? .3 : 1;
    q.style.opacity = clamp(a * 2.5) * fade;
    q.style.transform = `translate(-50%,-50%) scale(${a > 0 ? sp(a) : .6})`;
  });
  const sfo = k === "split" ? clamp((lt - 2.6) / .4) : showPitch ? (k === "founder" ? 0 : 1) : 0;
  $("sf1").style.opacity = sfo; $("sf2").style.opacity = sfo;
  ["a1", "a2", "a3", "a4"].forEach((id, i) => drawLen(id, k === "cup" ? clamp((lt - .6 - i * .12) / .5) : 0));
  const fin = $("final"), fa = k === "cup" ? clamp((lt - 1.5) / .6) : 0;
  fin.style.opacity = fa; fin.style.transform = `translate(-50%,-50%) scale(${fa > 0 ? sp((lt - 1.5) / .6) : .5})`;
  // ---- screen overlays per beat ----
  if (k === "dive") set(t1, { s: .88 + .12 * sp(t / .6), y: -16 * (1 - eo(t / .7)), o: clamp(t / .2) * clamp((3.9 - t) / .35) });
  if (k === "split") { set(t2, { s: .92 + .08 * sp(lt / .5), o: clamp(lt / .25) * clamp((4.3 - lt) / .4) }); set(t2s, { o: clamp((lt - .6) / .4) * clamp((4.3 - lt) / .4) }); }
  if (k === "founder") {
    set(fttl, { y: -24 * (1 - eo((lt - .6) / .5)), o: clamp((lt - .6) / .3) * clamp((5.9 - lt) / .5) });
    set(fcard, { y: 40 * (1 - eo((lt - 1.4) / .6)), s: .92 + .08 * sp((lt - 1.4) / .6), o: clamp((lt - 1.4) / .3) * clamp((6.0 - lt) / .5) });
    set(fsub, { o: clamp((lt - 3.6) / .4) * clamp((6.0 - lt) / .5) });
  }
  if (k === "cup") {
    set(t2, { s: 1, o: clamp(lt / .3) * clamp((5.0 - lt) / .5) });
    set(t2s, { o: clamp(lt / .4) * clamp((5.0 - lt) / .5) });
    set(foot, { o: clamp((lt - 2.6) / .4) * clamp((5.2 - lt) / .4) });
  }
  if (k === "cta") {
    set(goat, { x: -480 * (1 - eo(lt / .55)), s: 1 + .015 * Math.sin(t * 1.6), o: clamp(lt / .2) });
    set(bub, { s: sp((lt - .5) / .4) * (1 + .02 * Math.sin((lt - .5) * 5)), r: -2 + Math.sin(t * 2.2) * .7, o: lt > .5 ? 1 : 0 });
    cm.forEach((c, i) => { const a = lt - 2.1 - i * .5; set(c, { x: 700 * (1 - eo(a / .5)), y: 1000 + i * 190, o: a > 0 ? clamp(a * 4) : 0 }); });
    set(pill, { s: sp((lt - 4.3) / .45) * (1 + .025 * Math.sin(lt * 6)), o: lt > 4.3 ? 1 : 0 });
    set(note, { o: clamp((lt - 5.0) / .3) });
    set(rules, { o: clamp((lt - 5.6) / .4) });
  }
  // ---- captions ----
  const cue = cues.find(c => t >= c.a - .05 && t <= c.b + .4);
  if (cue && k !== "cta") { cap.innerHTML = cue.w.filter(w => t >= w.a - .02).map(w => `<span>${w.w.replace("Zamin", "ZAMIN")}</span>`).join(""); cap.style.opacity = 1; cap.style.transform = "none"; }
  else cap.style.opacity = 0;
  await new Promise(r => requestAnimationFrame(() => r()));
};
</script>
