<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MZ;font-weight:900;src:url(../web/city/assets/fonts/Montserrat_900Black.ttf)}
@font-face{font-family:MZ;font-weight:700;src:url(../web/city/assets/fonts/Montserrat_700Bold.ttf)}
html,body{margin:0;background:#020810;overflow:hidden;width:1080px;height:1920px;font-family:MZ,sans-serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 960px}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px}
/* radial vignette — dark edges, open centre — different from R16 linear */
#scrim{position:absolute;left:0;top:0;width:1080px;height:1920px;
  background:radial-gradient(ellipse 70% 55% at 50% 50%,rgba(2,8,16,.0) 0%,rgba(2,8,16,.55) 65%,rgba(2,8,16,.92) 100%)}
/* purple-teal tint layer */
#tint{position:absolute;left:0;top:0;width:1080px;height:1920px;
  background:linear-gradient(160deg,rgba(10,30,60,.55) 0%,rgba(0,80,80,.3) 100%);mix-blend-mode:multiply}
/* beat-5 dark overlay */
#dark5{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#020810;opacity:0}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.it{position:absolute;white-space:nowrap;text-align:center;color:#fff;font-weight:900}
/* heading: label BIGGER, main text centered at ~y=640 instead of 170 */
.hd{text-align:center}
.hd small{display:block;font-size:52px;letter-spacing:5px;text-shadow:0 4px 20px #000;color:#9fb6ff}
.hd b{display:block;font-size:100px;line-height:1.0;color:#FFD23F;
  text-shadow:0 8px 0 #0D2557,0 14px 36px rgba(0,0,0,.8);
  -webkit-text-stroke:7px #0D2557;paint-order:stroke fill}
.hd b.w{color:#fff}
.hd b.r{color:#E63946;-webkit-text-stroke:7px #7a1138}
/* fan xi dots — slightly smaller/dimmer than R16 (they're established) */
.dot{width:66px;height:66px;border-radius:50%;background:#1F4FB8;border:4px solid rgba(255,255,255,.7);
  color:#fff;font-size:28px;line-height:58px;box-shadow:0 0 18px rgba(100,180,255,.7)}
.nm{margin-top:5px;font-size:21px;background:rgba(5,14,40,.85);border:2px solid rgba(31,79,184,.8);
  border-radius:10px;padding:2px 10px;display:inline-block;color:#9fb6ff}
/* fan xi B-side slots (gold filled, same as R16 but slightly smaller) */
.slot{width:68px;height:68px;border-radius:50%;border:5px dashed #FFD23F;background:rgba(5,14,40,.78);
  color:#FFD23F;font-size:46px;line-height:58px;box-shadow:0 0 24px rgba(255,210,63,.6)}
.slot.f{border-style:solid;font-size:28px;color:#0D2557;background:#FFD23F}
/* sinov jamoasi — TEAL, clearly different from gold fan xi */
.slot.sv{border-color:#00D4AA;color:#00D4AA;background:rgba(0,30,30,.8);box-shadow:0 0 24px rgba(0,212,170,.5)}
.nm.sv{border-color:#00D4AA;color:#00D4AA;background:rgba(0,20,20,.88)}
/* MURABBIY — big centre reveal card */
.coach-card{background:linear-gradient(145deg,#FFD23F,#F4A800);border-radius:34px;
  padding:28px 48px;box-shadow:0 0 60px rgba(255,210,63,.8),0 20px 50px rgba(0,0,0,.7);
  border:6px solid #fff;text-align:center;min-width:600px}
.coach-card .cc-role{font-size:36px;letter-spacing:6px;color:#0D2557;margin-bottom:4px}
.coach-card .cc-name{font-size:72px;color:#0D2557;line-height:1.1}
.coach-card .cc-likes{font-size:34px;color:#7a5200;margin-top:8px}
/* comment screenshot card */
.cmt{background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.75);
  border:5px solid #FFD23F;width:940px}
.cmt img{width:940px;display:block}
/* whisper box */
.whisper{font-size:50px;line-height:1.5;text-align:center;color:#c8d8ff;white-space:normal;width:860px;
  background:rgba(0,10,30,.7);border:3px solid rgba(0,212,170,.35);border-radius:34px;
  padding:32px 50px;box-shadow:0 0 50px rgba(0,212,170,.2)}
.whisper .wbig{font-size:72px;color:#00D4AA}
.whisper .wgreen{color:#9ff5a0}
/* cta band */
.band{font-size:40px;background:rgba(5,14,40,.92);border:5px solid #00D4AA;border-radius:26px;
  padding:14px 36px;box-shadow:0 0 34px rgba(0,212,170,.3)}
.band small{display:block;font-size:26px;letter-spacing:3px;color:#00D4AA}
.cta-box{font-size:50px;background:rgba(0,20,20,.92);border:5px solid #00D4AA;border-radius:28px;
  padding:22px 38px;line-height:1.5;text-align:center;white-space:normal;width:860px;
  box-shadow:0 0 40px rgba(0,212,170,.3)}
.cta-box small{display:block;font-size:30px;color:#00D4AA;letter-spacing:2px;margin-bottom:8px}
.follow{font-size:66px;color:#fff;background:#E1306C;border-radius:60px;padding:22px 66px;
  box-shadow:0 10px 0 #7a1138,0 16px 36px rgba(0,0,0,.6)}
.fn{font-size:17px;padding:2px 8px}
#fl{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0;z-index:50}
</style></head><body>
<div id="stage"><img id="bg"><div id="scrim"></div><div id="tint"></div><div id="dark5"></div><div id="ovp"></div></div>
<div id="ov"></div><div id="fl"></div>
<script>
const W=window.W||[],BS={};W.forEach(b=>BS[b.beat]=b);
const S=(b,i)=>BS[b].sents[i],bs=n=>BS[n].start,be=n=>n<6?BS[n+1].start+.02:END;
const END=W[W.length-1].end+1.0;window.END=END;const FPS=30,DIVE=40;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),sm=(a,b,x)=>{const t=cl((x-a)/(b-a));return t*t*(3-2*t);};
const eob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};

const LAY={"A_GK":[539.9999999999994,1533.167730114379],"B_GK":[539.9999999999995,386.83106406521017],"A_LB":[212.47550313313215,1392.8002389299802],"B_LB":[867.5250265966424,527.1990829340957],"A_CB1":[411.3296703819604,1427.89211862891],"B_CB1":[668.6705545997966,492.1070851197428],"A_CB2":[668.6703296180383,1427.89211862891],"B_CB2":[411.32944540020253,492.1070851197428],"A_RB":[867.5244968668667,1392.8002389299802],"B_RB":[212.47497340335673,527.1990829340957],"A_CDM":[738.8542109668173,1252.4326741153666],"B_CDM":[341.1455717212562,667.5670281724091],"A_CM":[341.1457890331815,1252.4326741153666],"B_CM":[738.8544282787427,667.5670281724091],"A_CAM":[539.9999999999994,1182.2488640967108],"B_CAM":[539.9999999999994,737.7509731801194],"A_LW":[235.86991728392292,1053.5784979206067],"B_LW":[844.1301890710889,866.4214912189104],"A_ST":[539.9999999999994,1030.1838792414042],"B_ST":[539.9999999999994,889.8161242151339],"A_RW":[844.130082716076,1053.5784979206067],"B_RW":[235.86981092891006,866.4214912189104]};
const FANS={GK:"ibroxim.abdullayev7",LB:"nomonjonv.13",CB1:"mukhammadjnovv",CB2:"bogbekov_04",RB:"umaraliyev_nurilla",CDM:"asanbekov.fcb",CM:"abdulhamidov.17_",CAM:"abduxolisovv",LW:"erkin_kasimjanovich",ST:"abduxolisov_fc",RW:"as1bek__11"};
const PKEYS=["GK","LB","CB1","CB2","RB","CDM","CM","CAM","LW","ST","RW"];

const items=[],OVP=document.getElementById("ovp"),OV=document.getElementById("ov"),FL=document.getElementById("fl");
function add(par,html,x,y,at,to,o={}){
  const d=document.createElement("div");d.className="it "+(o.cls||"");d.innerHTML=html;
  d.style.left=x+"px";d.style.top=y+"px";d.style.display="none";
  if(o.z)d.style.zIndex=o.z;par.appendChild(d);items.push({d,at,to:to==null?1e9:to,o});return d;
}
const hd=(label,big,at,to,y=640,o={})=>add(OV,`<small>${label}</small><b class="${o.cls2||""}">${big}</b>`,540,y,at,to,{cls:"hd",z:20,enter:"stamp",...o});

function frameOv(t){
  for(const it of items){
    const{d,at,to,o}=it;if(!(t>=at&&t<to)){d.style.display="none";continue;}
    d.style.display="block";const u=t-at,e=o.enter==="none"?1:eob(cl(u/(o.enter==="stamp"?.3:.34))),out=o.keep?1:cl((to-t)/.12);
    let s=1;if(o.pulse)s=1+.06*Math.sin(u*7+(o.ph||0));if(o.glow)d.style.filter=`drop-shadow(0 0 ${14+10*Math.sin(u*6)}px #FFD23F)`;
    if(o.tglow)d.style.filter=`drop-shadow(0 0 ${12+8*Math.sin(u*5)}px #00D4AA)`;
    d.style.opacity=String(cl(u/.08)*out*(o.dim?o.dim(t):1));
    d.style.transform=`translate(-50%,-50%) scale(${(.3+.7*e)*s})`+(o.rot?` rotate(${o.rot}deg)`:"");
  }
  // dark5 overlay for whisper beat
  document.getElementById("dark5").style.opacity=String(cl(sm(bs(5),bs(5)+.6,t)-sm(be(5)-.3,be(5),t))*0.72);
  const f=Math.max(0,...[1,2,3,4,5,6].map(i=>1-(t-bs(i))/.12));FL.style.opacity=String(cl(f)*.25);
}
const stagger=(n,k)=>bs(n)+.12+k*.13;

// Fan XI (B positions, gold filled) — appear staggered beat 1, stay throughout
PKEYS.forEach((k,i)=>{
  const[x,y]=LAY["B_"+k],p=k.replace(/\d/,"");
  const html=k==="GK"
    ?`<div class="nm fn" style="margin:0 0 5px">@${FANS[k]}</div><div class="slot f">${p}</div>`
    :`<div class="slot f">${p}</div><div class="nm fn">@${FANS[k]}</div>`;
  add(OVP,html,x,k==="GK"?y-10:y+20,stagger(1,i),END,{z:10,enter:"pop",keep:true,dim:t=>t>=bs(5)?0.18:1});
});

// Beat 1 — heading (centre of screen)
hd("ZAMIN FK","MURABBIY<br>ANIQLANDI!",bs(1),be(1),620,{cls2:"",enter:"stamp"});
// Big centre "?" pulsing — teases the reveal
add(OVP,`<div class="slot" style="width:120px;height:120px;line-height:108px;font-size:76px;border-width:7px">?</div>`,
  540,1120,bs(1)+.1,be(1),{z:12,enter:"pop",pulse:true,glow:true});
add(OV,`<div style="font-size:38px;letter-spacing:5px;color:#FFD23F;text-shadow:0 4px 16px #000">MURABBIY</div>`,
  540,1230,bs(1)+.15,be(1),{z:12,enter:"pop"});

// Beat 2 — COMMENT SCREENSHOT + coach card reveal
hd("TABRIKLAYMIZ","@hayitboyev.76",bs(2),be(2),200,{cls2:"w"});
add(OV,`<div class="cmt"><img src="assets/comment_winner.jpg"></div>`,
  540,840,bs(2)+.1,be(2),{z:22,enter:"pop"});
add(OV,`<div class="coach-card"><div class="cc-role">MURABBIY</div><div class="cc-name">@hayitboyev.76</div><div class="cc-likes">46 ♥ · eng ko'p layk</div></div>`,
  540,1560,bs(2)+.4,be(2),{z:23,enter:"pop",glow:true});

// Beat 3 — birinchi qaror
hd("MURABBIYNING","BIRINCHI QARORI",bs(3),be(3),540,{cls2:""});
add(OV,`<div style="font-size:88px;color:#FFD23F;text-shadow:0 8px 0 #0D2557,0 14px 36px rgba(0,0,0,.8);-webkit-text-stroke:7px #0D2557;paint-order:stroke fill">⚽ SINOV O'YINI!</div>`,
  540,1120,bs(3)+.35,be(3),{z:21,enter:"pop",pulse:true});

// Beat 4 — Sinov Jamoasi (TEAL — clearly different)
hd("SINOV","JAMOASI",bs(4),be(4),200,{cls2:"r"});
PKEYS.forEach((k,i)=>{
  const[x,y]=LAY["A_"+k],p=k.replace(/\d/,"");
  const html=k==="GK"
    ?`<div class="nm fn sv" style="margin:0 0 5px">?</div><div class="slot sv">${p}</div>`
    :`<div class="slot sv">${p}</div><div class="nm fn sv">?</div>`;
  add(OVP,html,x,k==="GK"?y-10:y+20,stagger(4,i),be(4),{z:11,enter:"pop",tglow:true});
});
add(OV,`<div class="cta-box"><small>IZOHGA YOZING 👇</small>POZITSIYA + ISMINGIZ</div>`,
  540,1710,bs(4)+.5,be(4),{z:22,enter:"pop"});

// Beat 5 — WHISPER (dark overlay, goat peeks from bottom-left, intimate)
// goat_chew.png 818×1343 → 380px wide, centre at (210,1690) = peeks from bottom
add(OVP,`<img src="assets/goat.png" style="width:380px;image-rendering:auto">`,
  210,1700,bs(5)+.05,be(5),{z:28,enter:"pop",rot:-8,pulse:true,ph:1.2});
add(OV,`<div class="whisper"><span class="wbig">🤭</span><br>Aytgancha...<br>eng faol o'yinchi<br><span class="wgreen">asosiy jamoaga<br>o'tishi mumkin</span> 😉</div>`,
  580,840,bs(5)+.2,be(5),{z:30,enter:"pop"});

// Beat 6 — OBUNA
hd("ZAMIN FK","O'YIN<br>BOSHLANMOQDA!",bs(6),END,560,{cls2:"",keep:true});
add(OV,`<div class="follow">OBUNA BO'LING</div>`,540,1760,bs(6)+.6,END,{z:22,enter:"pop",pulse:true,keep:true});
add(OV,`<img src="assets/crest.png" style="height:150px">`,130,1770,bs(6)+.6,END,{z:22,enter:"pop",keep:true});

// Background: ZOOM OUT (inverse of R16 push-in) — wider over time
const IM={};const nm=f=>f<DIVE?`build/top/d_${String(f).padStart(3,"0")}.jpg`:`build/top/top.jpg`;
async function bg(t){const f=Math.min(DIVE,Math.floor(t*FPS));const im=IM[f];if(im)document.getElementById("bg").src=im.src;if(im&&im.decode)await im.decode().catch(()=>0);}
window.renderAt=async t=>{
  await bg(t);
  // zoom OUT: start at 1.06, ease down to 1.0 — opposite of R16
  const z=1.06-.06*sm(0,END,t);
  document.getElementById("stage").style.transform=`scale(${z})`;
  frameOv(t);
};
window.ready=async()=>{await document.fonts.ready;await document.fonts.load("900 40px MZ");for(const f of[...Array(DIVE).keys(),DIVE]){const im=new Image();im.src=nm(f);await im.decode();IM[f]=im;}await Promise.all([...document.images].map(i=>i.decode?i.decode().catch(()=>0):0));return true;};
</script></body></html>
