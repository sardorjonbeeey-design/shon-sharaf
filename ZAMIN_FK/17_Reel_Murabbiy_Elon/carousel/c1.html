<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MZ;font-weight:900;src:url(../../web/city/assets/fonts/Montserrat_900Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;position:relative;font-family:MZ,sans-serif}

/* Vice City sunset sky */
#sky{position:absolute;inset:0;
  background:linear-gradient(to bottom,
    #2B0A5A 0%,#5A1890 18%,#9B3FC8 35%,#D96AA8 52%,#F0956A 68%,#F5C05A 80%,#4A7FC0 80%,#2A5A9A 100%)}
/* horizon glow */
#horiz{position:absolute;bottom:216px;left:0;right:0;height:60px;
  background:radial-gradient(ellipse 100% 100% at 50% 100%,rgba(255,160,80,.8),transparent)}
/* ground water strip */
#ground{position:absolute;bottom:0;left:0;right:0;height:220px;
  background:linear-gradient(to bottom,#3A6AAE,#1E3D6A)}
/* water shimmer */
#shimmer{position:absolute;bottom:60px;left:0;right:0;height:60px;
  background:repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,200,100,.12) 40px,rgba(255,200,100,.12) 80px)}
/* scan lines subtle */
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(0,0,0,.07) 4px,rgba(0,0,0,.07) 5px);z-index:40;pointer-events:none}
/* vignette edges */
#vign{position:absolute;inset:0;background:radial-gradient(ellipse 110% 110% at 50% 50%,transparent 40%,rgba(10,0,20,.55) 100%);z-index:3}

/* palm trees SVG layer */
#palms{position:absolute;bottom:200px;left:0;right:0;z-index:4}

/* characters */
#chars{position:absolute;bottom:200px;left:0;right:0;z-index:6;display:flex;justify-content:center;align-items:flex-end;gap:-40px}
.char-rustam{height:620px;filter:drop-shadow(-4px 0 20px rgba(255,100,180,.3));transform:scaleX(-1) translateX(60px)}
.char-goat{height:420px;filter:drop-shadow(4px 0 20px rgba(255,160,80,.3));transform:translateX(-30px)}

/* logo top */
#logo{position:absolute;top:38px;left:0;right:0;z-index:10;text-align:center}
.logo-brand{font-size:28px;letter-spacing:10px;color:rgba(255,255,255,.85);
  text-shadow:0 0 20px rgba(255,100,200,.8),2px 2px 0 rgba(0,0,0,.8);margin-bottom:4px}
.logo-main{font-style:italic;font-size:96px;line-height:.9;color:#fff;
  -webkit-text-stroke:6px #fff;paint-order:stroke fill;
  text-shadow:6px 6px 0 rgba(0,0,0,.8),0 0 40px rgba(200,100,255,.5);letter-spacing:-2px}
.logo-sub{font-size:34px;letter-spacing:9px;color:#FFD23F;
  text-shadow:0 0 16px rgba(255,210,63,.8),2px 2px 0 rgba(0,0,0,.7);margin-top:4px}

/* bottom */
#bottom{position:absolute;bottom:14px;left:0;right:0;z-index:10;
  display:flex;justify-content:space-between;padding:0 44px;align-items:center}
.b-left{font-size:22px;letter-spacing:6px;color:rgba(255,255,255,.5)}
.b-right{font-size:22px;letter-spacing:4px;color:rgba(255,255,255,.5)}
.swipe{font-size:20px;letter-spacing:3px;color:rgba(255,255,255,.4);
  text-align:center;position:absolute;bottom:50px;left:0;right:0;z-index:10}
</style></head><body>
<div id="sky"></div>
<div id="horiz"></div>
<div id="ground"></div>
<div id="shimmer"></div>

<!-- Palm trees -->
<div id="palms">
<svg width="1080" height="400" viewBox="0 0 1080 400" style="position:absolute;bottom:0">
  <!-- left palm -->
  <g opacity=".85">
    <line x1="80" y1="400" x2="110" y2="80" stroke="#1A0A30" stroke-width="14"/>
    <ellipse cx="110" cy="80" rx="80" ry="22" fill="#1A0A30" transform="rotate(-30 110 80)"/>
    <ellipse cx="110" cy="80" rx="70" ry="18" fill="#1A0A30" transform="rotate(20 110 80)"/>
    <ellipse cx="110" cy="80" rx="65" ry="17" fill="#1A0A30" transform="rotate(70 110 80)"/>
    <ellipse cx="110" cy="80" rx="60" ry="16" fill="#1A0A30" transform="rotate(-80 110 80)"/>
  </g>
  <!-- left palm 2 -->
  <g opacity=".6">
    <line x1="160" y1="400" x2="200" y2="130" stroke="#250F40" stroke-width="10"/>
    <ellipse cx="200" cy="130" rx="60" ry="17" fill="#250F40" transform="rotate(-25 200 130)"/>
    <ellipse cx="200" cy="130" rx="55" ry="15" fill="#250F40" transform="rotate(30 200 130)"/>
    <ellipse cx="200" cy="130" rx="50" ry="14" fill="#250F40" transform="rotate(80 200 130)"/>
  </g>
  <!-- right palm -->
  <g opacity=".85">
    <line x1="980" y1="400" x2="950" y2="90" stroke="#1A0A30" stroke-width="14"/>
    <ellipse cx="950" cy="90" rx="80" ry="22" fill="#1A0A30" transform="rotate(30 950 90)"/>
    <ellipse cx="950" cy="90" rx="70" ry="18" fill="#1A0A30" transform="rotate(-20 950 90)"/>
    <ellipse cx="950" cy="90" rx="65" ry="17" fill="#1A0A30" transform="rotate(-70 950 90)"/>
    <ellipse cx="950" cy="90" rx="60" ry="16" fill="#1A0A30" transform="rotate(80 950 90)"/>
  </g>
  <!-- right palm 2 -->
  <g opacity=".6">
    <line x1="910" y1="400" x2="870" y2="140" stroke="#250F40" stroke-width="10"/>
    <ellipse cx="870" cy="140" rx="60" ry="17" fill="#250F40" transform="rotate(25 870 140)"/>
    <ellipse cx="870" cy="140" rx="55" ry="15" fill="#250F40" transform="rotate(-30 870 140)"/>
    <ellipse cx="870" cy="140" rx="50" ry="14" fill="#250F40" transform="rotate(-80 870 140)"/>
  </g>
</svg>
</div>

<!-- Characters -->
<div id="chars">
  <img class="char-rustam" src="rustam.png">
  <img class="char-goat" src="goat_side.png">
</div>

<div id="vign"></div>
<div id="scan"></div>

<!-- Logo -->
<div id="logo">
  <div class="logo-brand">ZAMIN FK TAQDIM ETADI</div>
  <div class="logo-main">SINOV<br>O'YINI</div>
  <div class="logo-sub">ZAMIN FK · 2026</div>
</div>

<div class="swipe">O'NGGA SURING →</div>
<div id="bottom">
  <div class="b-left">@fk_zamin</div>
  <div class="b-right">1 / 4</div>
</div>
</body></html>
