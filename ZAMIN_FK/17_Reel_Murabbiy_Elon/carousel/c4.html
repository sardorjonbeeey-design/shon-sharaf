<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MZ;font-weight:900;src:url(../../web/city/assets/fonts/Montserrat_900Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#020810;font-family:MZ,sans-serif;overflow:hidden;position:relative}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.18) 3px,rgba(0,0,0,.18) 4px);pointer-events:none;z-index:50}
/* magenta glow top */
#glow{position:absolute;top:-60px;left:50%;transform:translateX(-50%);
  width:800px;height:400px;background:radial-gradient(ellipse,rgba(155,0,255,.35),transparent 70%)}
/* teal glow bottom */
#glow2{position:absolute;bottom:-60px;left:50%;transform:translateX(-50%);
  width:900px;height:350px;background:radial-gradient(ellipse,rgba(0,212,170,.2),transparent 70%)}
#scrim{position:absolute;inset:0;background:rgba(2,8,16,.5)}
#wrap{position:relative;z-index:10;width:1080px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:48px 60px 44px}

/* header */
.unlocked{font-size:26px;letter-spacing:8px;color:#9B00FF;text-shadow:0 0 20px #9B00FF;margin-bottom:0}
.unlocked-box{background:rgba(155,0,255,.12);border:3px solid #9B00FF;border-radius:12px;
  padding:10px 32px;text-align:center;box-shadow:0 0 30px rgba(155,0,255,.3)}

/* map pin area */
.map-wrap{position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center}
.pin{font-size:90px;filter:drop-shadow(0 0 24px rgba(255,45,120,.7));line-height:1}
/* grid lines */
.grid{position:absolute;inset:0;
  background:linear-gradient(rgba(0,212,170,.06) 1px,transparent 1px),
             linear-gradient(90deg,rgba(0,212,170,.06) 1px,transparent 1px);
  background-size:60px 60px}
.loc-name{font-size:70px;line-height:.95;text-align:center;color:#fff;
  text-shadow:4px 4px 0 #9B00FF,-2px -2px 0 rgba(255,45,120,.4),0 0 40px rgba(155,0,255,.4);
  -webkit-text-stroke:3px rgba(155,0,255,.6);paint-order:stroke fill}
.coords{font-size:22px;letter-spacing:4px;color:rgba(0,212,170,.7);text-align:center;margin-top:8px}

/* bottom CTA */
.bottom-block{width:100%;display:flex;flex-direction:column;gap:14px;align-items:center}
.cta-main{width:100%;background:linear-gradient(90deg,#9B00FF,#FF2D78);border-radius:20px;
  padding:18px 44px;text-align:center;font-size:46px;color:#fff;
  box-shadow:0 8px 40px rgba(155,0,255,.4),0 8px 40px rgba(255,45,120,.2)}
.cta-sub{font-size:24px;letter-spacing:4px;color:rgba(0,212,170,.7)}
.slide-info{display:flex;justify-content:space-between;width:100%;font-size:20px;color:rgba(255,255,255,.25);letter-spacing:3px}
</style></head><body>
<img id="bg" src="top.jpg">
<div id="glow"></div><div id="glow2"></div><div id="scrim"></div><div id="scan"></div>
<div id="wrap">
  <div class="unlocked-box">
    <div class="unlocked">★ NEW LOCATION UNLOCKED ★</div>
  </div>

  <div class="map-wrap">
    <div class="grid"></div>
    <div style="text-align:center;position:relative;z-index:2">
      <div class="pin">📍</div>
      <div class="loc-name">ZAMIN FK<br>MAYDON</div>
      <div class="coords">41.2995° N · 60.6166° E</div>
    </div>
  </div>

  <div class="bottom-block">
    <div class="cta-main">FUTBOLCHI BO'LISH ISTAYSIZMI?</div>
    <div class="cta-sub">Izohga POZITSIYA + ISMINGIZ 👇</div>
    <div class="slide-info">
      <span>@fk_zamin</span>
      <span>4 / 4</span>
    </div>
  </div>
</div>
</body></html>
