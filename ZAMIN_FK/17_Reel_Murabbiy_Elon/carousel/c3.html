<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MZ;font-weight:900;src:url(../../web/city/assets/fonts/Montserrat_900Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;position:relative;font-family:MZ,sans-serif;
  background:#1A0535}
/* deep purple border frame like box art */
#frame{position:absolute;inset:0;border:28px solid #3D1070;z-index:50;pointer-events:none;
  box-shadow:inset 0 0 60px rgba(60,0,100,.8)}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(0,0,0,.06) 4px,rgba(0,0,0,.06) 5px);z-index:45;pointer-events:none}

/* panel grid */
#grid{position:absolute;inset:28px;display:grid;
  grid-template-columns:1fr 1.6fr 1fr;
  grid-template-rows:1fr 1fr 1fr;
  gap:6px;z-index:5}

.panel{overflow:hidden;position:relative;background:#0D0020}
.panel img{width:100%;height:100%;object-fit:cover;object-position:center top}

/* sunset panel */
.p-sunset{background:linear-gradient(to bottom,#2B0A5A,#9B3FC8,#F0956A)}
/* teal panel */
.p-teal{background:linear-gradient(135deg,#003A3A,#007060)}
/* pink panel */
.p-pink{background:linear-gradient(135deg,#4A0030,#C0306A)}
/* blue panel */
.p-blue{background:linear-gradient(135deg,#001040,#1050A0)}
/* orange panel */
.p-orange{background:linear-gradient(135deg,#3A1000,#C06010)}
/* gold panel */
.p-gold{background:linear-gradient(135deg,#2A1A00,#806000)}

/* center panel spanning 1 col x 1 row but we'll make it overlay */
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:20;text-align:center;width:500px}
.c-brand{font-size:22px;letter-spacing:8px;color:rgba(255,255,255,.7);margin-bottom:4px}
.c-title{font-style:italic;font-size:88px;line-height:.88;color:#fff;
  -webkit-text-stroke:7px #fff;paint-order:stroke fill;
  text-shadow:5px 5px 0 rgba(0,0,0,.9),0 0 50px rgba(200,80,255,.6)}
.c-line{width:100%;height:5px;background:linear-gradient(90deg,transparent,#FF2D78,#9B00FF,transparent);margin:10px 0}
.c-sub{font-size:28px;letter-spacing:7px;color:#FFD23F;text-shadow:0 0 16px rgba(255,210,63,.7)}

/* panel content labels */
.p-label{position:absolute;bottom:10px;left:0;right:0;text-align:center;
  font-size:17px;letter-spacing:4px;color:rgba(255,255,255,.7);
  background:linear-gradient(to top,rgba(0,0,0,.8),transparent);padding:16px 4px 8px}

/* char in panels */
.p-char{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:85%;object-fit:contain;
  filter:drop-shadow(0 0 10px rgba(0,0,0,.8))}
.p-goat-s{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:70%;object-fit:contain}

.slide-num{position:absolute;bottom:36px;right:60px;z-index:60;
  font-size:18px;letter-spacing:4px;color:rgba(255,255,255,.3)}
</style></head><body>
<div id="grid">
  <!-- top row -->
  <div class="panel p-teal">
    <img src="goat_chew.png" class="p-char" style="height:95%;object-position:top">
    <div class="p-label">THE GOAT</div>
  </div>
  <div class="panel p-sunset">
    <!-- top center: empty for logo -->
  </div>
  <div class="panel p-blue">
    <img src="rustam.png" class="p-char">
    <div class="p-label">MURABBIY</div>
  </div>
  <!-- middle row -->
  <div class="panel p-pink">
    <img src="goat_side.png" class="p-goat-s" style="height:60%;bottom:20px">
    <div class="p-label">TEZLIK: 92</div>
  </div>
  <div class="panel" style="background:#0D0020"><!-- logo center --></div>
  <div class="panel p-orange">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:6px">
      <div style="font-size:60px;line-height:1">⚽</div>
      <div style="font-size:22px;letter-spacing:4px;color:#FFD23F">SINOV O'YINI</div>
    </div>
  </div>
  <!-- bottom row -->
  <div class="panel p-gold">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:6px;padding:10px">
      <div style="font-size:17px;letter-spacing:4px;color:rgba(255,255,255,.5);margin-bottom:4px">POZITSIYA</div>
      <div style="font-size:38px;color:#FFD23F;text-align:center">IZOHGA<br>YOZING</div>
    </div>
  </div>
  <div class="panel p-sunset"><!-- bottom center --></div>
  <div class="panel p-teal" style="background:linear-gradient(135deg,#001828,#004858)">
    <img src="crest.png" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:60%;filter:drop-shadow(0 0 20px rgba(0,212,170,.6))">
    <div class="p-label">FK ZAMIN</div>
  </div>
</div>

<!-- Center overlay logo -->
<div id="center">
  <div class="c-brand">ZAMIN FK</div>
  <div class="c-title">SINOV<br>O'YINI</div>
  <div class="c-line"></div>
  <div class="c-sub">2026</div>
</div>

<div id="frame"></div>
<div id="scan"></div>
<div class="slide-num">3 / 4</div>
</body></html>
