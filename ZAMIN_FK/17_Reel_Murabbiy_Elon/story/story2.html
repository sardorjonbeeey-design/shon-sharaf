<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MZ;font-weight:900;src:url(../../web/city/assets/fonts/Montserrat_900Black.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#020810;font-family:MZ,sans-serif;overflow:hidden;position:relative}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4}
#scrim{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 40%,rgba(2,8,16,.1),rgba(2,8,16,.75) 65%,rgba(2,8,16,.97))}
#tint{position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,60,80,.55),rgba(0,20,40,.4));mix-blend-mode:multiply}
#wrap{position:relative;z-index:10;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;padding:80px 60px 70px}
.crest{height:76px;margin-bottom:30px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.8))}
.label{font-size:34px;letter-spacing:7px;color:#00D4AA;text-shadow:0 0 20px rgba(0,212,170,.5);margin-bottom:10px}
.tag{font-size:30px;letter-spacing:5px;color:#FFD23F;text-shadow:0 0 16px rgba(255,210,63,.4);margin-bottom:28px}
h1{font-size:92px;line-height:.95;text-align:center;color:#FFD23F;
   text-shadow:0 8px 0 #0D2557,0 16px 40px rgba(0,0,0,.9);
   -webkit-text-stroke:6px #0D2557;paint-order:stroke fill;margin-bottom:36px}

/* coach card */
.coach-card{width:860px;background:rgba(0,20,20,.88);border:5px solid #FFD23F;border-radius:28px;
  padding:30px 40px;display:flex;align-items:center;gap:36px;margin-bottom:40px;
  box-shadow:0 0 50px rgba(255,210,63,.25),inset 0 0 30px rgba(255,210,63,.06)}
.coach-icon{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#FFD23F,#FF9800);
  display:flex;align-items:center;justify-content:center;font-size:56px;flex-shrink:0}
.coach-info{flex:1}
.coach-role{font-size:28px;letter-spacing:5px;color:#FFD23F;margin-bottom:6px}
.coach-name{font-size:52px;color:#fff;line-height:1}
.coach-badge{font-size:24px;color:#00D4AA;margin-top:6px;letter-spacing:2px}

/* divider */
.divider{width:860px;height:5px;background:linear-gradient(90deg,transparent,#00D4AA 20%,#00D4AA 80%,transparent);
  margin:0 0 36px;border-radius:5px;box-shadow:0 0 16px rgba(0,212,170,.5)}

/* decision box */
.decision{width:860px;background:rgba(0,30,50,.85);border:4px solid #00D4AA;border-radius:24px;
  padding:26px 40px;margin-bottom:36px;text-align:center;box-shadow:0 0 32px rgba(0,212,170,.2)}
.dec-label{font-size:28px;letter-spacing:5px;color:#00D4AA;margin-bottom:12px}
.dec-text{font-size:52px;color:#fff;line-height:1.1}

/* cta */
.cta-box{width:860px;background:rgba(0,20,20,.92);border:5px solid #FFD23F;border-radius:26px;
  padding:24px 44px;text-align:center;box-shadow:0 0 36px rgba(255,210,63,.2)}
.cta-small{font-size:30px;color:#9fb6ff;letter-spacing:3px;margin-bottom:8px}
.cta-big{font-size:56px;color:#fff}

.bottom{margin-top:auto;font-size:34px;color:#9fb6ff;letter-spacing:2px}
</style></head><body>
<img id="bg" src="top.jpg">
<div id="scrim"></div><div id="tint"></div>
<div id="wrap">
  <img class="crest" src="crest.png">
  <div class="label">ZAMIN FK</div>
  <div class="tag">MURABBIY TAYYOR</div>
  <h1>SINOV<br>O'YINI<br>BOSHLANADI</h1>

  <div class="coach-card">
    <div class="coach-icon">🏆</div>
    <div class="coach-info">
      <div class="coach-role">MURABBIY</div>
      <div class="coach-name">@hayitboyev.76</div>
      <div class="coach-badge">46 ♥ — eng ko'p layk</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="decision">
    <div class="dec-label">MURABBIYNING QARORI</div>
    <div class="dec-text">Sinov o'yini o'tkaziladi</div>
  </div>

  <div class="cta-box">
    <div class="cta-small">JAMOAGA KIRISH UCHUN 👇</div>
    <div class="cta-big">POZITSIYA + ISMINGIZ</div>
  </div>

  <div class="bottom">@fk_zamin &nbsp;•&nbsp; SINOV JAMOASI</div>
</div>
</body></html>
