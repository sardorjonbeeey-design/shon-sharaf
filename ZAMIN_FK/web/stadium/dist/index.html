function animateTeam(t) {
  const bek = H("bekzod"), az = H("aziz"), jas = H("jasur"), rus = H("rustam"), goat = H("echki");

  if (bek) { const u = (Math.sin(t * 0.7) + 1) / 2; moveTo(bek, 6 + u * 22, 6 + Math.sin(t * 0.35) * 8, Math.abs(Math.sin(t * 9)) * 0.18); }

  // ball: passed back and forth between Aziz and Bekzod on a 1.6 s cycle, arcing over the grass
  if (az && bek) {
    const cyc = t % 3.2, toB = cyc < 1.6, k = (cyc % 1.6) / 1.6;
    const A = toB ? az.position : bek.position, B = toB ? bek.position : az.position;
    ball.position.set(A.x + (B.x - A.x) * k, 0.22 + Math.sin(k * Math.PI) * 2.2, A.z + (B.z - A.z) * k + 0.6);

    moveTo(jas, -50, dz + (dive ? 2.5 : 0), dive ? 0.4 : Math.abs(Math.sin(t * 5)) * 0.08);

// ---------- day / night by Uzbekistan time (UTC+5); ?time=night|day|<hour> to preview ----------
const DN = (() => {
  const q = new URLSearchParams(location.search).get("time");
  const hourNow = () => { if (q === "night") return 22.5; if (q === "day") return 13; if (q !== null && q !== "" && !isNaN(+q)) return +q;
    const d = new Date(); return (d.getUTCHours() + 5) % 24 + d.getUTCMinutes() / 60; };
  const SUNRISE = 6.9, SUNSET = 17.0;                    // Tashkent, late autumn
  const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const C = c => new THREE.Color(c);
  const SKY = { day: [C(0xcfe6ff), C(0x7fb6f0), C(0x3b7fd6)], dusk: [C(0xf7a46b), C(0x5b5a9a), C(0x1a2252)], night: [C(0x1b2550), C(0x0b1430), C(0x02050f)] };
  const FOGC = { day: C(0xbfd2e6), dusk: C(0x8d86a8), night: C(0x0b1430) };
  const GLOW = new Set([0xffcf6b, 0xffd98a, 0xfff1c4, 0xffd36b, 0xfff6d0, 0xfff6dc]);
  const DAYGLASS = C(0x8aa4bd), glow = [], seen = new Set();
  let composer = null, bloom = null, lastCollect = 0, state = null;
  const pitchLight = new THREE.PointLight(0xfff4dc, 0, 190, 1.4); pitchLight.position.set(0, 55, 0); scene.add(pitchLight);   // floodlights at night
  function collect() {
    scene.traverse(o => { if (!o.material) return; (Array.isArray(o.material) ? o.material : [o.material]).forEach(mt => {
      if (mt && mt.isMeshBasicMaterial && !mt.map && !seen.has(mt) && GLOW.has(mt.color.getHex())) { seen.add(mt); glow.push({ mt, night: mt.color.clone() }); } }); });
  }
  function setupBloom() {
    if (composer || !THREE.EffectComposer || !THREE.UnrealBloomPass) return;
    try {
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));
      bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.9, 0.55, 0.72);
      composer.addPass(bloom);

    } catch (e) { composer = null; }
  }
  function mix3(a, b, t) { return a.clone().lerp(b, t); }
  function update(force) {
    const h = hourNow();
    const day = sm(SUNRISE - .6, SUNRISE + .6, h) * (1 - sm(SUNSET - .6, SUNSET + .6, h));
    const dusk = Math.max(0, 1 - Math.min(Math.abs(h - SUNRISE), Math.abs(h - SUNSET)) / 1.1);
    const key = (day * 50 | 0) + ":" + (dusk * 50 | 0);
    if (!force && key === state) return; state = key;
    const base = i => mix3(SKY.night[i], SKY.day[i], day).lerp(SKY.dusk[i], dusk * .75);
    sky.material.uniforms.cA.value.copy(base(0)); sky.material.uniforms.cB.value.copy(base(1)); sky.material.uniforms.cC.value.copy(base(2));
    const fogc = mix3(FOGC.night, FOGC.day, day).lerp(FOGC.dusk, dusk * .6);
    scene.fog.color.copy(fogc); scene.background = fogc.clone();
    hemi.intensity = .3 + .45 * day; hemi.color.copy(mix3(C(0x6f86c9), C(0xdfeaff), day));
    hemi.groundColor.copy(mix3(C(0x101820), C(0x3a5a2a), day));
    sun.intensity = .12 + .62 * day; pitchLight.intensity = (1 - day) * 1.6; sun.color.copy(mix3(C(0x9fb4ff), C(0xfff0d8), day).lerp(C(0xffa060), dusk * .7));
    const ang = ((h - SUNRISE) / (SUNSET - SUNRISE)) * Math.PI;            // sun arc east -> west; moonlight from above at night
    sun.position.set(Math.cos(ang) * -300, day > .05 ? Math.max(40, Math.sin(ang) * 400) : 260, 120);
    for (const g of glow) g.mt.color.copy(mix3(g.night, DAYGLASS, day * .85));

    init() { setupBloom(); collect(); update(true); },
    render() { if (composer) composer.render(); else renderer.render(scene, camera); },
    resize() { if (composer) composer.setSize(innerWidth, innerHeight); },
  };
})();

    const d = await post("/api/job/start", { job: id }); applyMe(d);
    if (!d.shift) return;
    sheets.forEach(s => s.style.display = "none");
    W.job = d.catalog.jobs.find(j => j.id === d.shift.job); W.shift = d.shift; W.served = new Set(d.shift.served); W.earned = d.shift.earned; W.n = d.shift.served.length;
    document.getElementById("wPlace").textContent = W.job.place; document.getElementById("wRole").textContent = T[L].wRole;
    const menu = document.getElementById("menu"); menu.innerHTML = "";
    W.job.menu.forEach((m, i) => { const b = document.createElement("button"); b.textContent = m; b.onclick = () => serve(i); menu.appendChild(b); });
    document.getElementById("wEnd").classList.remove("on"); W.el.classList.add("on");
    clearInterval(W.timer); W.timer = setInterval(drawWork, 250); drawWork();
  } catch (e) { say(e.message === "tired" ? T[L].tired : e.message === "no home" ? T[L].needHome : T[L].err); }
}

    if (!W.served.has(k) && t - c.at <= W.job.patienceSec) out.push(c); }
  return out;
}
function drawWork() {
  const t = workNow(), left = Math.max(0, W.job.shiftSec - t);
  document.getElementById("wTime").textContent = `${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, "0")}`;
  document.getElementById("wEarn").textContent = W.earned;
  if (left <= 0) return endWork();
  const q = waiting(), el = document.getElementById("queue");
  document.getElementById("wHint").textContent = q.length ? T[L].wHint : T[L].wWait;
  el.innerHTML = q.slice(0, 4).map((c, i) => { const p = Math.max(0, 1 - (t - c.at) / W.job.patienceSec), m = W.job.menu[c.order].split(" ");
    return `<div class="cust${i ? "" : " front"}"><div class="bub"><span class="e">${m[0]}</span>${m.slice(1).join(" ")}</div><div class="face">${FACES[c.face]}</div><div class="pat"><i style="width:${p * 100}%;background:${p > .5 ? "#3fb950" : p > .25 ? "#f0a030" : "#d94848"}"></i></div></div>`; }).join("");
}

  if (nh) { const m = HOMES.find(h => h.id === myId); if (m) setTimeout(() => say(T[L].homeOk + " " + m.nick + " 🎟"), 1200); }
}
// live city: new homes appear without reload; first load may have missed a sleeping backend
setInterval(async () => { const s = await getState(15000); if (s) { const had = !!STATE.miniapp; STATE = s; layoutHQ(); const sig = l => l.map(h => h.id + ":" + h.level + ":" + h.color + ":" + h.car).join(); if (sig(s.homes) !== sig(HOMES)) { layoutHomes(s.homes); updateHomeUi(); } if (!had) updateCta(); } }, 30000);
</script>
