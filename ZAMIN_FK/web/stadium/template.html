// ---------- seats: rounded-rectangle rings around the pitch ----------
const PW = 105, PH = 68, SEAT_W = 0.62, ROW_D = 0.95, ROW_H = 0.48;
function rrLen(a, b, r) { return 4 * (a - r) + 4 * (b - r) + 2 * Math.PI * r; }
function rrPoint(a, b, r, s) {          // s from the middle of the main (south, z=+b) straight, clockwise
  const sx = 2 * (a - r), sz = 2 * (b - r), q = Math.PI * r / 2;
  const segs = [[sx / 2, "S1"], [q, "C1"], [sz, "E"], [q, "C2"], [sx, "N"], [q, "C3"], [sz, "W"], [q, "C4"], [sx / 2, "S2"]];

        case "C2": { const t = p / r; return [a - r + r * Math.cos(t), -(b - r) - r * Math.sin(t), Math.cos(t), -Math.sin(t)]; }
        case "N": return [a - r - p, -b, 0, -1];
        case "C3": { const t = p / r; return [-(a - r) - r * Math.sin(t), -(b - r) - r * Math.cos(t), -Math.sin(t), -Math.cos(t)]; }

const need = Math.max(FANS.length, 600);
const seats = [], standIdx = new Map();
const MIN_RINGS = FANS.length < 300 ? 12 : 24, MAX_MEMBER_RING = MEMBERS.reduce((m, x) => Math.max(m, x.ring), -1);

    const dist = Math.min(s, len - s);

  restIdx = IG_REST.map(nick => { let k = hash(nick) % pool.length; while (used.has(k)) k = (k + 7) % pool.length; used.add(k); return pool[k]; });

{

const FACES = ["👨", "👩", "🧔", "👵", "👴", "👦", "👧", "👨‍🦱", "👩‍🦰", "🧕", "👨‍🦳", "👱‍♀️"];
const h32 = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };   // same as server
const custOf = (job, seed, k) => { const r = h32(`${seed}:${k}`); return { k, at: k * job.everySec + (r % (job.jitterSec + 1)), order: (r >>> 8) % job.menu.length, face: (r >>> 16) % 12 }; };
const W = { el: document.getElementById("work"), timer: null, busy: false, job: null, shift: null, served: new Set(), earned: 0, n: 0 };
async function startJob(id) {
  try {
    const d = await post("/api/job/start", { job: id }); applyMe(d);
    if (!d.shift) return;
    sheets.forEach(s => s.style.display = "none");
    W.job = d.catalog.jobs.find(j => j.id === d.shift.job); W.shift = d.shift; W.served = new Set(d.shift.served); W.earned = d.shift.earned; W.n = d.shift.served.length;
    document.getElementById("wPlace").textContent = W.job.place; document.getElementById("wRole").textContent = T[L].wRole;
    const menu = document.getElementById("menu"); menu.innerHTML = "";
    W.job.menu.forEach((m, i) => { const b = document.createElement("button"); b.textContent = m; b.onclick = () => serve(i); menu.appendChild(b); });
    document.getElementById("wEnd").classList.remove("on"); W.el.classList.add("on");
    clearInterval(W.timer); W.timer = setInterval(drawWork, 250); drawWork();
  } catch (e) { say(e.message === "tired" ? T[L].tired : e.message === "no home" ? T[L].needHome : T[L].err); }
}
function workNow() { return (Date.now() + SKEW - W.shift.started) / 1000; }
function waiting() {
  const t = workNow(), out = [];
  for (let k = 0; ; k++) { const c = custOf(W.job, W.shift.seed, k); if (c.at > t || c.at > W.job.shiftSec) break;
    if (!W.served.has(k) && t - c.at <= W.job.patienceSec) out.push(c); }
  return out;
}
function drawWork() {
  const t = workNow(), left = Math.max(0, W.job.shiftSec - t);
  document.getElementById("wTime").textContent = `${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, "0")}`;
  document.getElementById("wEarn").textContent = W.earned;
  if (left <= 0) return endWork();
  const q = waiting(), el = document.getElementById("queue");
  document.getElementById("wHint").textContent = q.length ? T[L].wHint : T[L].wWait;
  el.innerHTML = q.slice(0, 4).map((c, i) => { const p = Math.max(0, 1 - (t - c.at) / W.job.patienceSec), m = W.job.menu[c.order].split(" ");
    return `<div class="cust${i ? "" : " front"}"><div class="bub"><span class="e">${m[0]}</span>${m.slice(1).join(" ")}</div><div class="face">${FACES[c.face]}</div><div class="pat"><i style="width:${p * 100}%;background:${p > .5 ? "#3fb950" : p > .25 ? "#f0a030" : "#d94848"}"></i></div></div>`; }).join("");
}
function float(txt, color) { const f = document.getElementById("wFloat"); f.textContent = txt; f.style.color = color; f.classList.remove("show"); void f.offsetWidth; f.classList.add("show"); }
async function serve(item) {
  if (W.busy) return; const front = waiting()[0]; if (!front) return;
  W.busy = true;
  try {
    const d = await post("/api/job/serve", { shift: W.shift.id, k: front.k, item }); applyMe(d);
    W.served = new Set(d.shift ? d.shift.served : [...W.served, front.k]);
    if (d.wrong) { float(T[L].wWrong, "#ff6b6b"); haptic("bad"); } else { W.earned += d.got; W.n++; float(`+${d.got} 🪙`, "#FFD23F"); haptic("tap"); }
  } catch (e) {
    if (e.message === "left") { W.served.add(front.k); float(T[L].wLeft, "#ff6b6b"); }
    else if (e.message === "no shift") return endWork();
  } finally { setTimeout(() => W.busy = false, 400); drawWork(); }
}
function endWork() {
  clearInterval(W.timer);
  document.getElementById("wSum").innerHTML = T[L].wSum(W.n, W.earned); document.getElementById("wEnd").classList.add("on"); fetchMe();
}

[["uz", "O‘zbekcha"], ["ru", "Русский"], ["en", "English"]].forEach(([k, n]) => {
  const b = document.createElement("button"); b.textContent = n; b.onclick = () => setLang(k); b.dataset.k = k; langsEl.appendChild(b);
});
function setLang(k) {
  L = k; try { localStorage.setItem("zfk_lang", k); } catch (e) {}
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[L][el.dataset.t]);
  document.getElementById("q").placeholder = T[L].ph;
  document.getElementById("igNick").placeholder = T[L].igPh;
  document.getElementById("jobNote").placeholder = T[L].jobPh;
  langsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === L));
  document.getElementById("demo").style.display = DEMO ? "block" : "none";
  buildPickers();
}
setLang(L);
if (MAP) { const pl = document.getElementById("place"); pl.textContent = "📍 " + MAP.name + (MAP.rot ? " · © OpenStreetMap" : ""); pl.classList.add("on"); }
setMode(MODE, false);
updateCta();

// counter roll-up
const nEl = document.getElementById("n");
const t0 = performance.now();
function fmt(v) { return Math.round(v).toLocaleString("fr-FR").replace(/ | /g, " "); }

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); DN.resize(); }
addEventListener("resize", resize); resize();
let prev = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (fly) {
    fly.t = (now - fly.start) / 1000 / fly.dur; const p = fly.t >= 1 ? 1 : 1 - Math.pow(1 - fly.t, 3);
    camera.position.lerpVectors(fly.p0, fly.p1, p); controls.target.lerpVectors(fly.t0, fly.t1, p);
    if (fly.t >= 1) fly = null;
  }
  { // keep the camera over the town
    const t = controls.target, lim = WORLD + 60, cx = Math.max(-lim, Math.min(lim, t.x)) - t.x, cz = Math.max(-lim, Math.min(lim, t.z)) - t.z;
    if (cx || cz) { t.x += cx; t.z += cz; camera.position.x += cx; camera.position.z += cz; }
  }
  controls.update();
  sky.position.copy(camera.position);
  try { animateTeam(now / 1000); } catch (e) { console.error("animateTeam failed:", e); }
  try { cityTick(dt); walkersTick(dt, now / 1000); } catch (e) { console.error("city/walkers tick failed:", e); }
  nEl.textContent = fmt(fans * Math.min(1, (now - t0) / 1600));
  try { DN.tick(now); DN.render(); } catch (e) { console.error("DN tick/render failed:", e); }
  try { updateLabels(now); } catch (e) { console.error("updateLabels failed:", e); }
  requestAnimationFrame(loop);
}
try { DN.init(); } catch (e) { console.error("DN.init failed:", e); }
requestAnimationFrame(loop);
if (new URLSearchParams(location.search).has("debug")) window.__zfk = { scene, camera, controls, flyTo, walkers: () => WALKERS, kenney: () => KENNEY, layoutHomes, homes: () => HOMES, selectLot, plots: () => plots, built: () => BUILT, hq: () => HQ_OBJS, kz: () => ({ cars: CAR_CLONES.length, trees: TREE_SPOTS && TREE_SPOTS.pop.length + TREE_SPOTS.round.length, kenney: Object.keys(KENNEY) }) };

// after a seat claim: fly to it; in the Mini App: fly to my home
{
  let go = null, gs = null; try { go = sessionStorage.getItem("zfk_goto"); sessionStorage.removeItem("zfk_goto"); gs = sessionStorage.getItem("zfk_seat"); sessionStorage.removeItem("zfk_seat"); } catch (e) {}
  if (gs) { const st = seatByNo(+gs); if (st && st.fan) setTimeout(() => goTo(st), 700); }
  const st = go && byNick.get(norm(go));
  if (st) setTimeout(() => { goTo(st); say(T[L].seatOk(T[L].seat(st))); }, 700);
  else if (MODE === "city") { const m = HOMES.find(h => h.id === myId); if (m) setTimeout(() => goHome(m), 900); }
  let nh = null; try { nh = sessionStorage.getItem("zfk_newhome"); sessionStorage.removeItem("zfk_newhome"); } catch (e) {}
  if (nh) { const m = HOMES.find(h => h.id === myId); if (m) setTimeout(() => say(T[L].homeOk + " " + m.nick + " 🎟"), 1200); }
}
// live city: new homes appear without reload; first load may have missed a sleeping backend
setInterval(async () => { const s = await getState(15000); if (s) { const had = !!STATE.miniapp; STATE = s; layoutHQ(); const sig = l => l.map(h => h.id + ":" + h.level + ":" + h.color + ":" + h.car).join(); if (sig(s.homes) !== sig(HOMES)) { layoutHomes(s.homes); updateHomeUi(); } if (!had) updateCta(); } }, 30000);
</script>
