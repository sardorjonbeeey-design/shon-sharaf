// ---------- live data from the city backend (Neon). Stadium never waits long for it. ----------
async function getState(ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(API + "/api/state", { cache: "no-store", signal: ctl.signal }); if (!r.ok) throw 0; return await r.json(); }
  catch (e) { return null; } finally { clearTimeout(t); }
}
const norm = s => String(s || "").trim().toLowerCase().replace(/^@/, "");
// real town from OpenStreetMap; ?map=0 (or a missing file) falls back to the generated town
const MAP_FILE = __MAP__;
async function getMap() {
  if (!MAP_FILE || new URLSearchParams(location.search).get("map") === "0") return null;
  try { const r = await fetch(MAP_FILE); return r.ok ? await r.json() : null; } catch (e) { return null; }
}
const [STATE0, MAP] = await Promise.all([getState(MODE === "city" ? 8000 : 2500), getMap()]);
let STATE = STATE0 || { seats: [], homes: [], miniapp: "" };
const FAN_META = new Map();       // nick -> { tg: telegram username or null }
const FANS = IG_FANS.slice();
{
  const have = new Set(FANS.map(norm));
  for (const s of STATE.seats || []) {            // Telegram seat claims: linked IG nick keeps its seat, otherwise a new seat
    const ig = norm(s.instagram), nick = ig || norm(s.nick);
    if (!nick) continue;
    if (!have.has(nick)) { FANS.push(nick); have.add(nick); }
    FAN_META.set(nick, { tg: s.tg_username || null, ig: !!ig });
  }
}

// ---------- seats: rounded-rectangle rings around the pitch ----------

function rrLen(a, b, r) { return 4 * (a - r) + 4 * (b - r) + 2 * Math.PI * r; }
function rrPoint(a, b, r, s) {          // s from the middle of the main (south, z=+b) straight, clockwise
  const sx = 2 * (a - r), sz = 2 * (b - r), q = Math.PI * r / 2;
  const segs = [[sx / 2, "S1"], [q, "C1"], [sz, "E"], [q, "C2"], [sx, "N"], [q, "C3"], [sz, "W"], [q, "C4"], [sx / 2, "S2"]];
  for (const [len, k] of segs) {
    if (s <= len) {
      const p = s;
      switch (k) {

updateCta();

// counter roll-up
const nEl = document.getElementById("n");
const t0 = performance.now();
function fmt(v) { return Math.round(v).toLocaleString("fr-FR").replace(/ | /g, " "); }

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
let prev = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (fly) {
    fly.t = (now - fly.start) / 1000 / fly.dur; const p = fly.t >= 1 ? 1 : 1 - Math.pow(1 - fly.t, 3);
    camera.position.lerpVectors(fly.p0, fly.p1, p); controls.target.lerpVectors(fly.t0, fly.t1, p);
    if (fly.t >= 1) fly = null;
  }
  { // keep the camera over the town
    const t = controls.target, lim = WORLD + 60, cx = Math.max(-lim, Math.min(lim, t.x)) - t.x, cz = Math.max(-lim, Math.min(lim, t.z)) - t.z;
    if (cx || cz) { t.x += cx; t.z += cz; camera.position.x += cx; camera.position.z += cz; }
  }
  controls.update();
  sky.position.copy(camera.position);
  animateTeam(now / 1000);
  cityTick(dt);
  nEl.textContent = fmt(fans * Math.min(1, (now - t0) / 1600));
  renderer.render(scene, camera);
  updateLabels(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (new URLSearchParams(location.search).has("debug")) window.__zfk = { scene, camera, controls, flyTo, selectLot, plots: () => plots, built: () => BUILT };

// after a seat claim: fly to it; in the Mini App: fly to my home
{
  let go = null; try { go = sessionStorage.getItem("zfk_goto"); sessionStorage.removeItem("zfk_goto"); } catch (e) {}
  const st = go && byNick.get(norm(go));
  if (st) setTimeout(() => { goTo(st); say(T[L].seatOk(T[L].seat(st))); }, 700);
  else if (MODE === "city") { const m = HOMES.find(h => h.id === myId); if (m) setTimeout(() => goHome(m), 900); }
  let nh = null; try { nh = sessionStorage.getItem("zfk_newhome"); sessionStorage.removeItem("zfk_newhome"); } catch (e) {}
  if (nh) { const m = HOMES.find(h => h.id === myId); if (m) setTimeout(() => say(T[L].homeOk + " " + m.nick + " 🎟"), 1200); }
}
// live city: new homes appear without reload; first load may have missed a sleeping backend
setInterval(async () => { const s = await getState(15000); if (s) { const had = !!STATE.miniapp; STATE = s; const sig = l => l.map(h => h.id + ":" + h.level + ":" + h.color).join(); if (sig(s.homes) !== sig(HOMES)) { layoutHomes(s.homes); updateHomeUi(); } if (!had) updateCta(); } }, 30000);
</script>
