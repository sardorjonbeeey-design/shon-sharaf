<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">
// One project, two entrances:
//   Instagram / web link  -> camera opens on the stadium (city visible around it)
//   Telegram Mini App      -> camera opens on the whole city; fans take a seat, build a home, apply for work
//   ?view=city | ?view=stadium overrides either.
const TG = (() => { try { const tg = window.Telegram && Telegram.WebApp; return tg && tg.initData ? tg : null; } catch (e) { return null; } })();
if (TG) { try { TG.ready(); TG.expand(); TG.setHeaderColor && TG.setHeaderColor('#0D2557'); } catch (e) {} }
const TG_USER = TG && TG.initDataUnsafe && TG.initDataUnsafe.user ? TG.initDataUnsafe.user : null;
const qsView = new URLSearchParams(location.search).get("view");
let MODE = qsView === "city" || qsView === "stadium" ? qsView : (TG ? "city" : "stadium");
document.body.classList.toggle("city", MODE === "city");

const IG_FANS = __FANS__;         // Instagram followers, follow order: earliest first
const HEROES = __HEROES__;        // [{key,name,role:{uz,ru,en},img,x,z,h}]
const DEMO = __DEMO__;
const API_ORIGIN = __API__;       // city backend (Neon); same origin when served by it
const API = (location.origin === API_ORIGIN || /^(localhost|127\.)/.test(location.hostname)) ? "" : API_ORIGIN;
const T = {
  uz:{title:"ZAMIN FK", fans:"MUXLISLAR", pop:"AHOLI", rule:"1 obunachi = 1 o‘rindiq", find:"Topish", ph:"Nik bo‘yicha qidirish", demo:"Namuna ro‘yxat", nf:"Bu nik hali stadionda ham, shaharda ham yo‘q. Obuna bo‘ling — o‘rningiz tayyor bo‘ladi!", seat:(s)=>`Sektor ${s.sec} · Qator ${s.row} · O‘rin ${s.no}`,
      cta:"🏙 Zamin FK shahrini ochish", bSeat:"🎟 O‘rindiq", bHome:"🏠 Uy qurish", bJob:"💼 Ish",
      seatH:"Stadionda o‘rningiz", seatP:"Telegram orqali o‘rindiq oling. Instagram nikingizni yozsangiz, o‘sha o‘rin sizniki bo‘ladi.", seatGo:"O‘rindiq olish", igPh:"Instagram nik (ixtiyoriy)",
      homeH:"Uyingizni tanlang", homeGo:"Qurish", jobH:"Shaharda ishlash", jobP:"Zamin FK shahrini birga quramiz. Yo‘nalishni tanlang va o‘zingiz haqingizda yozing.", jobGo:"Ariza yuborish", jobPh:"Tajribangiz, portfolio havolasi…",
      roles:["Quruvchi (3D)","Dizayner","Video montaj","SMM","Dasturchi","Boshqa"], styles:["Kottej","Katta kottej","Shisha bino","Pog‘onali bino","O‘zbek hovli"], plaza:"☕ Choyxona",
      needTg:"Buning uchun ilovani Telegram orqali oching.", seatOk:(s)=>`O‘rningiz tayyor! ${s}`, homeOk:"Uyingiz tayyor! 🏠", jobOk:"Ariza qabul qilindi! Siz bilan bog‘lanamiz.", err:"Saqlab bo‘lmadi, qayta urinib ko‘ring.", homeOf:(n,i)=>`${n} — ${i}-uy`, soon:"Kelajakda: ",
      lots:["Mashg‘ulot maydoni","Hovuz","Xodimlar binosi","Media markaz","Klub ofisi","🅿 Avtoturargoh"], stad:"ZAMIN FK STADIONI"},
  ru:{title:"ZAMIN FK", fans:"БОЛЕЛЬЩИКИ", pop:"ЖИТЕЛИ", rule:"1 подписчик = 1 место", find:"Найти", ph:"Поиск по нику", demo:"Демо-список", nf:"Этого ника пока нет ни на стадионе, ни в городе. Подпишитесь — место будет готово!", seat:(s)=>`Сектор ${s.sec} · Ряд ${s.row} · Место ${s.no}`,
      cta:"🏙 Открыть город Zamin FK", bSeat:"🎟 Место", bHome:"🏠 Дом", bJob:"💼 Работа",
      seatH:"Ваше место на стадионе", seatP:"Получите место через Telegram. Укажите ник в Instagram — это место станет вашим.", seatGo:"Получить место", igPh:"Ник в Instagram (необязательно)",
      homeH:"Выберите дом", homeGo:"Построить", jobH:"Работа в городе", jobP:"Строим город Zamin FK вместе. Выберите направление и расскажите о себе.", jobGo:"Отправить заявку", jobPh:"Опыт, ссылка на портфолио…",
      roles:["Строитель (3D)","Дизайнер","Видеомонтаж","SMM","Программист","Другое"], styles:["Коттедж","Большой коттедж","Стеклянная башня","Ступенчатая башня","Узбекский двор"], plaza:"☕ Чайхана",
      needTg:"Для этого откройте приложение через Telegram.", seatOk:(s)=>`Ваше место готово! ${s}`, homeOk:"Ваш дом готов! 🏠", jobOk:"Заявка принята! Мы свяжемся с вами.", err:"Не удалось сохранить, попробуйте ещё раз.", homeOf:(n,i)=>`${n} — дом №${i}`, soon:"Скоро: ",
      lots:["Тренировочное поле","Бассейн","Корпус персонала","Медиацентр","Офис клуба","🅿 Парковка"], stad:"СТАДИОН ZAMIN FK"},
  en:{title:"ZAMIN FK", fans:"FANS", pop:"RESIDENTS", rule:"1 follower = 1 seat", find:"Find", ph:"Search by nick", demo:"Demo list", nf:"This nick isn’t in the stadium or the city yet. Follow us — your seat will be ready!", seat:(s)=>`Sector ${s.sec} · Row ${s.row} · Seat ${s.no}`,
      cta:"🏙 Open Zamin FK city", bSeat:"🎟 Seat", bHome:"🏠 Home", bJob:"💼 Work",
      seatH:"Your seat in the stadium", seatP:"Claim a seat via Telegram. Add your Instagram nick and that seat becomes yours.", seatGo:"Take my seat", igPh:"Instagram nick (optional)",
      homeH:"Choose your home", homeGo:"Build", jobH:"Work in the city", jobP:"Let’s build Zamin FK city together. Pick a field and tell us about yourself.", jobGo:"Send application", jobPh:"Experience, portfolio link…",
      roles:["Builder (3D)","Designer","Video editor","SMM","Developer","Other"], styles:["Cottage","Big cottage","Glass tower","Stepped tower","Uzbek courtyard"], plaza:"☕ Teahouse",
      needTg:"Open the app in Telegram for this.", seatOk:(s)=>`Your seat is ready! ${s}`, homeOk:"Your home is ready! 🏠", jobOk:"Application received! We’ll contact you.", err:"Couldn’t save, please try again.", homeOf:(n,i)=>`${n} — home #${i}`, soon:"Coming: ",
      lots:["Training pitch","Pool","Staff building","Media centre","Club office","🅿 Parking"], stad:"ZAMIN FK STADIUM"},
};
let L = "uz";
try { L = localStorage.getItem("zfk_lang") || "uz"; } catch (e) {}

// ---------- live data from the city backend (Neon). Stadium never waits long for it. ----------
async function getState(ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(API + "/api/state", { cache: "no-store", signal: ctl.signal }); if (!r.ok) throw 0; return await r.json(); }
  catch (e) { return null; } finally { clearTimeout(t); }
}
const norm = s => String(s || "").trim().toLowerCase().replace(/^@/, "");
let STATE = await getState(MODE === "city" ? 8000 : 2500) || { seats: [], homes: [], miniapp: "" };
const FAN_META = new Map();       // nick -> { tg: telegram username or null }
const FANS = IG_FANS.slice();
{
  const have = new Set(FANS.map(norm));
  for (const s of STATE.seats || []) {            // Telegram seat claims: linked IG nick keeps its seat, otherwise a new seat
    const ig = norm(s.instagram), nick = ig || norm(s.nick);
    if (!nick) continue;
    if (!have.has(nick)) { FANS.push(nick); have.add(nick); }
    FAN_META.set(nick, { tg: s.tg_username || null, ig: !!ig });
  }
}

// ---------- seats: rounded-rectangle rings around the pitch ----------
const PW = 105, PH = 68, SEAT_W = 0.62, ROW_D = 0.95, ROW_H = 0.48;
function rrLen(a, b, r) { return 4 * (a - r) + 4 * (b - r) + 2 * Math.PI * r; }
function rrPoint(a, b, r, s) {          // s from the middle of the main (south, z=+b) straight, clockwise
  const sx = 2 * (a - r), sz = 2 * (b - r), q = Math.PI * r / 2;
  const segs = [[sx / 2, "S1"], [q, "C1"], [sz, "E"], [q, "C2"], [sx, "N"], [q, "C3"], [sz, "W"], [q, "C4"], [sx / 2, "S2"]];
  for (const [len, k] of segs) {
    if (s <= len) {
      const p = s;
      switch (k) {
        case "S1": return [p, b, 0, 1];
        case "C1": { const t = p / r; return [a - r + r * Math.sin(t), b - r + r * Math.cos(t), Math.sin(t), Math.cos(t)]; }
        case "E": return [a, b - r - p, 1, 0];
        case "C2": { const t = p / r; return [a - r + r * Math.cos(t), -(b - r) - r * Math.sin(t), Math.cos(t), -Math.sin(t)]; }
        case "N": return [a - r - p, -b, 0, -1];
        case "C3": { const t = p / r; return [-(a - r) - r * Math.sin(t), -(b - r) - r * Math.cos(t), -Math.sin(t), -Math.cos(t)]; }
        case "W": return [-a, -(b - r) + p, -1, 0];
        case "C4": { const t = p / r; return [-(a - r) - r * Math.cos(t), (b - r) + r * Math.sin(t), -Math.cos(t), Math.sin(t)]; }
        case "S2": return [-(a - r) + p, b, 0, 1];
      }
    }
    s -= len;
  }
  return [0, b, 0, 1];
}
const need = Math.max(FANS.length, 600);
const seats = [];
const MIN_RINGS = FANS.length < 300 ? 12 : 24;
for (let ring = 0; ring < MIN_RINGS || seats.length < need * 1.15 + 200; ring++) {
  const a = PW / 2 + 9 + ring * ROW_D, b = PH / 2 + 9 + ring * ROW_D, r = 10 + ring * ROW_D;
  const len = rrLen(a, b, r), n = Math.floor(len / SEAT_W);
  for (let i = 0; i < n; i++) {
    const s = (i + 0.5) * len / n;
    const [x, z, nx, nz] = rrPoint(a, b, r, s);
    const dist = Math.min(s, len - s);            // along the bowl from the main-stand centre
    if (ring > 0 && i % 40 === 20) continue;      // aisles
    seats.push({ x, z, nx, nz, y: 0.6 + ring * ROW_H, ring, s, len, cost: ring * 7 + dist / 6 });
  }
}
const order = seats.map((_, i) => i).sort((i, j) => seats[i].cost - seats[j].cost);
const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
if (FANS.length <= 300) {               // small crowd: random seat per nick, near the main stand so fans are easy to see
  // two long sides (main + opposite stand), random seat per nick
  const pool = order.filter(i => { const st = seats[i]; return Math.abs(st.nz) > 0.99 && st.ring < 14; }), used = new Set(), out = [];
  FANS.forEach(nick => { let k = hash(nick.toLowerCase()) % pool.length; while (used.has(k)) k = (k + 7) % pool.length; used.add(k); out.push(pool[k]); });
  order.splice(0, FANS.length, ...out);
}
const SECTORS = "ABCDEFGHIJKLMNOP";
const byNick = new Map();
FANS.forEach((nick, i) => {
  const st = seats[order[i]];
  st.fan = nick;
  st.sec = SECTORS[Math.floor(st.s / st.len * 16) % 16];
  st.row = st.ring + 1;
  st.no = Math.floor((st.s % (st.len / 16)) / SEAT_W) + 1;
  byNick.set(nick.toLowerCase().replace(/^@/, ""), st);
});

// ---------- three.js scene ----------
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });  // city scale: no z-fighting
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1838);
const FOG = { stadium: [220, 700], city: [500, 1700] };
scene.fog = new THREE.Fog(0x8d96b8, ...FOG[MODE]);   // evening haze
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 5000);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x203018, 0.9));
const sun = new THREE.DirectionalLight(0xffe2b8, 0.9); sun.position.set(-80, 120, 60); scene.add(sun);

// sky gradient dome
{
  const g = new THREE.SphereGeometry(3000, 24, 12);
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: "varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
    fragmentShader: "varying float h; void main(){ vec3 a=vec3(.98,.62,.42), b=vec3(.20,.26,.52), c=vec3(.04,.09,.22); vec3 col = h<.08 ? mix(a,b,clamp(h/.08,0.,1.)) : mix(b,c,clamp((h-.08)/.5,0.,1.)); gl_FragColor=vec4(col,1.); }" });
  var sky = new THREE.Mesh(g, m); scene.add(sky);
}
// ground + pitch texture

  MODE = m; document.body.classList.toggle("city", m === "city");
  viewBtn.textContent = m === "city" ? "🏟" : "🏙";
  const [n, f] = FOG[m]; scene.fog.near = n; scene.fog.far = f;
  if (animate) { me = null; flyTo(VIEWS[m].pos.clone(), VIEWS[m].tgt.clone(), 2.2); }
}
viewBtn.onclick = () => setMode(MODE === "city" ? "stadium" : "city");
document.getElementById("home").onclick = () => { me = null; flyTo(VIEWS[MODE].pos.clone(), VIEWS[MODE].tgt.clone()); };
const zoom = f => { const d = camera.position.clone().sub(controls.target).multiplyScalar(f); flyTo(controls.target.clone().add(d), controls.target.clone(), .5); };
document.getElementById("zin").onclick = () => zoom(0.6);
document.getElementById("zout").onclick = () => zoom(1.6);
// web visitors: invite into the Telegram Mini App (seat + home live there)
const cta = document.getElementById("cta");
function updateCta() { cta.classList.toggle("on", !TG && !!STATE.miniapp); }
cta.onclick = () => { if (STATE.miniapp) location.href = STATE.miniapp; };

// ---------- labels ----------
const labelsEl = document.getElementById("labels");
const pool = [];
let me = null;
function tag(i) { if (!pool[i]) { const d = document.createElement("div"); d.className = "tag"; labelsEl.appendChild(d); pool[i] = d; } return pool[i]; }
const P = new THREE.Vector3();
function project(x, y, z) { P.set(x, y, z).project(camera); return [(P.x + 1) / 2 * innerWidth, (1 - P.y) / 2 * innerHeight, P.z]; }
let lastLabel = 0, used = 0;
function updateLabels(now) {
  if (now - lastLabel < 120 && !fly) return; lastLabel = now;
  used = 0;
  const camPos = camera.position, camR = Math.hypot(camPos.x, camPos.z, camPos.y);
  const boxes = [];
  const placeAt = (x, y, z, cls, txt, force) => {
    const [sx, sy, sz] = project(x, y, z);
    if (sz > 1 || sx < -40 || sx > innerWidth + 40 || sy < 60 || sy > innerHeight - 140) return false;
    const w = txt.length * 7.5 + 22, h = 22;
    if (!force && boxes.some(b => Math.abs(b[0] - sx) < (b[2] + w) / 2 && Math.abs(b[1] - sy) < h)) return false;
    boxes.push([sx, sy, w]);
    const d = tag(used++); d.className = cls; d.textContent = txt; d.style.left = sx + "px"; d.style.top = sy + "px"; d.style.display = "block";
    return true;
  };
  const place = (st, cls, txt) => placeAt(st.x, st.y + 1.3, st.z, cls, txt, cls === "tag me");
  if (me) place(me, "tag me", "@" + me.fan);
  const near = camR < 260;                       // inside the stadium: people; far away: the city
  if (near) {
    heroObjs.forEach(o => placeAt(o.position.x, o.userData.h + 0.6, o.position.z, "tag hero", o.userData.name, true));
    const cand = [], step = Math.max(1, Math.floor(fans / 3000));
    for (let k = 0; k < fans; k += step) { const st = seats[order[k]]; cand.push([(st.x - camPos.x) ** 2 + (st.y - camPos.y) ** 2 + (st.z - camPos.z) ** 2, st]); }
    cand.sort((a, b) => a[0] - b[0]);
    let shown = 0; const LIM = fans <= 60 ? 60 : 22;
    for (const [, st] of cand) { if (shown >= LIM) break; if (st !== me && place(st, "tag", "@" + st.fan)) shown++; }
  } else { placeAt(0, OUT_R * ROW_H + 14, 0, "tag big", T[L].stad, true); placeAt(PLAZA.x, 24, PLAZA.z - 30, "tag lot", T[L].plaza, true); }
  const mine = myId && homeObjs.find(o => o.userData.id === myId);
  if (mine) placeAt(mine.position.x, 14, mine.position.z, "tag me home", mine.userData.nick, true);
  if (!near || MODE === "city") {
    for (const l of LOTS) placeAt(l.x, l.park ? 2 : 8, l.z, "tag lot", (l.park ? "" : T[L].soon) + T[L].lots[l.i]);
    const hs = homeObjs.map(o => [o.position.distanceToSquared(camPos), o]).sort((a, b) => a[0] - b[0]).slice(0, 30);
    for (const [, o] of hs) if (o !== mine) placeAt(o.position.x, 12, o.position.z, "tag home", o.userData.nick);
  }
  for (let k = used; k < pool.length; k++) pool[k].style.display = "none";
}

// ---------- find: stadium seat first, then city home ----------
const toast = document.getElementById("toast");
function say(t) { toast.textContent = t; toast.style.display = "block"; clearTimeout(say.t); say.t = setTimeout(() => toast.style.display = "none", 4200); }
function goHome(h) { const p = h.p; if (!p) return; const dir = new THREE.Vector3(p.x, 0, p.z).normalize(); const tall = h.style >= 2; flyTo(new THREE.Vector3(p.x - dir.x * (tall ? 60 : 30), tall ? 42 : 24, p.z - dir.z * (tall ? 60 : 30)), new THREE.Vector3(p.x, tall ? 14 : 3, p.z), 2); }
document.getElementById("find").onsubmit = e => {
  e.preventDefault();
  const q = norm(document.getElementById("q").value);
  if (!q) return;
  const st = byNick.get(q);
  if (st) { goTo(st); return; }
  const h = HOMES.find(x => norm(x.nick) === q);
  if (h) { goHome(h); say(T[L].homeOf(h.nick, h.n)); return; }
  say(T[L].nf);
};

// hero card on tap
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
canvas.addEventListener("pointerdown", e => downAt = [e.clientX, e.clientY]);
canvas.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const fh = ray.intersectObject(bodies)[0] || ray.intersectObject(heads)[0] || ray.intersectObject(shorts)[0];
  if (fh && fiSeat[fh.instanceId]) { showFan(fiSeat[fh.instanceId]); return; }
  const hit = ray.intersectObjects(heroObjs)[0];
  if (hit) { const hz = hit.object.userData; document.getElementById("ch").textContent = hz.name; document.getElementById("cp").textContent = hz.role[L]; document.getElementById("card").style.display = "block"; return; }
  const hh = ray.intersectObjects(homeObjs, true)[0];
  if (hh) { let o = hh.object; while (o.parent && !homeObjs.includes(o)) o = o.parent; const h = o.userData;
    document.getElementById("ch").textContent = "🏠 " + h.nick; document.getElementById("cp").textContent = T[L].homeOf(h.nick, h.n); document.getElementById("card").style.display = "block"; }
});
const IG_SET = new Set(IG_FANS.map(norm));
function showFan(st) {
  me = st;
  document.getElementById("ch").textContent = "@" + st.fan;
  const cp = document.getElementById("cp");
  cp.innerHTML = "";
  cp.append(T[L].seat(st), document.createElement("br"));
  const meta = FAN_META.get(st.fan), a = document.createElement("a"); a.target = "_blank"; a.rel = "noopener"; a.style.color = "#FFD23F";
  if (IG_SET.has(st.fan) || !meta || meta.ig || !meta.tg) { a.href = "https://instagram.com/" + encodeURIComponent(st.fan); a.textContent = "Instagram ↗"; }
  else { a.href = "https://t.me/" + encodeURIComponent(meta.tg); a.textContent = "Telegram ↗"; }
  cp.append(a);
  document.getElementById("card").style.display = "block";
}
document.getElementById("cx").onclick = () => document.getElementById("card").style.display = "none";

// ---------- fans list ----------
function goTo(st) {
  if (MODE !== "stadium") setMode("stadium", false);
  const tgt = new THREE.Vector3(st.x, st.y + 0.6, st.z);
  flyTo(new THREE.Vector3(st.x - st.nx * 9, st.y + 4.5, st.z - st.nz * 9), tgt, 2.0);
  if (st.fi != null) { bodies.setColorAt(st.fi, C.set(0xFFD23F)); bodies.instanceColor.needsUpdate = true; }
  showFan(st);
}
document.getElementById("list").onclick = () => {
  const pl = document.getElementById("plist"); pl.innerHTML = "";
  FANS.slice(0, 500).forEach(nick => { const b = document.createElement("button"); b.textContent = "@" + nick; b.onclick = () => { document.getElementById("panel").style.display = "none"; goTo(byNick.get(norm(nick))); }; pl.appendChild(b); });
  document.getElementById("panel").style.display = "block";
};
document.getElementById("px").onclick = () => document.getElementById("panel").style.display = "none";

// ---------- Mini App actions: seat, home, work ----------
const sheets = ["sSeat", "sHome", "sJob"].map(id => document.getElementById(id));
const open = id => { sheets.forEach(s => s.style.display = s.id === id ? "block" : "none"); };
sheets.forEach(s => s.querySelector(".x").onclick = () => s.style.display = "none");
async function post(path, body) {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: TG.initData, ...body }) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || r.status); return d;
}
const needTg = fn => () => { if (!TG) { say(T[L].needTg); return; } fn(); };
document.getElementById("bSeat").onclick = needTg(() => open("sSeat"));
document.getElementById("seatGo").onclick = async () => {
  try {
    const d = await post("/api/seat", { instagram: document.getElementById("igNick").value });
    try { sessionStorage.setItem("zfk_goto", d.nick); } catch (e) {}
    location.reload();                                   // stadium is rebuilt with the new seat, then the camera flies to it
  } catch (e) { say(T[L].err); }
};
let pick = { style: 4, color: 1 };
const stylesEl = document.getElementById("styles"), colorsEl = document.getElementById("colors"), rolesEl = document.getElementById("roles");
function mark() { [...stylesEl.children].forEach((b, i) => b.classList.toggle("on", i === pick.style)); [...colorsEl.children].forEach((b, i) => b.classList.toggle("on", i === pick.color)); }
function buildPickers() {
  stylesEl.innerHTML = ""; T[L].styles.forEach((n, i) => { const b = document.createElement("button"); b.className = "opt"; b.textContent = n; b.onclick = () => { pick.style = i; mark(); }; stylesEl.appendChild(b); });
  colorsEl.innerHTML = ""; COLORS.forEach((c, i) => { const b = document.createElement("button"); b.className = "sw"; b.style.background = "#" + c.toString(16).padStart(6, "0"); b.onclick = () => { pick.color = i; mark(); }; colorsEl.appendChild(b); });
  rolesEl.innerHTML = ""; T[L].roles.forEach((n, i) => { const b = document.createElement("button"); b.className = "opt"; b.textContent = n; b.dataset.i = i; b.onclick = () => { [...rolesEl.children].forEach(x => x.classList.toggle("on", x === b)); }; rolesEl.appendChild(b); });
  mark();
}
document.getElementById("bHome").onclick = needTg(() => { const m = HOMES.find(h => h.id === myId); if (m) { pick = { style: m.style, color: m.color }; mark(); } open("sHome"); });
document.getElementById("homeGo").onclick = async () => {
  try {
    await post("/api/home", pick);
    document.getElementById("sHome").style.display = "none";
    const s = await getState(8000); if (s) { STATE = s; layoutHomes(s.homes); }
    const m = HOMES.find(h => h.id === myId); if (m) { if (MODE !== "city") setMode("city", false); goHome(m); say(T[L].homeOk + " " + m.nick); }
  } catch (e) { say(T[L].err); }
};
document.getElementById("bJob").onclick = needTg(() => open("sJob"));
document.getElementById("jobGo").onclick = async () => {
  const on = rolesEl.querySelector(".on");
  if (!on) { rolesEl.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], 250); return; }
  try { await post("/api/apply", { role: T.uz.roles[+on.dataset.i], note: document.getElementById("jobNote").value }); document.getElementById("sJob").style.display = "none"; say(T[L].jobOk); }
  catch (e) { say(T[L].err); }
};

// ---------- language ----------
const langsEl = document.getElementById("langs");
[["uz", "O‘zbekcha"], ["ru", "Русский"], ["en", "English"]].forEach(([k, n]) => {
  const b = document.createElement("button"); b.textContent = n; b.onclick = () => setLang(k); b.dataset.k = k; langsEl.appendChild(b);
});
function setLang(k) {
  L = k; try { localStorage.setItem("zfk_lang", k); } catch (e) {}
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[L][el.dataset.t]);
  document.getElementById("q").placeholder = T[L].ph;
  document.getElementById("igNick").placeholder = T[L].igPh;
  document.getElementById("jobNote").placeholder = T[L].jobPh;
  langsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === L));
  document.getElementById("demo").style.display = DEMO ? "block" : "none";
  buildPickers();
}
setLang(L);
setMode(MODE, false);
updateCta();

// counter roll-up
const nEl = document.getElementById("n");
const t0 = performance.now();
function fmt(v) { return Math.round(v).toLocaleString("fr-FR").replace(/ | /g, " "); }

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
let prev = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (fly) {
    fly.t = (now - fly.start) / 1000 / fly.dur; const p = fly.t >= 1 ? 1 : 1 - Math.pow(1 - fly.t, 3);
    camera.position.lerpVectors(fly.p0, fly.p1, p); controls.target.lerpVectors(fly.t0, fly.t1, p);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  sky.position.copy(camera.position);
  animateTeam(now / 1000);
  cityTick(dt);
  nEl.textContent = fmt(fans * Math.min(1, (now - t0) / 1600));
  renderer.render(scene, camera);
  updateLabels(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// after a seat claim: fly to it; in the Mini App: fly to my home
{
  let go = null; try { go = sessionStorage.getItem("zfk_goto"); sessionStorage.removeItem("zfk_goto"); } catch (e) {}
  const st = go && byNick.get(norm(go));
  if (st) setTimeout(() => { goTo(st); say(T[L].seatOk(T[L].seat(st))); }, 700);
  else if (MODE === "city") { const m = HOMES.find(h => h.id === myId); if (m) setTimeout(() => goHome(m), 900); }
}
// live city: new homes appear without reload; first load may have missed a sleeping backend
setInterval(async () => { const s = await getState(15000); if (s) { const had = !!STATE.miniapp; STATE = s; if (s.homes.length !== HOMES.length) layoutHomes(s.homes); if (!had) updateCta(); } }, 30000);
</script>
