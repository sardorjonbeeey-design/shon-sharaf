<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zamin FK shahri</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0D2557; --blue:#1F4FB8; --yel:#FFD23F; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0a1730; font-family: Montserrat, sans-serif; color:#fff; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .ui { position:fixed; z-index:5; }
  .pill { background:rgba(13,37,87,.92); border:2px solid rgba(255,255,255,.25); border-radius:20px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  #brand { top:12px; left:12px; padding:10px 14px; font-weight:900; font-size:16px; }
  #count { top:12px; right:12px; padding:8px 14px; text-align:center; }
  #count small { display:block; color:var(--yel); font-weight:900; font-size:11px; letter-spacing:2px; }
  #count b { display:block; font-weight:900; font-size:26px; }
  #side { right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; }
  #side button { width:50px; height:50px; border-radius:16px; font:inherit; font-weight:900; font-size:22px; color:#fff; background:rgba(13,37,87,.92); border:2px solid rgba(255,255,255,.25); }
  #bottom { left:12px; right:12px; bottom:14px; display:flex; flex-direction:column; gap:10px; }
  #build { font:inherit; font-weight:900; font-size:19px; color:var(--navy); background:var(--yel); border:0; border-radius:18px; padding:16px; }
  #find { display:flex; gap:10px; }
  #find input { flex:1; min-width:0; font:inherit; font-weight:700; font-size:16px; color:#fff; background:rgba(13,37,87,.95); border:2px solid rgba(255,255,255,.25); border-radius:16px; padding:13px 14px; outline:none; }
  #find input::placeholder { color:#9DB8FF; }
  #find button { font:inherit; font-weight:900; color:#fff; background:var(--blue); border:0; border-radius:16px; padding:0 18px; }
  #panel { left:12px; right:12px; bottom:14px; padding:18px; display:none; z-index:7; }
  #panel h3 { margin:0 0 12px; color:var(--yel); font-weight:900; }
  .row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .opt { flex:1; min-width:70px; font:inherit; font-weight:700; font-size:13px; color:#fff; background:rgba(255,255,255,.1); border:3px solid transparent; border-radius:14px; padding:10px 6px; }
  .opt.on { border-color:var(--yel); }
  .sw { width:44px; height:44px; border-radius:50%; border:4px solid transparent; }
  .sw.on { border-color:var(--yel); }
  #save { width:100%; font:inherit; font-weight:900; font-size:18px; color:var(--navy); background:var(--yel); border:0; border-radius:16px; padding:14px; }
  #px { position:absolute; right:14px; top:10px; background:none; border:0; color:#fff; font-size:22px; }
  #toast { left:50%; transform:translateX(-50%); top:76px; padding:12px 16px; font-weight:700; font-size:14px; text-align:center; display:none; max-width:92vw; z-index:8; }
  #labels { position:fixed; inset:0; pointer-events:none; z-index:3; overflow:hidden; }
  .tag { position:absolute; transform:translate(-50%,-100%); background:rgba(255,255,255,.95); color:var(--navy); font-weight:900; font-size:11px; padding:3px 8px; border-radius:9px; white-space:nowrap; }
  .tag.me { background:var(--yel); font-size:14px; padding:5px 10px; border:2px solid var(--navy); }
  .tag.big { background:var(--navy); color:#fff; border:2px solid var(--yel); font-size:14px; padding:6px 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="brand" class="ui pill">ZAMIN FK SHAHRI</div>
<div id="count" class="ui pill"><small>AHOLI</small><b id="n">0</b></div>
<div id="side" class="ui"><button id="zin">+</button><button id="zout">−</button><button id="home">⌂</button></div>
<div id="toast" class="ui pill"></div>
<div id="bottom" class="ui">
  <button id="build">🏠 Uyimni qurish</button>
  <form id="find"><input id="q" placeholder="Nik bo‘yicha qidirish" autocomplete="off" autocapitalize="off"><button>Topish</button></form>
</div>
<div id="panel" class="ui pill">
  <button id="px">×</button>
  <h3>Uyingizni tanlang</h3>
  <div class="row" id="styles"></div>
  <div class="row" id="colors"></div>
  <button id="save">Qurish</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
if (TG) { TG.ready(); TG.expand(); try { TG.setHeaderColor("#0D2557"); } catch (e) {} }
const STYLE_NAMES = ["Hovli uy", "Zamonaviy", "Ikki qavatli", "O‘tov"];
const COLORS = [0x1F4FB8, 0xf2f2f2, 0xFFD23F, 0xd94848, 0x3f9a4a, 0xd9b48a];
const toastEl = document.getElementById("toast");
function say(t) { toastEl.textContent = t; toastEl.style.display = "block"; clearTimeout(say.t); say.t = setTimeout(() => toastEl.style.display = "none", 3800); }

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc4ee);
scene.fog = new THREE.Fog(0x9fc4ee, 260, 700);
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 2000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a5a2a, 0.85));
const sun = new THREE.DirectionalLight(0xfff0d8, 0.85); sun.position.set(-120, 200, 80); scene.add(sun);
const lam = c => new THREE.MeshLambertMaterial({ color: c });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), lam(0x6fae55)); ground.rotation.x = -Math.PI / 2; scene.add(ground);

// ---------- stadium (centre piece) ----------
const PW = 105, PH = 68;
{
  const cv = document.createElement("canvas"); cv.width = 1050; cv.height = 680; const x = cv.getContext("2d");
  for (let i = 0; i < 14; i++) { x.fillStyle = i % 2 ? "#3f8a3a" : "#468f40"; x.fillRect(i * 75, 0, 75, 680); }
  x.strokeStyle = "#fff"; x.lineWidth = 5; x.strokeRect(20, 20, 1010, 640); x.beginPath(); x.moveTo(525, 20); x.lineTo(525, 660); x.stroke();
  x.beginPath(); x.arc(525, 340, 91, 0, 7); x.stroke(); x.strokeRect(20, 138, 165, 404); x.strokeRect(865, 138, 165, 404);
  const pitch = new THREE.Mesh(new THREE.PlaneGeometry(PW + 4, PH + 4), new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(cv) }));
  pitch.rotation.x = -Math.PI / 2; pitch.position.y = 0.05; scene.add(pitch);
  const track = new THREE.Mesh(new THREE.PlaneGeometry(PW + 18, PH + 18), lam(0x8a6b4a)); track.rotation.x = -Math.PI / 2; track.position.y = 0.02; scene.add(track);
  // stands: 4 sides x 10 tiers, blue/white stripes
  const tierG = new THREE.BoxGeometry(1, 1, 1);
  for (let k = 0; k < 10; k++) {
    const h = 1.2 + k * 1.2, d = 2.2, off = 10 + k * 2.2;
    const m = lam(k % 2 ? 0xf2f2f2 : 0x1F4FB8);
    for (const [w, x0, z0, rot] of [[PW + 2 * off, 0, PH / 2 + off, 0], [PW + 2 * off, 0, -(PH / 2 + off), 0], [PH + 2 * off, PW / 2 + off, 0, 1], [PH + 2 * off, -(PW / 2 + off), 0, 1]]) {
      const b = new THREE.Mesh(tierG, m); b.scale.set(rot ? d : w, h, rot ? w : d); b.position.set(x0, h / 2, z0); scene.add(b);
    }
  }
  // LED screen + floodlights
  const scr = new THREE.Mesh(new THREE.BoxGeometry(30, 14, 1), new THREE.MeshBasicMaterial({ color: 0x0b1f4d }));
  scr.position.set(0, 26, -(PH / 2 + 34)); scene.add(scr);
  const scv = document.createElement("canvas"); scv.width = 600; scv.height = 280; const sx = scv.getContext("2d");
  sx.fillStyle = "#0b1f4d"; sx.fillRect(0, 0, 600, 280); sx.fillStyle = "#FFD23F"; sx.font = "900 64px Montserrat, sans-serif"; sx.textAlign = "center";
  sx.fillText("ZAMIN FK", 300, 120); sx.fillStyle = "#fff"; sx.font = "700 40px Montserrat, sans-serif"; sx.fillText("Uyingizni quring!", 300, 200);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(29, 13), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(scv) }));
  face.position.set(0, 26, -(PH / 2 + 33.4)); scene.add(face);
  for (const [a, b] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.9, 40, 6), lam(0x777777)); pole.position.set(a * (PW / 2 + 36), 20, b * (PH / 2 + 36)); scene.add(pole);
    const lamp = new THREE.Mesh(new THREE.BoxGeometry(7, 4, 1), new THREE.MeshBasicMaterial({ color: 0xfff6d0 })); lamp.position.set(pole.position.x, 40, pole.position.z); lamp.lookAt(0, 0, 0); scene.add(lamp);
  }
}

// ---------- plots: grid cells around the stadium, nearest first; roads every 5th line ----------
const CELL = 14, plots = [];
for (let gx = -40; gx <= 40; gx++) for (let gz = -40; gz <= 40; gz++) {
  if (gx % 5 === 0 || gz % 5 === 0) continue;                       // roads
  const x = gx * CELL, z = gz * CELL;
  if (Math.abs(x) < PW / 2 + 60 && Math.abs(z) < PH / 2 + 60) continue; // stadium area
  plots.push({ x, z, d: Math.hypot(x, z * 1.2) });
}
plots.sort((a, b) => a.d - b.d);
{ // roads
  const rm = lam(0x5a5a5a);
  for (let g = -40; g <= 40; g += 5) {
    const a = new THREE.Mesh(new THREE.PlaneGeometry(CELL * 81, 6), rm); a.rotation.x = -Math.PI / 2; a.position.set(0, 0.03, g * CELL); scene.add(a);
    const b = new THREE.Mesh(new THREE.PlaneGeometry(6, CELL * 81), rm); b.rotation.x = -Math.PI / 2; b.position.set(g * CELL, 0.03, 0); scene.add(b);
  }
}

// ---------- homes ----------
let HOMES = [], homeObjs = [], myId = TG && TG.initDataUnsafe && TG.initDataUnsafe.user ? String(TG.initDataUnsafe.user.id) : null;
const homeGroup = new THREE.Group(); scene.add(homeGroup);
const G = { box: new THREE.BoxGeometry(1, 1, 1), pyr: new THREE.ConeGeometry(0.75, 1, 4), cyl: new THREE.CylinderGeometry(0.5, 0.5, 1, 16), cone: new THREE.ConeGeometry(0.55, 1, 16) };
const roofM = lam(0x8a3b2b), darkM = lam(0x2b2b2b), doorM = lam(0x5a3a22);
function makeHome(h) {
  const g = new THREE.Group(), body = lam(COLORS[h.color] || COLORS[0]);
  const add = (geo, m, sx, sy, sz, x, y, z, ry = 0) => { const o = new THREE.Mesh(geo, m); o.scale.set(sx, sy, sz); o.position.set(x, y, z); o.rotation.y = ry; g.add(o); return o; };
  if (h.style === 0) { add(G.box, body, 8, 4.5, 7, 0, 2.25, 0); add(G.pyr, roofM, 8, 3, 8, 0, 6, 0, Math.PI / 4); }
  else if (h.style === 1) { add(G.box, body, 9, 5, 7, 0, 2.5, 0); add(G.box, darkM, 9.6, 0.5, 7.6, 0, 5.2, 0); add(G.box, lam(0x9fd0ff), 6, 1.6, 0.2, 0, 3.2, 3.55); }
  else if (h.style === 2) { add(G.box, body, 8, 8, 7, 0, 4, 0); add(G.pyr, roofM, 8, 3, 8, 0, 9.5, 0, Math.PI / 4); add(G.box, lam(0x9fd0ff), 2, 1.6, 0.2, -2, 6, 3.55); add(G.box, lam(0x9fd0ff), 2, 1.6, 0.2, 2, 6, 3.55); }
  else { add(G.cyl, body, 9, 4, 9, 0, 2, 0); add(G.cone, roofM, 9.5, 3.5, 9.5, 0, 5.75, 0); }
  add(G.box, doorM, 1.6, 2.6, 0.2, 0, 1.3, h.style === 3 ? 4.5 : 3.6);
  // gate with fence
  add(G.box, lam(0xeeeeee), 12, 1, 0.3, 0, 0.5, 6.2);
  return g;
}
function layout() {
  homeObjs.forEach(o => homeGroup.remove(o)); homeObjs = [];
  HOMES.forEach((h, i) => {
    const p = plots[i]; if (!p) return;
    const o = makeHome(h);
    o.position.set(p.x, 0, p.z);
    o.rotation.y = Math.atan2(-p.x, -p.z);                // gate faces the stadium
    o.userData = h; h.p = p; homeGroup.add(o); homeObjs.push(o);
  });
  document.getElementById("n").textContent = HOMES.length;
}
async function load() {
  try { const r = await fetch("/api/homes", { cache: "no-store" }); HOMES = await r.json(); } catch (e) { HOMES = []; }
  layout();
}

// ---------- camera ----------
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.46; controls.minDistance = 20; controls.maxDistance = 600;
const HOME_VIEW = { pos: new THREE.Vector3(150, 170, 220), tgt: new THREE.Vector3(0, 0, 0) };
camera.position.copy(HOME_VIEW.pos); controls.target.copy(HOME_VIEW.tgt);
let fly = null;
function flyTo(pos, tgt, dur = 1.6) { fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, start: performance.now(), dur }; }
function goHome(h) { const p = h.p; if (!p) return; const dir = new THREE.Vector3(p.x, 0, p.z).normalize(); flyTo(new THREE.Vector3(p.x - dir.x * 30, 26, p.z - dir.z * 30), new THREE.Vector3(p.x, 3, p.z), 2); }
document.getElementById("home").onclick = () => flyTo(HOME_VIEW.pos.clone(), HOME_VIEW.tgt.clone());
const zoom = f => { const d = camera.position.clone().sub(controls.target).multiplyScalar(f); flyTo(controls.target.clone().add(d), controls.target.clone(), .5); };
document.getElementById("zin").onclick = () => zoom(0.6);
document.getElementById("zout").onclick = () => zoom(1.6);

// ---------- labels ----------
const labelsEl = document.getElementById("labels"), pool = [];
const P = new THREE.Vector3();
function tag(i) { if (!pool[i]) { const d = document.createElement("div"); labelsEl.appendChild(d); pool[i] = d; } return pool[i]; }
function put(i, cls, txt, x, y, z) {
  P.set(x, y, z).project(camera); if (P.z > 1) return false;
  const sx = (P.x + 1) / 2 * innerWidth, sy = (1 - P.y) / 2 * innerHeight;
  if (sx < -40 || sx > innerWidth + 40 || sy < 50 || sy > innerHeight - 140) return false;
  const d = tag(i); d.className = cls; d.textContent = txt; d.style.left = sx + "px"; d.style.top = sy + "px"; d.style.display = "block"; return true;
}
let lastL = 0;
function labels(now) {
  if (now - lastL < 150 && !fly) return; lastL = now;
  let k = 0;
  if (put(k, "tag big", "🏟 ZAMIN FK STADIONI", 0, 34, 0)) k++;
  const c = camera.position;
  const near = homeObjs.map(o => [o.position.distanceToSquared(c), o]).sort((a, b) => a[0] - b[0]).slice(0, 26);
  for (const [, o] of near) { const h = o.userData; if (put(k, h.id === myId ? "tag me" : "tag", h.nick, o.position.x, 12, o.position.z)) k++; }
  for (let j = k; j < pool.length; j++) pool[j].style.display = "none";
}

// ---------- build panel ----------
let pick = { style: 0, color: 0 };
const stylesEl = document.getElementById("styles"), colorsEl = document.getElementById("colors");
STYLE_NAMES.forEach((n, i) => { const b = document.createElement("button"); b.className = "opt"; b.textContent = n; b.onclick = () => { pick.style = i; mark(); }; stylesEl.appendChild(b); });
COLORS.forEach((c, i) => { const b = document.createElement("button"); b.className = "sw"; b.style.background = "#" + c.toString(16).padStart(6, "0"); b.onclick = () => { pick.color = i; mark(); }; colorsEl.appendChild(b); });
function mark() { [...stylesEl.children].forEach((b, i) => b.classList.toggle("on", i === pick.style)); [...colorsEl.children].forEach((b, i) => b.classList.toggle("on", i === pick.color)); }
mark();
document.getElementById("build").onclick = () => {
  if (!TG) { say("Uy qurish uchun ilovani Telegram orqali oching."); return; }
  const mine = HOMES.find(h => h.id === myId); if (mine) { pick = { style: mine.style, color: mine.color }; mark(); }
  document.getElementById("panel").style.display = "block";
};
document.getElementById("px").onclick = () => document.getElementById("panel").style.display = "none";
document.getElementById("save").onclick = async () => {
  try {
    const r = await fetch("/api/home", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: TG.initData, ...pick }) });
    if (!r.ok) throw new Error(r.status);
    document.getElementById("panel").style.display = "none";
    await load();
    const mine = HOMES.find(h => h.id === myId); if (mine) { goHome(mine); say("Uyingiz tayyor! 🏠 " + mine.nick); }
  } catch (e) { say("Saqlab bo‘lmadi, qayta urinib ko‘ring."); }
};
document.getElementById("find").onsubmit = e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim().toLowerCase().replace(/^@/, "");
  const h = HOMES.find(x => x.nick.toLowerCase().replace(/^@/, "") === q);
  if (h) { goHome(h); say(h.nick + " — " + h.n + "-uy"); } else say("Bunday nik hali shaharda yo‘q.");
};

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
function loop(now) {
  if (fly) { const t = Math.min(1, (now - fly.start) / 1000 / fly.dur), p = 1 - Math.pow(1 - t, 3); camera.position.lerpVectors(fly.p0, fly.p1, p); controls.target.lerpVectors(fly.t0, fly.t1, p); if (t >= 1) fly = null; }
  controls.update(); renderer.render(scene, camera); labels(now); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
load().then(() => { const mine = HOMES.find(h => h.id === myId); if (mine) setTimeout(() => goHome(mine), 600); });
</script>
</body>
</html>
