</div>
<script>
const A = "assets/", FPS = 30;
const S = { hook: 0, ff: 3.2, pk: 8.6, ac: 14.0, bud: 20.0, coach: 26.2, c1: 30.6, c2: 36.6, cta: 43.4 }; window.END = 50.4;
const N3 = { ff: 162, pk: 162, ac: 174 };
const BG = { hook: "bg_hook.png", bud: "bg_cta.png", coach: "bg_coach.png", c1: "bg_cta.png", c2: "bg_cta.png", cta: "bg_cta.png" };
const $ = id => document.getElementById(id), ov = $("ov"), clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3), sp = x => { x = clamp(x); return x < 1 ? 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2) : 1; };   // overshoot
const seg = t => { let k = "hook"; for (const n in S) if (t >= S[n]) k = n; return k; };
function el(html, cls = "a", style = "") { const d = document.createElement("div"); d.className = cls; d.style.cssText = style; d.innerHTML = html; ov.appendChild(d); return d; }
function set(e, { x = 0, y = 0, s = 1, r = 0, o = 1 }) { e.style.opacity = o; e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; }

const price = [el("20 000 000 so‘m", "a pill", "left:85px;top:1170px;width:430px"), el("12 500 000 so‘m", "a pill", "left:565px;top:1170px;width:430px")];
const left = [el("Qoladi: <b style='color:#FFD23F'>59 875 000</b>", "a", "left:85px;top:1290px;width:430px;text-align:center;font:800 34px M;color:#cfe0ff"), el("Qoladi: <b style='color:#FFD23F'>67 375 000</b>", "a", "left:565px;top:1290px;width:430px;text-align:center;font:800 34px M;color:#cfe0ff")];
const vs = el("1 — <span style='color:#6f9bff'>KWAME</span> · 20 000 000<br>2 — <span style='color:#6f9bff'>JASURBEK</span> · 12 500 000", "a", "left:0;width:1080px;top:1230px;text-align:center;font:900 50px/1.25 M;-webkit-text-stroke:8px rgba(5,14,60,.9);paint-order:stroke fill");
const cta = el("Izohga <b>1</b> yoki <b>2</b> yozing 👇", "a pill", "left:110px;top:1470px;width:860px;font-size:50px"), cta2 = el("Eng ko‘p layk olgan izoh — TRANSFER", "a", "left:0;width:1080px;top:1610px;text-align:center;font:900 38px M;color:#9fb6ff");
const cap = el("", "a cap");
const dots = Array.from({ length: 22 }, (_, i) => { const d = el("", "dot", "opacity:.0"); d.dataset.k = i; d.style.left = (i * 97 % 1040) + "px"; return d; });
const fxl = dots;
// ---- captions from voice words ----
const cues = []; for (const b of window.W) for (const s of b.sents) cues.push({ a: s.a, b: s.b, w: s.words, beat: b.beat });
// ---- per-frame ----
window.ready = async () => { await document.fonts.ready; const imgs = [...document.images]; await Promise.all(imgs.map(i => i.decode().catch(() => 0))); for (const f of Object.values(BG)) { const i = new Image(); i.src = A + f; await i.decode().catch(() => 0); } };
async function frame3d(k, t) { const i = clamp(Math.floor((t - S[k]) * FPS), 0, N3[k] - 1), im = $("b3"); im.src = `build/3d/${k}/f_${String(i).padStart(4, "0")}.jpg`; try { await im.decode(); } catch (e) { } }
window.renderAt = async t => {
  const k = seg(t), s0 = S[k], lt = t - s0, is3 = k in N3;
  for (const e of ov.children) e.style.opacity = 0;
  $("b3").style.display = is3 ? "block" : "none"; $("bp").style.display = is3 ? "none" : "block"; $("dim").style.opacity = 0;
  if (is3) await frame3d(k, t);
  else { const bg = BG[k]; $("bp").style.backgroundImage = `url(${A}${bg})`; const z = 1.04 + .10 * clamp(lt / 8) + (k === "c1" || k === "c2" || k === "cta" ? .02 * Math.sin(t * .6) : 0); $("bp").style.transform = `scale(${z}) translate(${Math.sin(t * .5) * 14}px,${Math.cos(t * .4) * 10}px)`; if (k === "bud" || k === "c1" || k === "c2" || k === "cta") $("dim").style.opacity = .35; }
  // drifting dust
  fxl.forEach((d, i) => { const y = 1950 - ((t * (40 + i % 5 * 14) + i * 131) % 2050), x = (i * 97 % 1040) + Math.sin(t * .8 + i) * 30; d.style.opacity = is3 ? 0 : .5; d.style.transform = `translate(${x}px,${y}px) scale(${.6 + i % 4 * .35})`; d.style.left = "0"; d.style.top = "0"; });
  // ---- hook ----
  if (k === "hook") {
    const ys = [350, 600, 850], rot = [-2.2, 1.6, -1.2], st = [.35, .95, 1.55];
    cards.forEach((c, i) => { const p = sp((t - st[i]) / .35); set(c, { y: ys[i], r: rot[i], s: t < st[i] ? 0 : p, o: t < st[i] ? 0 : (t > 3.0 ? clamp((3.2 - t) / .2) : 1) }); });
    const p = sp(t / .45); set(title, { s: .8 + .2 * p, o: clamp(t / .15) });
  }
  // ---- builds ----
  const B = { ff: [0, chipFF], pk: [1, chipPK], ac: [2, chipAC] };
  if (is3) {
    const [ci, chip] = B[k], c = cards[ci], dur = k === "ac" ? 6.0 : 5.4;
    set(c, { y: -260 + 400 * eo(lt / .35) + Math.sin(t * 2) * 4, r: -1 + Math.sin(t * 1.3) * .4, o: clamp(lt / .1) * clamp((dur - lt) / .3) });
    set(chip, { x: -900 + 900 * eo((lt - 1.7) / .4), o: clamp((lt - 1.7) / .1) * clamp((dur - lt) / .3) });
    if (k === "ac") set(chipMG, { x: -900 + 900 * eo((lt - 3.2) / .4), s: sp((lt - 3.2) / .5) * 0 + 1, o: clamp((lt - 3.2) / .1) * clamp((6.0 - lt) / .3) });
  }
  // ---- budget ----
  if (k === "bud") {
    const u = eo((lt - .5) / 2.8), v = 15000000 + (79875000 - 15000000) * u;
    set(budT, { y: -40 * (1 - eo(lt / .3)), o: clamp(lt / .2) }); budN.textContent = fmt(v); set(budN, { s: .9 + .1 * sp((lt - .2) / .4) + (u > .98 ? .04 * Math.sin((lt - 3.4) * 9) * clamp(1 - (lt - 3.4)) : 0), o: clamp((lt - .2) / .2) }); set(budU, { o: clamp((lt - .6) / .3) });
    bL1.textContent = `❤ ${fmt(4325 * eo((lt - 1) / 2.4))} layk`; set(bL1, { s: sp((lt - 1) / .4), o: lt > 1 ? 1 : 0 });
    bL2.textContent = `× 15 000 so‘m = ${fmt(64875000 * eo((lt - 1) / 2.4))}`; set(bL2, { s: sp((lt - 1.5) / .4), o: lt > 1.5 ? 1 : 0 });

  if (k === "coach") {
    set(coachSp, { x: 700 * (1 - eo(lt / .5)), r: Math.sin(t * 2) * 1.4, o: clamp(lt / .1) });
    set(coachB, { s: sp((lt - .5) / .4), o: lt > .5 ? 1 : 0, r: -3 + Math.sin(t * 5) * 1 });
    set(coachD, { x: -900 + 900 * eo((lt - 1.4) / .4), o: lt > 1.4 ? 1 : 0 }); set(coachC, { x: -900 + 900 * eo((lt - .8) / .4), o: lt > .8 ? 1 : 0 });
  }
  // ---- player cards + CTA ----
  if (k === "c1" || k === "c2" || k === "cta") {
    set(topB, { y: -120 * (1 - eo(lt / .35)) * (k === "c1" ? 1 : 0) , o: 1 });
    const t1 = t - S.c1, t2 = t - S.c2, tc = t - S.cta, base = [{ x: 85, y: 420 }, { x: 565, y: 420 }];
    const sw = i => Math.sin(t * 1.4 + i * 2) * 1.1, fl = i => Math.sin(t * 1.9 + i) * 6;
    set(pc[0], { x: base[0].x - 900 * (1 - eo(t1 / .5)), y: base[0].y + fl(0), r: sw(0) + (t1 < .5 ? -6 * (1 - eo(t1 / .5)) : 0), o: t1 > 0 ? 1 : 0 });
    set(pc[1], { x: base[1].x + 900 * (1 - eo(t2 / .5)), y: base[1].y + fl(1), r: sw(1) + (t2 < .5 ? 6 * (1 - eo(t2 / .5)) : 0), o: t2 > 0 ? 1 : 0 });
    if (k === "cta") { set(head, { s: .85 + .15 * sp(tc / .4), o: clamp(tc / .15) }); set(vs, { y: 0, s: sp((tc - .8) / .4), o: tc > .8 ? 1 : 0 }); set(cta, { s: sp((tc - 2.2) / .4) * (1 + .03 * Math.sin(tc * 6)), o: tc > 2.2 ? 1 : 0 }); set(cta2, { o: clamp((tc - 3.2) / .3) }); }
  }

  const cue = cues.find(c => t >= c.a - .05 && t <= c.b + .4);

  if (k === "cta" && cue) cap.style.opacity = 0;      // the CTA graphics carry the line
  await new Promise(r => requestAnimationFrame(() => r()));
};
