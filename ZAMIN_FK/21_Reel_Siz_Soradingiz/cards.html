@font-face{font-family:Mb;src:url(../web/city/assets/fonts/Montserrat_700Bold.ttf)}
body{margin:0;background:transparent;font-family:M,sans-serif}.row{display:flex;gap:30px;padding:30px;width:max-content}</style><div class=row id=r></div><script>
const CREST="../03_Approved_Assets/ZFK_CREST_MASTER_V01_P_2048.png";
function card(n,name,age,place,ovr,img,st,accent){
 const rows=st.map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><b style="font-size:40px">${v}</b><span style="font-size:30px;opacity:.85;font-family:Mb">${k}</span></div>`).join("");
 return `<div id=c${n} style="width:430px;height:720px;border-radius:38px;padding:26px;box-sizing:border-box;color:#fff;background:linear-gradient(160deg,${accent} 0%,#0D2557 70%);border:7px solid #FFD23F;box-shadow:0 18px 40px rgba(0,0,0,.5);position:relative;overflow:hidden">
 <div style="position:absolute;left:26px;top:20px;text-align:center"><div style="font-size:92px;font-weight:900;line-height:1">${ovr}</div><div style="font-size:32px;font-weight:900;color:#FFD23F">HIM</div><img src="${CREST}" style="height:70px;margin-top:8px"></div>
 <img src="${img}" style="position:absolute;right:-10px;top:24px;height:330px">
 <div style="position:absolute;left:0;right:0;top:350px;text-align:center;font-size:${name.length>10?44:50}px;font-weight:900;letter-spacing:1px">${name.toUpperCase()}</div>
 <div style="position:absolute;left:0;right:0;top:410px;text-align:center;font-size:28px;font-weight:700;color:#9DB8FF;font-family:Mb">${age} YOSH • ${place}</div>
 <div style="position:absolute;left:36px;right:36px;top:460px;display:grid;grid-template-columns:1fr 1fr;column-gap:40px;border-top:3px solid rgba(255,255,255,.3);padding-top:10px">${rows}</div>
 <div style="position:absolute;right:20px;bottom:16px;width:76px;height:76px;border-radius:50%;background:#FFD23F;color:#0D2557;font-size:52px;font-weight:900;display:flex;align-items:center;justify-content:center">${n}</div></div>`}
const r=document.getElementById("r");
r.insertAdjacentHTML("beforeend",card(1,"Kwame",25,"GANA",74,"assets/p1_sprite.png",[["TEZ",71],["HIM",76],["PAS",62],["KUCH",82],["DRB",58],["ZARB",45]],"#2a62d6"));
r.insertAdjacentHTML("beforeend",card(2,"Jasurbek",19,"O‘ZBEKISTON",66,"assets/p2_sprite.png",[["TEZ",68],["HIM",61],["PAS",55],["KUCH",66],["DRB",52],["ZARB",38]],"#1F4FB8"));
</script>
