# Hourly ZAMIN FK squad refresh.
# Setup required before this workflow can call Render:
#   Repository Settings -> Secrets and variables -> Actions -> New repository secret
#   CRON_SECRET    = same long random secret configured in the Render service environment
# RENDER_APP_URL is optional; it defaults to the current ZAMIN FK city service URL.
# Scheduled workflows run from the default branch, so merge this file before expecting
# the hourly schedule to run. workflow_dispatch is available for a manual test.
name: ZAMIN FK hourly squad refresh

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-squad:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secrets
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL || 'https://zaminfk-city.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$RENDER_APP_URL" || { echo "Missing Render service URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Missing CRON_SECRET repository secret"; exit 1; }

      - name: Refresh official squad and stadium lineup
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL || 'https://zaminfk-city.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --retry 2 --retry-delay 10 --retry-all-errors \
            --max-time 90 \
            -X POST "${RENDER_APP_URL%/}/api/internal/squad/refresh" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json"
