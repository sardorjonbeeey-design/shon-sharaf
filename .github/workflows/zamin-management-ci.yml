name: ZAMIN FK isolated management checks
on:
  push:
    branches:
      - zamin-management-isolated
    paths:
      - 'ZAMIN_FK_MANAGEMENT/game_server/**'
      - 'ZAMIN_FK_MANAGEMENT/game_client/**'
      - '.github/workflows/zamin-management-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZAMIN_FK_MANAGEMENT/game_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --omit=dev
      - name: Check server JavaScript syntax
        run: for file in src/*.js; do node --check "$file"; done
      - name: Check client JavaScript syntax
        run: node --check ../game_client/app.js && node --check ../game_client/config.js
      - name: Run automated tests
        run: npm test
      - name: Build deployment image
        working-directory: ZAMIN_FK_MANAGEMENT
        run: docker build -f game_server/Dockerfile .
